name: rust-01b-materialize

on:
  push:
    branches:
      - agent/rust-01b-production-logging
    paths:
      - ".github/workflows/rust-01b-materialize.yml"

permissions:
  contents: write

defaults:
  run:
    shell: pwsh

jobs:
  materialize:
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          clean: true
          persist-credentials: true
          ref: agent/rust-01b-production-logging
          show-progress: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Activate pnpm
        run: |
          $ErrorActionPreference = "Stop"
          corepack enable
          corepack prepare pnpm@11.11.0 --activate
      - name: Install Rust 1.97.1
        run: |
          $ErrorActionPreference = "Stop"
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt
          rustup default 1.97.1
      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile --reporter=silent
      - name: Materialize Rust lockfile and compile
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Apply canonical formatting and docs generation
        run: |
          $ErrorActionPreference = "Stop"
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --all
          pnpm fmt
          node scripts/build-toc.mjs
      - name: Remove temporary workflow and commit
        run: |
          $ErrorActionPreference = "Stop"
          Remove-Item .github/workflows/rust-01b-materialize.yml
          git add apps/desktop/src-tauri/Cargo.lock apps/desktop/src-tauri/Cargo.toml apps/desktop/src-tauri/src docs .github/workflows/rust-01b-materialize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: materialize RUST-01B logging integration"
          git push origin HEAD:agent/rust-01b-production-logging
