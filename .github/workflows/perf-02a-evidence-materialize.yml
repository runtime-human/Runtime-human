name: perf-02a-evidence-materialize

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/perf-02a-evidence-materialize.yml"

permissions:
  contents: write

defaults:
  run:
    shell: pwsh

jobs:
  materialize:
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          clean: true
          fetch-depth: 0
          persist-credentials: true
          ref: agent/perf-02a-windows-evidence
          show-progress: false
      - name: Merge canonical main
        run: |
          $ErrorActionPreference = "Stop"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Activate pnpm
        run: |
          $ErrorActionPreference = "Stop"
          corepack enable
          corepack prepare pnpm@11.11.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --reporter=silent
      - name: Format and generate docs
        run: |
          $ErrorActionPreference = "Stop"
          pnpm fmt
          node scripts/build-toc.mjs
      - name: Typecheck
        run: pnpm typecheck
      - name: Focused evidence tests
        run: pnpm exec vitest run tests/desktop-performance-evidence.test.ts
      - name: Remove temporary workflows and commit
        run: |
          $ErrorActionPreference = "Stop"
          Remove-Item .github/workflows/perf-02a-evidence-materialize.yml
          Remove-Item .github/workflows/perf-02a-evidence-diagnostic.yml
          git add package.json scripts tests docs .github/workflows/perf-02a-evidence-materialize.yml .github/workflows/perf-02a-evidence-diagnostic.yml
          git commit -m "build: materialize desktop evidence contract"
          git push origin HEAD:agent/perf-02a-windows-evidence
