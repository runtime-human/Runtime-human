name: close-ui-02a-status

on:
  push:
    branches:
      - agent/close-ui-02a-status
    paths:
      - ".github/workflows/close-ui-02a-status.yml"

permissions:
  contents: write

defaults:
  run:
    shell: pwsh

jobs:
  close:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/close-ui-02a-status
          clean: true
          persist-credentials: true
          show-progress: false
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Close UI-02A in canonical status
        run: |
          $ErrorActionPreference = "Stop"
          @'
          const fs = require("node:fs");
          const path = "docs/EXECUTION-STATUS.jsonc";
          const status = JSON.parse(fs.readFileSync(path, "utf8"));
          status.updated = "2026-07-27";
          status.mainHeadAtCurrentSliceStart = "2fc70bdd0dcda9d73eda3d8aa9ed7fdd1e0136ce";
          status.currentPhase = "career-routing";
          const milestone = status.milestones.find((item) => item.id === "desktop-shell-extraction");
          if (!milestone) throw new Error("desktop-shell-extraction milestone not found");
          milestone.status = "complete";
          delete milestone.branch;
          milestone.commit = "2fc70bdd0dcda9d73eda3d8aa9ed7fdd1e0136ce";
          status.verification.qualityGate = "complete-pr-42";
          status.verification.currentConstraint = "next-delivery-ui-02b-routing-then-ui-02c-career-overview";
          status.verification.currentPullRequestMayMerge = false;
          fs.writeFileSync(path, `${JSON.stringify(status, null, 2)}\n`);
          '@ | node
          node scripts/build-toc.mjs
          node scripts/build-toc.mjs --check
      - name: Enforce documentation-only mutation
        run: |
          $ErrorActionPreference = "Stop"
          $allowed = @("docs/EXECUTION-STATUS.jsonc", "docs/MANIFEST.jsonc", "docs/CATALOG.md")
          $changed = @(git diff --name-only)
          $unexpected = @($changed | Where-Object { $_ -notin $allowed })
          if ($unexpected.Count -gt 0) { throw "Unexpected changed paths: $($unexpected -join ', ')" }
          if ($changed.Count -lt 1 -or $changed.Count -gt 3) { throw "Unexpected documentation change count: $($changed.Count)" }
          git add -- $changed
          $staged = @(git diff --cached --name-only)
          $unexpectedStaged = @($staged | Where-Object { $_ -notin $allowed })
          if ($unexpectedStaged.Count -gt 0) { throw "Invalid staged paths: $($staged -join ', ')" }
      - name: Commit closure state
        run: |
          $ErrorActionPreference = "Stop"
          git config user.name "runtime-human-ci"
          git config user.email "runtime-human-ci@users.noreply.github.com"
          git commit -m "docs: close merged UI-02A execution status"
          git push origin HEAD:agent/close-ui-02a-status
