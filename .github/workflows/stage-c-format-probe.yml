name: stage-c-format-probe

on:
  push:
    branches:
      - feat/engine-02-scenario-capability-registry-stage-c

permissions:
  contents: read

jobs:
  format-probe:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          show-progress: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.11.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.20.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --reporter=silent
      - name: Print canonical formatter patch
        shell: pwsh
        run: |
          pnpm exec oxfmt packages/game-devtools/src/scenario/certify-scenario-program.ts packages/game-devtools/src/scenario/resolve-scenario-capabilities.ts
          git diff -- packages/game-devtools/src/scenario/certify-scenario-program.ts packages/game-devtools/src/scenario/resolve-scenario-capabilities.ts
