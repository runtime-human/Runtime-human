name: ui-02a-apply-format

on:
  pull_request:
    paths:
      - ".github/workflows/ui-02a-apply-format.yml"

permissions:
  contents: write

defaults:
  run:
    shell: pwsh

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/ui-02a-extract-desktop-shell'
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/ui-02a-extract-desktop-shell
          clean: true
          persist-credentials: true
          show-progress: false
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Install formatter
        run: |
          $ErrorActionPreference = "Stop"
          corepack enable
          corepack prepare pnpm@11.11.0 --activate
          corepack pnpm install --frozen-lockfile --reporter=silent
      - name: Apply repository formatter
        run: corepack pnpm fmt
      - name: Enforce UI-02A-only formatting mutation
        run: |
          $ErrorActionPreference = "Stop"
          $allowed = @(
            "apps/desktop/src/january/JanuaryRuntimeScreen.stories.tsx",
            "apps/desktop/src/january/JanuaryRuntimeScreen.tsx",
            "apps/desktop/src/january/january-runtime.css",
            "apps/desktop/src/main.tsx",
            "apps/desktop/src/shell/DesktopShell.stories.tsx",
            "apps/desktop/src/shell/DesktopShell.tsx",
            "apps/desktop/src/shell/desktop-navigation.ts",
            "apps/desktop/src/shell/desktop-shell.css",
            "tests/desktop-shell.test.tsx",
            "tests/tsconfig.json"
          )
          $changed = @(git diff --name-only)
          if ($changed.Count -eq 0) {
            throw "Formatter produced no changes; expected a correction from the permanent gate"
          }
          $unexpected = @($changed | Where-Object { $_ -notin $allowed })
          if ($unexpected.Count -gt 0) {
            throw "Unexpected formatted paths: $($unexpected -join ', ')"
          }
          git add -- $changed
          $staged = @(git diff --cached --name-only)
          $unexpectedStaged = @($staged | Where-Object { $_ -notin $allowed })
          if ($unexpectedStaged.Count -gt 0 -or $staged.Count -ne $changed.Count) {
            throw "Invalid staged formatting paths: $($staged -join ', ')"
          }
      - name: Commit canonical formatting to UI-02A branch
        run: |
          $ErrorActionPreference = "Stop"
          git config user.name "runtime-human-ci"
          git config user.email "runtime-human-ci@users.noreply.github.com"
          git commit -m "style: apply canonical UI-02A formatting"
          git push origin HEAD:agent/ui-02a-extract-desktop-shell
