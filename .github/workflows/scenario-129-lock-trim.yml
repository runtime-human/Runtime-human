name: scenario-129-lock-trim

on:
  push:
    branches:
      - feat/scenario-shadow-v1-refresh

permissions:
  contents: write

jobs:
  trim:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true
          show-progress: false
      - name: Remove unrelated lockfile churn
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $path = "pnpm-lock.yaml"
          $text = [System.IO.File]::ReadAllText($path)
          $replacements = @(
            @("1.2.0(expect-webdriverio@5.7.0)(supports-color@7.2.0)(tsx@4.23.1)(webdriverio@9.31.5)", "1.2.0(expect-webdriverio@5.7.0)(tsx@4.23.1)(webdriverio@9.31.5)"),
            @("'@wdio/native-core@1.0.0(supports-color@7.2.0)(tsx@4.23.1)':", "'@wdio/native-core@1.0.0(tsx@4.23.1)':"),
            @("'@wdio/tauri-service@1.2.0(expect-webdriverio@5.7.0)(supports-color@7.2.0)(tsx@4.23.1)(webdriverio@9.31.5)':", "'@wdio/tauri-service@1.2.0(expect-webdriverio@5.7.0)(tsx@4.23.1)(webdriverio@9.31.5)':"),
            @("'@wdio/native-core': 1.0.0(supports-color@7.2.0)(tsx@4.23.1)", "'@wdio/native-core': 1.0.0(tsx@4.23.1)")
          )
          foreach ($pair in $replacements) {
            if (-not $text.Contains($pair[0])) { throw "Expected lockfile text not found: $($pair[0])" }
            $text = $text.Replace($pair[0], $pair[1])
          }
          [System.IO.File]::WriteAllText($path, $text, [System.Text.UTF8Encoding]::new($false))
          git diff -- pnpm-lock.yaml
      - name: Commit trimmed lockfile and self-remove helper
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git rm .github/workflows/scenario-129-lock-trim.yml
          git commit -m "fix(scenario): keep lockfile delta bounded"
          git push origin HEAD:feat/scenario-shadow-v1-refresh
