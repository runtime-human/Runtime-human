name: scenario-129-lock-trim

on:
  push:
    branches:
      - feat/scenario-shadow-v1-refresh

permissions:
  contents: write

jobs:
  trim:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true
          show-progress: false
      - name: Restore main lockfile and apply bounded importer patch
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git fetch origin main --depth=1
          git checkout origin/main -- pnpm-lock.yaml
          $patch = @'
          diff --git a/pnpm-lock.yaml b/pnpm-lock.yaml
          --- a/pnpm-lock.yaml
          +++ b/pnpm-lock.yaml
          @@ -228,6 +228,9 @@ importers:
           
             packages/game-devtools:
               dependencies:
          +      '@runtime-human/game-authoring-schema':
          +        specifier: workspace:*
          +        version: link:../game-authoring-schema
                 '@runtime-human/game-content-compiler':
                   specifier: workspace:*
                   version: link:../game-content-compiler
          '@
          $patch = ($patch -replace "(?m)^          ", "")
          $patch | git apply --whitespace=nowarn -
          git diff --check
          git diff -- pnpm-lock.yaml
      - name: Commit bounded lockfile and self-remove helper
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git rm .github/workflows/scenario-129-lock-trim.yml
          git commit -m "fix(scenario): keep lockfile delta bounded"
          git push origin HEAD:feat/scenario-shadow-v1-refresh
