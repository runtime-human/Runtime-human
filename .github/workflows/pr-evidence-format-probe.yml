name: pr-evidence-format-probe

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  format:
    name: format evidence files / ubuntu-24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          show-progress: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: "11.11.0"
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.20.0"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --reporter=silent

      - name: Apply canonical formatter
        run: pnpm fmt

      - name: Upload formatted evidence files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: formatted-evidence-files
          path: |
            scripts/studio/check-control-plane.mjs
            scripts/studio/evidence-lib.d.mts
            scripts/studioctl.mjs
            tests/studio-pr-evidence.test.ts
          retention-days: 1
          if-no-files-found: error
