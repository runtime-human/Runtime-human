name: diagnose-d3-storybook

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  capture:
    if: github.event.pull_request.head.ref == 'agent/january-1990-persisted-composition'
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          clean: true
          persist-credentials: false
          show-progress: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Activate pnpm
        run: |
          $ErrorActionPreference = "Stop"
          corepack enable
          corepack prepare pnpm@11.11.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --reporter=silent
      - name: Capture Storybook build
        continue-on-error: true
        run: |
          pnpm storybook:build *>&1 | Tee-Object d3-storybook.log
          "EXIT_CODE=$LASTEXITCODE" | Add-Content d3-storybook.log
      - name: Upload Storybook diagnostics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: d3-storybook-diagnostics
          path: d3-storybook.log
          if-no-files-found: error
          retention-days: 1
