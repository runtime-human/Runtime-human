name: diagnose-opt-00b-lint

on:
  pull_request:
    branches:
      - main

concurrency:
  group: diagnose-opt-00b-lint-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true

permissions:
  contents: write

defaults:
  run:
    shell: pwsh

jobs:
  diagnose:
    if: github.event.pull_request.head.ref == 'agent/perf-opt-00b-sqlite-baseline'
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          clean: true
          persist-credentials: true
          show-progress: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Capture exact fast lint diagnostics
        run: |
          corepack enable
          corepack prepare pnpm@11.11.0 --activate
          pnpm install --frozen-lockfile --reporter=silent
          $ErrorActionPreference = "Continue"
          pnpm lint *> lint.log
          $exitCode = $LASTEXITCODE
          $header = "LINT_EXIT=$exitCode`n"
          Set-Content -Path .opt-00b-lint-diagnostic.txt -Value $header -Encoding utf8NoBOM
          Get-Content lint.log | Add-Content .opt-00b-lint-diagnostic.txt -Encoding utf8NoBOM
          Remove-Item lint.log
      - name: Commit diagnostic and remove workflow
        run: |
          git config user.name "runtime-human-agent"
          git config user.email "runtime-human-agent@users.noreply.github.com"
          git rm .github/workflows/diagnose-opt-00b-lint.yml
          git add .opt-00b-lint-diagnostic.txt
          git commit -m "diagnostic: capture OPT-00B lint output"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
