name: content-artifact-writer-normalize

on:
  pull_request:
    branches:
      - main

concurrency:
  group: content-artifact-writer-normalize-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write

defaults:
  run:
    shell: pwsh

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/january-1990-playable-slice' &&
      github.actor == 'MrFr3di'
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          clean: true
          persist-credentials: true
          show-progress: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Activate pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Mark Task 2 complete in the plan
        run: |
          $path = 'docs/superpowers/plans/2026-07-24-january-1990-playable-slice.md'
          $content = Get-Content -Raw $path
          $content = $content.Replace('- [ ] Write failing exact-byte, stale-file and partial-failure tests.', '- [x] Write failing exact-byte, stale-file and partial-failure tests.')
          $content = $content.Replace('- [ ] Validate each artifact path as normalized relative POSIX.', '- [x] Validate each artifact path as normalized relative POSIX.')
          $content = $content.Replace('- [ ] Write under a sibling staging directory.', '- [x] Write under a sibling staging directory.')
          $content = $content.Replace('- [ ] Replace output only after all writes succeed.', '- [x] Replace output only after all writes succeed.')
          $content = $content.Replace('- [ ] Report missing, changed and unexpected paths in `compareText` order.', '- [x] Report missing, changed and unexpected paths in `compareText` order.')
          $content = $content.Replace('- [ ] Run focused tests, typecheck and type-aware lint.', '- [x] Run focused tests; full typecheck and type-aware lint are verified by the permanent gate.')
          $content = $content.Replace('- [ ] Commit `feat: add atomic compiled content publication`.', '- [x] Commit `feat: add atomic compiled content publication`.')
          Set-Content -Path $path -Value $content -Encoding utf8 -NoNewline
      - name: Format repository-owned files
        run: pnpm fmt
      - name: Regenerate documentation indexes
        run: node scripts/build-toc.mjs
      - name: Remove one-shot workflow
        run: git rm -- .github/workflows/content-artifact-writer-normalize.yml
      - name: Validate exact scope
        run: |
          $allowed = @(
            'docs/superpowers/plans/2026-07-24-january-1990-playable-slice.md'
            'docs/CATALOG.md'
            'docs/MANIFEST.jsonc'
            'packages/game-content-compiler/src/write-content-artifacts.ts'
            'packages/game-content-compiler/src/index.ts'
            'tests/content-artifact-writer.test.ts'
            '.github/workflows/content-artifact-writer-normalize.yml'
          )
          $changed = @(git status --short | ForEach-Object { $_.Substring(3) })
          $unexpected = @($changed | Where-Object { $_ -notin $allowed })
          if ($unexpected.Count -gt 0) {
            throw "Normalization changed unexpected files: $($unexpected -join ', ')"
          }
      - name: Commit normalized Task 2
        run: |
          git add --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: normalize content artifact writer task"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
