name: content-source-loader-normalize

on:
  pull_request:
    branches:
      - main

concurrency:
  group: content-source-loader-normalize-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write

defaults:
  run:
    shell: pwsh

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/january-1990-playable-slice' &&
      github.actor == 'MrFr3di'
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          clean: true
          persist-credentials: true
          show-progress: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Activate pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Finalize plan metadata and Task 1 state
        run: |
          $path = 'docs/superpowers/plans/2026-07-24-january-1990-playable-slice.md'
          $content = Get-Content -Raw $path
          if (-not $content.StartsWith('---')) {
            $frontmatter = @'
          ---
          title: "January 1990 playable slice implementation plan"
          type: plan
          status: active
          canon: false
          depends_on: [ADR-001, ADR-004, ADR-005, ADR-007, ADR-019, ADR-020]
          updated: 2026-07-24
          ---

          '@
            $content = $frontmatter + $content
          }
          $content = $content.Replace('- [ ] **Step 1: Write a failing deterministic-order test**', '- [x] **Step 1: Write a failing deterministic-order test**')
          $content = $content.Replace('- [ ] **Step 2: Write failing path and symlink boundary tests**', '- [x] **Step 2: Write failing path and symlink boundary tests**')
          $content = $content.Replace('- [ ] **Step 3: Verify RED**', '- [x] **Step 3: Verify RED**')
          $content = $content.Replace('- [ ] **Step 4: Implement iterative discovery**', '- [x] **Step 4: Implement iterative discovery**')
          $content = $content.Replace('- [ ] **Step 5: Verify GREEN**', '- [x] **Step 5: Verify GREEN**')
          $content = $content.Replace('- [ ] **Step 6: Commit**', '- [x] **Step 6: Commit**')
          Set-Content -Path $path -Value $content -Encoding utf8 -NoNewline
      - name: Format repository-owned source files
        run: pnpm fmt
      - name: Regenerate documentation indexes
        run: node scripts/build-toc.mjs
      - name: Remove temporary workflows
        run: |
          git rm -- .github/workflows/content-source-loader-red.yml
          git rm -- .github/workflows/content-source-loader-normalize.yml
      - name: Validate exact scope
        run: |
          $allowed = @(
            'docs/superpowers/plans/2026-07-24-january-1990-playable-slice.md'
            'docs/CATALOG.md'
            'docs/MANIFEST.jsonc'
            'packages/game-content-compiler/src/load-content-source-files.ts'
            'packages/game-content-compiler/src/index.ts'
            'tests/content-source-loader.test.ts'
            '.github/workflows/content-source-loader-red.yml'
            '.github/workflows/content-source-loader-normalize.yml'
          )
          $changed = @(git status --short | ForEach-Object { $_.Substring(3) })
          $unexpected = @($changed | Where-Object { $_ -notin $allowed })
          if ($unexpected.Count -gt 0) {
            throw "Normalization changed unexpected files: $($unexpected -join ', ')"
          }
      - name: Commit normalized Task 1
        run: |
          git add --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: normalize content source loader task"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
