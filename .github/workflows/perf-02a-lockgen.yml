name: perf-02a-lockgen

on:
  pull_request:
    branches:
      - main
    types: [synchronize]

# Temporary reconciliation helper. This workflow is removed after it commits the
# generated lockfiles for PR #107; the permanent evidence capture remains read-only.
permissions:
  contents: write

defaults:
  run:
    shell: pwsh

jobs:
  locks:
    if: >-
      github.event.pull_request.number == 107 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'perf/perf-02a-hosted-e2-reconciliation'
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
          show-progress: false
          fetch-depth: 1

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: "11.11.0"
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.20.0"
          package-manager-cache: false

      - name: Install Rust 1.97.1
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
          rustc --version
          cargo --version

      - name: Generate exact lockfiles
        env:
          CI: "false"
        run: |
          pnpm install --lockfile-only --ignore-scripts --reporter=silent
          cargo generate-lockfile --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Install generated JavaScript graph
        run: pnpm install --frozen-lockfile --reporter=silent

      - name: Apply the known formatter fix
        run: pnpm exec oxfmt tools/desktop-evidence/src/run-capture-process.ts

      - name: Commit only generated locks and formatter fix
        run: |
          $ErrorActionPreference = "Stop"
          git add -- pnpm-lock.yaml apps/desktop/src-tauri/Cargo.lock tools/desktop-evidence/src/run-capture-process.ts
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Generated lockfiles and formatter output are already materialized."
            exit 0
          }
          if ($LASTEXITCODE -ne 1) {
            throw "Unable to inspect staged reconciliation changes"
          }
          $staged = @(git diff --cached --name-only)
          $allowed = @(
            "pnpm-lock.yaml",
            "apps/desktop/src-tauri/Cargo.lock",
            "tools/desktop-evidence/src/run-capture-process.ts"
          )
          $unexpected = @($staged | Where-Object { $_ -notin $allowed })
          if ($unexpected.Count -gt 0) {
            throw "Unexpected staged files: $($unexpected -join ', ')"
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(perf): materialize hosted E2 lockfiles"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
