name: content-final-test-diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  diagnose:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/compiled-content-foundation'
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          clean: true
          persist-credentials: false
          show-progress: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.11.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --reporter=silent
      - name: Capture current content tests
        continue-on-error: true
        run: |
          pnpm vitest run `
            tests/content-compiler.test.ts `
            tests/content-compiler-invariants.test.ts `
            tests/content-compiler-parser-boundary.test.ts `
            tests/content-compiler-ordering.test.ts `
            tests/content-compiler-golden.test.ts `
            tests/content-compiler-chronology-boundaries.test.ts *>&1 | Tee-Object -FilePath tests.log
          "exit_code=$LASTEXITCODE" | Add-Content tests.log
      - uses: actions/upload-artifact@v4
        with:
          name: content-final-test-diagnostics
          path: tests.log
          if-no-files-found: error
