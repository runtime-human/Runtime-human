name: diagnose-pr33-tests

on:
  pull_request:
    branches:
      - main

concurrency:
  group: diagnose-pr33-tests-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  diagnose:
    if: github.event.pull_request.head.ref == 'agent/performance-baseline-foundation'
    runs-on: self-hosted
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          clean: true
          persist-credentials: false
          show-progress: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.11.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --reporter=silent
      - name: Recorder contract
        if: always()
        continue-on-error: true
        run: pnpm exec vitest run tests/performance-recorder.test.ts
      - name: January instrumentation contract
        if: always()
        continue-on-error: true
        run: pnpm exec vitest run tests/january-1990-performance-instrumentation.test.ts
      - name: January baseline contract
        if: always()
        continue-on-error: true
        run: pnpm exec vitest run tests/january-1990-performance-baseline.test.ts
      - name: Existing desktop regression contracts
        if: always()
        continue-on-error: true
        run: >-
          pnpm exec vitest run
          tests/january-1990-desktop-session.test.ts
          tests/january-1990-desktop-bootstrap.test.ts
          tests/january-1990-desktop-concurrency.test.ts
      - name: Capture full Vitest corpus
        id: full
        if: always()
        continue-on-error: true
        run: >-
          pnpm exec vitest run
          --reporter=json
          --outputFile=artifacts/diagnostics/pr33-full-vitest.json
      - name: Upload full-suite diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr33-full-vitest-diagnostics
          path: artifacts/diagnostics/pr33-full-vitest.json
          if-no-files-found: error
          retention-days: 1
      - name: Preserve full-suite failure status
        if: always() && steps.full.outcome != 'success'
        run: exit 1
