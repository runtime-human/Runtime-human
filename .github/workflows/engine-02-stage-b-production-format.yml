name: engine-02-stage-b-production-format

on:
  push:
    branches:
      - feat/engine-02-scenario-certificate-stage-b

permissions:
  contents: write

jobs:
  format:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true
          show-progress: false
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: "11.11.0"
          run_install: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.20.0"
          package-manager-cache: false
      - name: Install dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile --reporter=silent
      - name: Apply pinned formatter
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          pnpm exec oxfmt packages/game-devtools/src/scenario/certify-scenario-program.ts packages/game-schema/src/index.ts
          git diff --check
      - name: Commit formatted production and self-remove helper
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/game-devtools/src/scenario/certify-scenario-program.ts packages/game-schema/src/index.ts
          git rm .github/workflows/engine-02-stage-b-production-format.yml
          git commit -m "style(engine): format scenario certificate implementation"
          git push origin HEAD:feat/engine-02-scenario-certificate-stage-b
