name: ui-02c-refinalize

on:
  pull_request:
    paths:
      - ".github/workflows/ui-02c-refinalize.yml"

permissions:
  contents: write

defaults:
  run:
    shell: pwsh

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/ui-02c-career-overview'
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/ui-02c-career-overview
          clean: true
          persist-credentials: true
          show-progress: false
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Install repository tools
        run: |
          corepack enable
          corepack prepare pnpm@11.11.0 --activate
          corepack pnpm install --frozen-lockfile --reporter=silent
      - name: Regenerate derived repository state
        run: |
          $ErrorActionPreference = "Stop"
          corepack pnpm content:build
          node scripts/build-toc.mjs
          corepack pnpm fmt
          corepack pnpm content:check
          node scripts/build-toc.mjs --check
          corepack pnpm fmt:check
      - name: Publish derived preview branch
        run: |
          $ErrorActionPreference = "Stop"
          if (-not (git status --porcelain)) { throw "Derived regeneration produced no changes" }
          git config user.name "runtime-human-ci"
          git config user.email "runtime-human-ci@users.noreply.github.com"
          git add -A
          git commit -m "chore: preview UI-02C derived repository state"
          git push --force origin HEAD:agent/ui-02c-derived-preview
