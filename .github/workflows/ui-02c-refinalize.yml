name: ui-02c-refinalize

on:
  pull_request:
    paths:
      - ".github/workflows/ui-02c-refinalize.yml"

permissions:
  contents: write

defaults:
  run:
    shell: pwsh

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/ui-02c-career-overview'
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/ui-02c-career-overview
          clean: true
          persist-credentials: true
          show-progress: false
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Install repository tools
        run: |
          corepack enable
          corepack prepare pnpm@11.11.0 --activate
          corepack pnpm install --frozen-lockfile --reporter=silent
      - name: Regenerate docs and canonical formatting
        run: |
          $ErrorActionPreference = "Stop"
          node scripts/build-toc.mjs
          corepack pnpm fmt
          node scripts/build-toc.mjs --check
          corepack pnpm fmt:check
      - name: Enforce derived UI-02C mutation only
        run: |
          $ErrorActionPreference = "Stop"
          $allowed = @(
            "apps/desktop/src/RuntimeDesktop.stories.tsx",
            "apps/desktop/src/RuntimeDesktop.tsx",
            "apps/desktop/src/january/JanuaryRuntimeScreen.stories.tsx",
            "apps/desktop/src/january/january-screen-model.ts",
            "apps/desktop/src/overview/CareerOverviewScreen.tsx",
            "apps/desktop/src/overview/career-overview-model.ts",
            "apps/desktop/src/overview/career-overview.css",
            "docs/CATALOG.md",
            "docs/EXECUTION-STATUS.jsonc",
            "docs/MANIFEST.jsonc",
            "packages/game-application/src/index.ts",
            "packages/game-application/src/january-1990/index.ts",
            "packages/game-application/src/january-1990/january-result-summary.ts",
            "tests/career-overview-model.test.ts",
            "tests/career-overview-screen.test.tsx",
            "tests/january-1990-result-summary.test.ts",
            "tests/january-1990-runtime-screen.test.tsx"
          )
          $changed = @(git diff --name-only)
          $unexpected = @($changed | Where-Object { $_ -notin $allowed })
          if ($unexpected.Count -gt 0) { throw "Unexpected changed paths: $($unexpected -join ', ')" }
          if ($changed.Count -lt 1) { throw "Refinalization produced no changes" }
          git add -- $changed
      - name: Commit regenerated state
        run: |
          $ErrorActionPreference = "Stop"
          git config user.name "runtime-human-ci"
          git config user.email "runtime-human-ci@users.noreply.github.com"
          git commit -m "chore: refresh UI-02C canonical state"
          git push origin HEAD:agent/ui-02c-career-overview
