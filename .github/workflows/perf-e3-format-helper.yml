name: perf-e3-format-helper

on:
  push:
    branches:
      - perf/perf-02a-e3-series-contract

permissions:
  contents: read

jobs:
  format:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          show-progress: false
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.11.0
          run_install: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.20.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile --reporter=silent
      - name: Print formatter diff
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          pnpm exec oxfmt tests/desktop-performance-evidence-cli.test.ts
          git --no-pager diff -- tests/desktop-performance-evidence-cli.test.ts
