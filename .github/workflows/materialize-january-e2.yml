name: materialize-january-e2

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

defaults:
  run:
    shell: pwsh

jobs:
  materialize-and-cleanup:
    if: github.event.pull_request.head.ref == 'agent/january-1990-hardening-closure'
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          clean: true
          persist-credentials: true
          show-progress: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.11.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --reporter=silent
      - name: Generate bounded trace
        run: pnpm exec tsx scripts/write-january-1990-balance-trace.mts
      - name: Format E2 files
        run: pnpm fmt
      - name: Verify E2 RED to GREEN
        run: |
          pnpm typecheck
          pnpm exec vitest run tests/january-1990-desktop-concurrency.test.ts tests/january-1990-balance-trace.test.ts
      - name: Commit trace and remove workflow
        run: |
          git config user.name "runtime-human-agent"
          git config user.email "runtime-human-agent@users.noreply.github.com"
          git rm .github/workflows/materialize-january-e2.yml
          git add apps/desktop/src/january/january-session-controller.ts scripts tests fixtures/balance
          git commit -m "test: materialize January hardening evidence"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
