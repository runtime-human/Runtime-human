name: materialize-january-e2

on:
  pull_request:
    branches:
      - main

concurrency:
  group: materialize-january-e2-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true

permissions:
  contents: write

defaults:
  run:
    shell: pwsh

jobs:
  materialize-and-cleanup:
    if: github.event.pull_request.head.ref == 'agent/january-1990-hardening-closure'
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          clean: true
          persist-credentials: true
          show-progress: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.11.0 --activate
      - name: Install Rust 1.97.0
        run: |
          rustup toolchain install 1.97.0 --profile minimal --component rustfmt
          rustup default 1.97.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --reporter=silent
      - name: Materialize January E2 evidence
        run: pnpm evidence:january:e2
      - name: Format generated and source files
        run: |
          pnpm fmt
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --all
      - name: Verify TypeScript evidence
        run: |
          pnpm typecheck
          pnpm exec vitest run tests/january-1990-desktop-concurrency.test.ts tests/january-1990-balance-trace.test.ts tests/january-1990-persistence-flow.test.ts
      - name: Verify actual January SQLite flow
        run: >-
          cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
          actual_january_flow_survives_file_backed_reopen_and_replays_commit
          -- --nocapture --test-threads=1
      - name: Commit evidence and remove workflow
        run: |
          git config user.name "runtime-human-agent"
          git config user.email "runtime-human-agent@users.noreply.github.com"
          git rm .github/workflows/materialize-january-e2.yml
          git add -A
          git commit -m "test: finalize January hardening evidence"
          git fetch origin ${{ github.event.pull_request.head.ref }}
          git rebase origin/${{ github.event.pull_request.head.ref }}
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
