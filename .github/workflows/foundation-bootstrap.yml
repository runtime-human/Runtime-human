name: foundation-bootstrap

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/bootstrap-foundation.mjs"
      - ".github/workflows/foundation-bootstrap.yml"

permissions:
  contents: write

jobs:
  generate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Generate scaffold sources
        run: node scripts/bootstrap-foundation.mjs
      - name: Activate exact pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.11.0 --activate
      - name: Generate pnpm lockfile
        run: |
          set +e
          pnpm install --no-frozen-lockfile 2>&1 | tee foundation-install.txt
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add foundation-install.txt
            if ! git diff --cached --quiet; then
              git commit -m "ci: capture Foundation install failure"
              git push origin "HEAD:${{ github.head_ref }}"
            fi
            exit "$status"
          fi
          rm foundation-install.txt
      - name: Format generated JS and configuration
        run: pnpm fmt
      - name: Generate Cargo lockfile
        run: cargo generate-lockfile --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Regenerate documentation indexes
        run: node scripts/build-toc.mjs
      - name: Commit generated Foundation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            package.json pnpm-workspace.yaml pnpm-lock.yaml \
            tsconfig.base.json tsconfig.json vitest.config.ts tests \
            .oxfmtrc.json .oxlintrc.json rust-toolchain.toml \
            scripts/check-boundaries.mjs scripts/check-boundaries.d.mts \
            apps packages .github/workflows/foundation.yml \
            docs/MANIFEST.jsonc docs/CATALOG.md
          if git diff --cached --quiet; then
            echo "Foundation generated files are current."
          else
            git commit -m "build: generate repository Foundation scaffold"
            git push origin "HEAD:${{ github.head_ref }}"
          fi
