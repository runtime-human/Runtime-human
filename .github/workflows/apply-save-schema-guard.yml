name: apply-save-schema-guard

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

defaults:
  run:
    shell: pwsh

jobs:
  patch-test-remove:
    if: github.event.pull_request.head.ref == 'agent/january-1990-persisted-composition'
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          clean: true
          persist-credentials: true
          show-progress: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Activate pnpm
        run: |
          $ErrorActionPreference = "Stop"
          corepack enable
          corepack prepare pnpm@11.11.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --reporter=silent
      - name: Apply focused orchestrator guard
        run: |
          $ErrorActionPreference = "Stop"
          @'
          from pathlib import Path

          path = Path("packages/game-application/src/persisted-month-run-orchestrator.ts")
          source = path.read_text(encoding="utf-8")

          replacements = [
              (
                  '    if (saveResult.kind === "not-found") return { kind: "idle", save: null };\n\n    const runResult = await loadActiveRun(saveId);',
                  '    if (saveResult.kind === "not-found") return { kind: "idle", save: null };\n    const incompatibleSave = blockIncompatibleSave(saveResult.save, null);\n    if (incompatibleSave !== null) return incompatibleSave;\n\n    const runResult = await loadActiveRun(saveId);',
              ),
              (
                  '    if (saveResult.save.revision !== command.expectedSaveRevision) {',
                  '    const incompatibleSave = blockIncompatibleSave(saveResult.save, null);\n    if (incompatibleSave !== null) return incompatibleSave;\n    if (saveResult.save.revision !== command.expectedSaveRevision) {',
              ),
              (
                  '    const runResult = await loadRun(command.runId);\n    if (runResult.kind === "result") return runResult.result;',
                  '    const incompatibleSave = blockIncompatibleSave(saveResult.save, null);\n    if (incompatibleSave !== null) return incompatibleSave;\n\n    const runResult = await loadRun(command.runId);\n    if (runResult.kind === "result") return runResult.result;',
              ),
              (
                  '    const latestSave = latestSaveResult.save;\n    if (latestSave.revision !== source.baseSaveRevision) {',
                  '    const latestSave = latestSaveResult.save;\n    const incompatibleSave = blockIncompatibleSave(latestSave, source);\n    if (incompatibleSave !== null) return incompatibleSave;\n    if (latestSave.revision !== source.baseSaveRevision) {',
              ),
              (
                  '  async function requireWritablePersistence(): Promise<PreflightResult> {',
                  '''  function blockIncompatibleSave(\n    save: SaveRecordV1,\n    run: MonthRunRecordV1 | null,\n  ): PersistedMonthRunResult | null {\n    if (save.saveSchemaFingerprint === options.expectedCompatibility.saveSchemaFingerprint) {\n      return null;\n    }\n    return {\n      kind: "blocked",\n      reason: "incompatible-persistence",\n      message: "Save schema fingerprint is incompatible with the current MonthRun runtime",\n      recovery: null,\n      save,\n      run,\n    };\n  }\n\n  async function requireWritablePersistence(): Promise<PreflightResult> {''',
              ),
          ]

          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one replacement, found {count}: {old[:80]}")
              source = source.replace(old, new, 1)

          path.write_text(source, encoding="utf-8", newline="\n")
          '@ | python -
          pnpm fmt
          pnpm vitest run tests/january-1990-persisted-run.test.ts tests/january-1990-persisted-restart.test.ts tests/january-1990-exactly-once.test.ts tests/persisted-month-run-orchestrator.test.ts
      - name: Commit guard and remove workflow
        run: |
          $ErrorActionPreference = "Stop"
          git rm .github/workflows/apply-save-schema-guard.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/game-application/src tests
          git commit -m "fix: block incompatible save schemas before MonthRun progress"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
