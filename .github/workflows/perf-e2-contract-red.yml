name: perf-e2-contract-red

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/perf-e2-contract-red.yml"
      - ".github/workflows/perf-02a-e2-windows-capture.yml"

permissions:
  contents: read

jobs:
  contract:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          clean: true
          persist-credentials: false
          show-progress: false
      - name: Assert immutable evidence workflow contract
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';

          const workflow = await readFile('.github/workflows/perf-02a-e2-windows-capture.yml', 'utf8');
          assert.match(workflow, /pnpm install --frozen-lockfile/u);
          assert.match(workflow, /cargo check --locked/u);
          assert.match(workflow, /pnpm fmt:check/u);
          assert.match(workflow, /MEASURED_COMMIT/u);
          assert.match(workflow, /git rev-parse HEAD/u);
          assert.doesNotMatch(workflow, /apply-persistence-telemetry-contract\.mjs/u);
          assert.doesNotMatch(workflow, /pnpm install --no-frozen-lockfile/u);
          assert.doesNotMatch(workflow, /pnpm fmt\r?\n/u);
          assert.doesNotMatch(workflow, /git commit -m "fix: materialize validated Windows evidence runtime"/u);
          assert.doesNotMatch(workflow, /git push origin HEAD:agent\/perf-02a-windows-capture-harness/u);
          NODE
