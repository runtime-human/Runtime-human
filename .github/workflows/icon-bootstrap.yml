name: icon-bootstrap

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/icon-bootstrap.yml"

permissions:
  contents: write

jobs:
  generate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          show-progress: false
      - name: Generate deterministic RGBA PNG
        run: |
          python - <<'PY'
          import pathlib
          import struct
          import zlib

          width = 64
          height = 64
          dark = (24, 33, 27, 255)
          light = (244, 241, 232, 255)
          rows = bytearray()
          for y in range(height):
              rows.append(0)
              for x in range(width):
                  inside = 8 <= x < 56 and 8 <= y < 56
                  stripe = 20 <= x < 44 and (19 <= y < 24 or 41 <= y < 46)
                  middle = 20 <= x < 36 and 30 <= y < 35
                  pixel = dark if stripe or middle or not inside else light
                  rows.extend(pixel)

          def chunk(kind, data):
              payload = kind + data
              return struct.pack(">I", len(data)) + payload + struct.pack(">I", zlib.crc32(payload) & 0xFFFFFFFF)

          png = b"\x89PNG\r\n\x1a\n"
          png += chunk(b"IHDR", struct.pack(">IIBBBBB", width, height, 8, 6, 0, 0, 0))
          png += chunk(b"IDAT", zlib.compress(bytes(rows), 9))
          png += chunk(b"IEND", b"")

          target = pathlib.Path("apps/desktop/src-tauri/icons/icon.png")
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_bytes(png)
          PY
      - name: Commit icon
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/src-tauri/icons/icon.png
          if git diff --cached --quiet; then
            echo "Tauri icon is current."
          else
            git commit -m "fix(tauri): add required application icon"
            git push origin "HEAD:${{ github.head_ref }}"
          fi
