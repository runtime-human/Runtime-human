name: apply-january-ts-fixes

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

defaults:
  run:
    shell: pwsh

jobs:
  apply-and-remove-self:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/january-1990-deterministic-month-run'
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          clean: true
          persist-credentials: true
          show-progress: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Activate pnpm
        run: |
          $ErrorActionPreference = "Stop"
          corepack enable
          corepack prepare pnpm@11.11.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --reporter=silent
      - name: Apply exact TypeScript fixes
        run: |
          $ErrorActionPreference = "Stop"

          $stepsPath = "packages/game-core/src/january-1990/january-month-steps.ts"
          $steps = Get-Content -Raw $stepsPath
          $oldComplete = @'
          return {
            type: "complete",
            result: snapshotAuthoritativeValue(createJanuary1990Result(programmingOutcome)),
          };
          '@
          $newComplete = @'
          const result = snapshotAuthoritativeValue(createJanuary1990Result(programmingOutcome));
          if (result === null) throw new TypeError("January terminal result cannot be null");
          return {
            type: "complete",
            result,
          };
          '@
          if (-not $steps.Contains($oldComplete)) { throw "Expected complete block was not found" }
          $steps.Replace($oldComplete, $newComplete) | Set-Content -NoNewline -Encoding utf8 $stepsPath

          $testPath = "tests/january-1990-month-run.test.ts"
          $test = Get-Content -Raw $testPath
          $oldContextEnd = @'
              {
                id: C.syntaxErrorEvent,
                eventType: "syntax-error",
                reasonCode: R.syntaxErrorSituation,
              },
            ],
          });
        }

        function createInitialCheckpoint
        '@
          $newContextEnd = @'
              {
                id: C.syntaxErrorEvent,
                eventType: "syntax-error",
                reasonCode: R.syntaxErrorSituation,
              },
            ],
          } as const satisfies January1990ContentContext);
        }

        function createInitialCheckpoint
        '@
          if (-not $test.Contains($oldContextEnd)) { throw "Expected context fixture ending was not found" }
          $test.Replace($oldContextEnd, $newContextEnd) | Set-Content -NoNewline -Encoding utf8 $testPath

          pnpm fmt
          pnpm typecheck
      - name: Commit fixes and remove workflow
        run: |
          $ErrorActionPreference = "Stop"
          git rm .github/workflows/apply-january-ts-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/game-core/src/january-1990/january-month-steps.ts tests/january-1990-month-run.test.ts
          git commit -m "fix: satisfy January MonthRun authoritative boundaries"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
