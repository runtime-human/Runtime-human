name: docs-01-finalize

on:
  push:
    branches:
      - agent/docs-01-governance
    paths:
      - ".github/workflows/docs-01-finalize.yml"

permissions:
  contents: write

concurrency:
  group: docs-01-finalize
  cancel-in-progress: false

jobs:
  finalize:
    if: github.repository == 'MrFr3di/Runtime-human'
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          clean: true
          fetch-depth: 0
          persist-credentials: true
          ref: agent/docs-01-governance
          show-progress: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Activate pnpm
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          corepack enable
          corepack prepare pnpm@11.11.0 --activate
      - name: Migrate historical metadata and regenerate derived docs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          @'
          import fs from "node:fs";

          const completed = [
            "docs/superpowers/plans/2026-07-23-compiled-content-foundation-review-and-completion.md",
            "docs/superpowers/plans/2026-07-20-determinism-kernel.md",
            "docs/superpowers/plans/2026-07-24-january-1990-playable-slice.md",
            "docs/superpowers/plans/2026-07-20-month-run-protocol.md",
            "docs/superpowers/plans/2026-07-26-sqlite-performance-baseline.md",
            "docs/superpowers/plans/2026-07-19-repository-foundation.md",
            "docs/superpowers/plans/2026-07-22-runtime-human-source-adaptation-register.md",
            "docs/superpowers/plans/2026-07-21-month-run-sqlite-durable-store.md",
          ];
          const accepted = [
            "docs/superpowers/specs/2026-07-20-month-run-protocol-design.md",
            "docs/superpowers/specs/2026-07-21-month-run-sqlite-durable-store-design.md",
            "docs/superpowers/specs/2026-07-22-month-run-sqlite-durable-store-final-addendum.md",
          ];
          const superseded = new Map([
            [
              "docs/superpowers/plans/2026-07-22-runtime-human-execution-status.md",
              "docs/EXECUTION-STATUS.jsonc",
            ],
            [
              "docs/superpowers/plans/2026-07-22-runtime-human-integrated-roadmap.md",
              "docs/plans/ROADMAP.md",
            ],
          ]);

          function updateMetadata(file, status, supersededBy) {
            const raw = fs.readFileSync(file, "utf8");
            const lines = raw.split(/\r?\n/u);
            if (lines[0] !== "---") throw new Error(`${file}: missing front-matter`);
            const end = lines.indexOf("---", 1);
            if (end < 0) throw new Error(`${file}: unclosed front-matter`);

            const statusIndex = lines.findIndex((line, index) => index < end && line.startsWith("status:"));
            const updatedIndex = lines.findIndex((line, index) => index < end && line.startsWith("updated:"));
            if (statusIndex < 0 || updatedIndex < 0) throw new Error(`${file}: incomplete metadata`);

            lines[statusIndex] = `status: ${status}`;
            lines[updatedIndex] = "updated: 2026-07-28";

            const supersededIndex = lines.findIndex(
              (line, index) => index < end && line.startsWith("superseded_by:"),
            );
            if (supersededBy) {
              const value = `superseded_by: ${supersededBy}`;
              if (supersededIndex >= 0) lines[supersededIndex] = value;
              else lines.splice(statusIndex + 1, 0, value);
            } else if (supersededIndex >= 0) {
              lines.splice(supersededIndex, 1);
            }

            fs.writeFileSync(file, `${lines.join("\n").replace(/\n+$/u, "")}\n`, "utf8");
          }

          for (const file of completed) updateMetadata(file, "completed");
          for (const file of accepted) updateMetadata(file, "accepted");
          for (const [file, target] of superseded) updateMetadata(file, "superseded", target);

          const generatorPath = "scripts/build-toc.mjs";
          const generator = fs.readFileSync(generatorPath, "utf8");
          const oldCall = "errors.push(...validateSupersessionTargets(entries));";
          const newCall =
            'errors.push(...validateSupersessionTargets(entries, ["docs/EXECUTION-STATUS.jsonc"]));';
          if (!generator.includes(oldCall)) throw new Error("build-toc supersession call changed");
          fs.writeFileSync(generatorPath, generator.replace(oldCall, newCall), "utf8");
          '@ | node --input-type=module -

          pnpm install --frozen-lockfile --reporter=silent
          node scripts/build-toc.mjs
          pnpm fmt
          node scripts/build-toc.mjs --check
          pnpm vitest run tests/docs-metadata-governance.test.ts

          git rm .github/workflows/docs-01-finalize.yml
          git add -A

          $allowed = @(
            "docs/CATALOG.md",
            "docs/EXECUTION-STATUS.jsonc",
            "docs/INDEX.md",
            "docs/MANIFEST.jsonc",
            "docs/STYLE.md",
            "docs/superpowers/plans/2026-07-19-repository-foundation.md",
            "docs/superpowers/plans/2026-07-20-determinism-kernel.md",
            "docs/superpowers/plans/2026-07-20-month-run-protocol.md",
            "docs/superpowers/plans/2026-07-21-month-run-sqlite-durable-store.md",
            "docs/superpowers/plans/2026-07-22-runtime-human-execution-status.md",
            "docs/superpowers/plans/2026-07-22-runtime-human-integrated-roadmap.md",
            "docs/superpowers/plans/2026-07-22-runtime-human-source-adaptation-register.md",
            "docs/superpowers/plans/2026-07-23-compiled-content-foundation-review-and-completion.md",
            "docs/superpowers/plans/2026-07-24-january-1990-playable-slice.md",
            "docs/superpowers/plans/2026-07-26-sqlite-performance-baseline.md",
            "docs/superpowers/plans/2026-07-28-docs-source-of-truth-governance.md",
            "docs/superpowers/specs/2026-07-20-month-run-protocol-design.md",
            "docs/superpowers/specs/2026-07-21-month-run-sqlite-durable-store-design.md",
            "docs/superpowers/specs/2026-07-22-month-run-sqlite-durable-store-final-addendum.md",
            "package.json",
            "scripts/build-toc.mjs",
            "scripts/docs-metadata.d.mts",
            "scripts/docs-metadata.mjs",
            "tests/docs-metadata-governance.test.ts"
          ) | Sort-Object
          $actual = @(git diff --cached --name-only origin/main | Sort-Object)
          $unexpected = Compare-Object -ReferenceObject $allowed -DifferenceObject $actual
          if ($unexpected) {
            $details = $unexpected | Format-Table | Out-String
            throw "Unexpected DOCS-01 diff:`n$details"
          }

          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: complete source-of-truth governance"
          git push origin HEAD:agent/docs-01-governance
