name: temp-engine03-format

on:
  push:
    branches:
      - feat/engine-03-canonical-simulation-corpus

permissions:
  contents: read

jobs:
  format:
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          show-progress: false
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.11.0
          run_install: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.20.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --reporter=silent
      - name: Format and print target files
        shell: pwsh
        run: |
          pnpm exec oxfmt packages/game-simulation/src/january-simulation-v4.ts packages/game-simulation/src/simulation-corpus.ts tests/january-1990-simulation-properties.test.ts
          $files = @(
            "packages/game-simulation/src/january-simulation-v4.ts",
            "packages/game-simulation/src/simulation-corpus.ts",
            "tests/january-1990-simulation-properties.test.ts"
          )
          foreach ($file in $files) {
            Write-Output "FORMATTED_FILE_BEGIN:$file"
            Write-Output ([Convert]::ToBase64String([IO.File]::ReadAllBytes($file)))
            Write-Output "FORMATTED_FILE_END:$file"
          }
