name: format-snapshot-ui

on:
  pull_request:
    paths:
      - ".github/workflows/format-snapshot-ui.yml"

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  snapshot:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          clean: true
          persist-credentials: false
          show-progress: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Format current UI workspace
        run: |
          $ErrorActionPreference = "Stop"
          corepack enable
          corepack prepare pnpm@11.11.0 --activate
          corepack pnpm install --frozen-lockfile --reporter=silent
          corepack pnpm fmt
          @'
          const fs = require("node:fs");
          const paths = [
            "apps/desktop/src/design/runtime-human-tokens.css",
            "apps/desktop/src/january/JanuaryRuntimeScreen.stories.tsx",
            "apps/desktop/src/january/JanuaryRuntimeScreen.tsx",
            "apps/desktop/src/january/january-runtime.css",
            "apps/desktop/src/main.tsx",
            "tests/january-1990-runtime-screen.test.tsx"
          ];
          const files = Object.fromEntries(paths.map((path) => [path, fs.readFileSync(path, "utf8")]));
          fs.mkdirSync("artifacts/format", { recursive: true });
          fs.writeFileSync("artifacts/format/ui-format-snapshot.json", JSON.stringify(files));
          '@ | node
      - name: Upload format snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ui-format-snapshot
          path: artifacts/format/ui-format-snapshot.json
          if-no-files-found: error
          retention-days: 1
