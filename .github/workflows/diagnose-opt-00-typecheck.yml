name: diagnose-opt-00-typecheck

on:
  pull_request:
    branches:
      - main

concurrency:
  group: diagnose-opt-00-typecheck-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true

permissions:
  contents: write

defaults:
  run:
    shell: pwsh

jobs:
  diagnose:
    if: github.event.pull_request.head.ref == 'agent/perf-opt-00-baseline'
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          clean: true
          fetch-depth: 0
          persist-credentials: true
          show-progress: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Activate pnpm and install
        run: |
          $ErrorActionPreference = "Stop"
          corepack enable
          corepack prepare pnpm@11.11.0 --activate
          pnpm install --frozen-lockfile --reporter=silent
      - name: Capture branch and merge-ref typecheck diagnostics
        run: |
          $ErrorActionPreference = "Continue"
          Remove-Item -Recurse -Force .tsbuild -ErrorAction SilentlyContinue
          pnpm typecheck *> branch-typecheck.log
          $branchExit = $LASTEXITCODE

          git fetch origin refs/pull/${{ github.event.pull_request.number }}/merge:refs/remotes/pull/${{ github.event.pull_request.number }}/merge
          git checkout --detach refs/remotes/pull/${{ github.event.pull_request.number }}/merge
          Remove-Item -Recurse -Force .tsbuild -ErrorAction SilentlyContinue
          pnpm typecheck *> merge-typecheck.log
          $mergeExit = $LASTEXITCODE

          git checkout --force ${{ github.event.pull_request.head.ref }}
          $branchLog = Get-Content branch-typecheck.log -Raw
          $mergeLog = Get-Content merge-typecheck.log -Raw
          $diagnostic = @"
          # OPT-00 TypeScript Diagnostic

          Branch head: `${{ github.event.pull_request.head.sha }}`
          Merge ref: `${{ github.event.pull_request.merge_commit_sha }}`
          Branch exit: `$branchExit`
          Merge exit: `$mergeExit`

          ## Branch output

          ```text
          $branchLog
          ```

          ## Merge-ref output

          ```text
          $mergeLog
          ```
          "@
          New-Item -ItemType Directory -Force docs/performance | Out-Null
          Set-Content -Path docs/performance/TYPECHECK-DIAGNOSTIC.md -Value $diagnostic -Encoding utf8NoBOM
          Remove-Item branch-typecheck.log, merge-typecheck.log -ErrorAction SilentlyContinue
          exit 0
      - name: Commit diagnostic and remove workflow
        run: |
          $ErrorActionPreference = "Stop"
          git config user.name "runtime-human-agent"
          git config user.email "runtime-human-agent@users.noreply.github.com"
          git rm .github/workflows/diagnose-opt-00-typecheck.yml
          git add docs/performance/TYPECHECK-DIAGNOSTIC.md
          git commit -m "diagnostic: capture OPT-00 typecheck failure"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
