name: ui-03-format-helper

on:
  push:
    branches:
      - agent/ui-03-game-shell-sandwich-panels
    paths:
      - ".github/workflows/ui-03-format-helper.yml"

permissions:
  contents: write

defaults:
  run:
    shell: pwsh

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/ui-03-game-shell-sandwich-panels
          clean: true
          persist-credentials: true
          show-progress: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Activate pnpm
        run: |
          $ErrorActionPreference = "Stop"
          corepack enable
          corepack prepare pnpm@11.11.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --reporter=silent
      - name: Format the six reported files
        run: >-
          pnpm exec oxfmt
          apps/desktop/src/panels/SandwichPanel.tsx
          apps/desktop/src/panels/SandwichRail.tsx
          apps/desktop/src/shell/GameShell.tsx
          tests/game-shell.test.tsx
          tests/runtime-human-design-tokens.test.ts
          tests/sandwich-panel.test.tsx
      - name: Commit formatted product diff and remove helper
        run: |
          $ErrorActionPreference = "Stop"
          Remove-Item ".github/workflows/ui-03-format-helper.yml" -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if (git diff --cached --quiet) {
            throw "Formatter produced no diff"
          }
          git commit -m "style: format UI-03 foundation files"
          git push origin HEAD:agent/ui-03-game-shell-sandwich-panels
