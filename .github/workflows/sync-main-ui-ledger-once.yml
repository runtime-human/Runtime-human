name: sync-main-ui-ledger-once

on:
  push:
    branches:
      - agent/ui-03-game-shell-sandwich-panels
    paths:
      - ".github/workflows/sync-main-ui-ledger-once.yml"

concurrency:
  group: sync-main-ui-ledger-once
  cancel-in-progress: true

permissions:
  contents: write

defaults:
  run:
    shell: pwsh

jobs:
  synchronize:
    if: github.actor != 'github-actions[bot]'
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/ui-03-game-shell-sandwich-panels
          fetch-depth: 0
          clean: true
          persist-credentials: true
          show-progress: false
      - name: Merge current main and remove helper
        run: |
          $ErrorActionPreference = "Stop"
          git config --local core.autocrlf false
          git config --local core.eol lf
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
          Remove-Item ".github/workflows/sync-main-ui-ledger-once.yml" -Force
          git add -A
          git diff --cached --check
          git commit -m "chore: remove one-shot UI ledger sync helper"
          git push origin HEAD:agent/ui-03-game-shell-sandwich-panels
