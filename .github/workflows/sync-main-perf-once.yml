name: sync-main-perf-once

on:
  push:
    branches:
      - agent/perf-02a-windows-capture-harness
    paths:
      - ".github/workflows/sync-main-perf-once.yml"

concurrency:
  group: sync-main-perf-once
  cancel-in-progress: true

permissions:
  contents: write

defaults:
  run:
    shell: pwsh

jobs:
  synchronize:
    if: github.actor != 'github-actions[bot]'
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/perf-02a-windows-capture-harness
          fetch-depth: 0
          clean: true
          persist-credentials: true
          show-progress: false
      - name: Merge current main and remove helper
        run: |
          $ErrorActionPreference = "Stop"
          git config --local core.autocrlf false
          git config --local core.eol lf
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit --no-commit origin/main
          $mergeExit = $LASTEXITCODE
          if ($mergeExit -ne 0) {
            $conflicts = @(git diff --name-only --diff-filter=U)
            $allowed = @("docs/CATALOG.md", "docs/MANIFEST.jsonc")
            $unexpected = @($conflicts | Where-Object { $_ -notin $allowed })
            if ($unexpected.Count -gt 0) {
              git merge --abort
              throw "Product conflicts require manual resolution: $($unexpected -join ', ')"
            }
            foreach ($path in $conflicts) {
              git checkout --theirs -- $path
              git add -- $path
            }
          }
          git diff --name-only --diff-filter=U | ForEach-Object {
            throw "Unresolved merge conflict remains: $_"
          }
          git commit --no-edit
          Remove-Item ".github/workflows/sync-main-perf-once.yml" -Force
          git add -A
          git diff --cached --check
          git commit -m "chore: remove one-shot PERF main sync helper"
          git push origin HEAD:agent/perf-02a-windows-capture-harness
