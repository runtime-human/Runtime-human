name: format-probe

on:
  push:
    branches:
      - feat/remote-github-control-plane-slice-a

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          show-progress: false
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: "11.11.0"
          run_install: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.20.0"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --reporter=silent
      - name: Show canonical formatter diff
        shell: pwsh
        run: |
          pnpm exec oxfmt scripts/studio/check-control-plane.mjs scripts/studio/control-plane-lib.mjs scripts/studioctl.mjs scripts/versioning.mjs
          git diff --no-ext-diff --text -- scripts/studio/check-control-plane.mjs scripts/studio/control-plane-lib.mjs scripts/studioctl.mjs scripts/versioning.mjs
