name: close-ui-02b-status

on:
  pull_request:
    paths:
      - ".github/workflows/close-ui-02b-status.yml"

permissions:
  contents: write

defaults:
  run:
    shell: pwsh

jobs:
  close:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/close-ui-02b-status'
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/close-ui-02b-status
          clean: true
          persist-credentials: true
          show-progress: false
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Close UI-02B in canonical status
        run: |
          $ErrorActionPreference = "Stop"
          @'
          const fs = require("node:fs");
          const path = "docs/EXECUTION-STATUS.jsonc";
          const status = JSON.parse(fs.readFileSync(path, "utf8"));
          status.updated = "2026-07-27";
          status.mainHeadAtCurrentSliceStart = "e1f225063fc9c097cf8c4f65463b521a029acbac";
          status.currentPhase = "career-overview-projection";
          const existing = status.milestones.find((item) => item.id === "desktop-routing");
          if (existing) throw new Error("desktop-routing milestone already exists");
          const milestone = {
            id: "desktop-routing",
            status: "complete",
            issue: 44,
            pullRequest: 45,
            scope: [
              "typed-desktop-routes",
              "history-api-navigation",
              "safe-overview-fallback",
              "single-january-controller-lifecycle",
              "route-aware-desktop-composition",
              "honest-overview-placeholder"
            ],
            exclusions: [
              "career-overview-authoritative-projection",
              "new-persistence-reads",
              "new-gameplay",
              "npc-implementation",
              "performance-optimization"
            ],
            evidence: {
              routes: ["/", "/month/current"],
              unknownPathFallback: "overview",
              browserBackForward: true,
              duplicateHistorySuppressed: true,
              modifiedClicksPreserveNativeSemantics: true,
              januaryControllerFactoryCallsAcrossTransitions: 1,
              januaryFeatureOwnsGlobalNavigation: false,
              overviewInventedMetrics: false,
              standaloneRouteStories: 2,
              temporaryWorkflowsRemoved: true
            },
            commit: "e1f225063fc9c097cf8c4f65463b521a029acbac"
          };
          const npcIndex = status.milestones.findIndex((item) => item.id === "npc-foundation");
          if (npcIndex < 0) status.milestones.push(milestone);
          else status.milestones.splice(npcIndex, 0, milestone);
          status.verification.qualityGate = "complete-pr-45";
          status.verification.currentConstraint = "next-delivery-ui-02c-issue-46-career-overview-projection";
          status.verification.currentPullRequestMayMerge = false;
          fs.writeFileSync(path, `${JSON.stringify(status, null, 2)}\n`);
          '@ | node
      - name: Enforce documentation-only mutation
        run: |
          $ErrorActionPreference = "Stop"
          $changed = @(git diff --name-only)
          if ($changed.Count -ne 1 -or $changed[0] -ne "docs/EXECUTION-STATUS.jsonc") {
            throw "Unexpected changed paths: $($changed -join ', ')"
          }
          git add -- docs/EXECUTION-STATUS.jsonc
      - name: Commit closure state
        run: |
          $ErrorActionPreference = "Stop"
          git config user.name "runtime-human-ci"
          git config user.email "runtime-human-ci@users.noreply.github.com"
          git commit -m "docs: close merged UI-02B execution status"
          git push origin HEAD:agent/close-ui-02b-status
