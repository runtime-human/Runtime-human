name: close-ui-status-snapshot

on:
  pull_request:
    paths:
      - ".github/workflows/close-ui-status-snapshot.yml"

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  snapshot:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          clean: true
          persist-credentials: false
          show-progress: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Produce post-merge execution status
        run: |
          $ErrorActionPreference = "Stop"
          @'
          const fs = require("node:fs");
          const path = "docs/EXECUTION-STATUS.jsonc";
          let text = fs.readFileSync(path, "utf8");

          const replacements = [
            [
              '"mainHeadAtCurrentSliceStart": "91903da02b1edd7988f64ef153c7cd045ea481a1"',
              '"mainHeadAtCurrentSliceStart": "5d90caaedfcb02ec09b7058b3a229b230af94fc5"'
            ],
            [
              '"currentPhase": "desktop-design-foundation"',
              '"currentPhase": "product-facing-performance-and-career-overview"'
            ],
            [
              '"status": "implementation-complete",\n      "issue": 37,\n      "pullRequest": 38,\n      "branch": "agent/ui-runtime-shell-foundation",',
              '"status": "complete",\n      "issue": 37,\n      "pullRequest": 38,'
            ],
            [
              '"storybookStatesPreserved": 8\n      }\n    },\n    {\n      "id": "npc-foundation"',
              '"storybookStatesPreserved": 8\n      },\n      "commit": "5d90caaedfcb02ec09b7058b3a229b230af94fc5"\n    },\n    {\n      "id": "npc-foundation"'
            ],
            [
              '"qualityGate": "pending-pr-38-final-head",\n    "currentConstraint": "ui-01-implementation-complete-permanent-gates-and-review-pending",\n    "currentPullRequestMayMerge": false',
              '"qualityGate": "complete-pr-38",\n    "currentConstraint": "next-delivery-issues-39-and-40-planned",\n    "currentPullRequestMayMerge": false'
            ]
          ];

          for (const [before, after] of replacements) {
            if (!text.includes(before)) throw new Error(`Expected status fragment not found: ${before}`);
            text = text.replace(before, after);
          }

          fs.mkdirSync("artifacts/status", { recursive: true });
          fs.writeFileSync("artifacts/status/EXECUTION-STATUS.jsonc", text);
          '@ | node
      - name: Upload status snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ui-01-status-closure
          path: artifacts/status/EXECUTION-STATUS.jsonc
          if-no-files-found: error
          retention-days: 1
