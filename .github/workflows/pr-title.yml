name: pr-title

on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize
      - ready_for_review

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  conventional-title:
    name: conventional PR title
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      PR_TITLE: ${{ github.event.pull_request.title }}
    steps:
      - name: Validate durable squash title
        shell: bash
        run: |
          set -euo pipefail
          pattern='^(feat|fix|refactor|perf|test|docs|build|ci|chore)(\([a-z0-9][a-z0-9._/-]*\))?!?: .+'
          if [[ ! "$PR_TITLE" =~ $pattern ]]; then
            echo 'PR title must be the intended squash commit message.'
            echo 'Expected: <type>(<scope>): <summary> or <type>: <summary>'
            echo 'Allowed types: feat, fix, refactor, perf, test, docs, build, ci, chore.'
            exit 1
          fi
