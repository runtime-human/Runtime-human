name: perf-02a-hosted-materialize

on:
  push:
    branches:
      - agent/perf-02a-windows-capture-harness
    paths:
      - ".github/workflows/perf-02a-hosted-materialize.yml"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/perf-02a-hosted-materialize.yml"

permissions:
  contents: write

defaults:
  run:
    shell: pwsh

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/perf-02a-windows-capture-harness
          fetch-depth: 0
          clean: true
          persist-credentials: true
          show-progress: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Activate pnpm
        run: |
          $ErrorActionPreference = "Stop"
          corepack enable
          corepack prepare pnpm@11.11.0 --activate
          pnpm --version
      - name: Install pinned Rust toolchain
        run: |
          $ErrorActionPreference = "Stop"
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt
          rustup default 1.97.1
          rustc --version
          cargo --version
      - name: Materialize dependency graph
        run: |
          $ErrorActionPreference = "Stop"
          pnpm install --no-frozen-lockfile --reporter=silent
          cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml --features performance-evidence
      - name: Normalize sources and documentation
        run: |
          $ErrorActionPreference = "Stop"
          pnpm fmt
          node scripts/build-toc.mjs
      - name: Verify TypeScript and evidence contracts
        run: |
          $ErrorActionPreference = "Stop"
          pnpm lint
          pnpm lint:type-aware
          pnpm typecheck
          pnpm evidence:desktop:check
      - name: Verify evidence Cargo feature and executable build
        run: |
          $ErrorActionPreference = "Stop"
          cargo check --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --features performance-evidence
          pnpm evidence:desktop:build
      - name: Commit verified materialized diff
        run: |
          $ErrorActionPreference = "Stop"
          Remove-Item ".github/workflows/perf-02a-hosted-materialize.yml" -Force
          @(
            "apps/desktop/src-tauri/gen/schemas/acl-manifests.json",
            "apps/desktop/src-tauri/gen/schemas/capabilities.json",
            "apps/desktop/src-tauri/gen/schemas/desktop-schema.json",
            "apps/desktop/src-tauri/gen/schemas/windows-schema.json"
          ) | ForEach-Object {
            Remove-Item $_ -Force -ErrorAction SilentlyContinue
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if (git diff --cached --quiet) {
            throw "PERF-02A materialization produced no diff"
          }
          git commit -m "build: materialize embedded Windows evidence harness"
          git push origin HEAD:agent/perf-02a-windows-capture-harness
