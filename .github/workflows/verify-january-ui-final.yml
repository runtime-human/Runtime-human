name: verify-january-ui-final

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

defaults:
  run:
    shell: pwsh

jobs:
  verify-and-cleanup:
    if: github.event.pull_request.head.ref == 'agent/january-1990-playable-ui'
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          clean: true
          persist-credentials: true
          show-progress: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.11.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --reporter=silent
      - name: Format E1 changes
        run: pnpm fmt
      - name: Capture E1 closure diagnostics
        run: |
          pnpm typecheck *>&1 | Tee-Object typecheck.log
          $typecheckExit = $LASTEXITCODE
          pnpm exec vitest run tests/january-1990-desktop-session.test.ts tests/january-1990-screen-model.test.ts tests/january-1990-desktop-bootstrap.test.ts tests/january-1990-runtime-screen.test.tsx *>&1 | Tee-Object tests.log
          $testExit = $LASTEXITCODE
          pnpm storybook:build *>&1 | Tee-Object storybook.log
          $storybookExit = $LASTEXITCODE
          "TYPECHECK_EXIT=$typecheckExit" | Set-Content exit-codes.txt
          "TEST_EXIT=$testExit" | Add-Content exit-codes.txt
          "STORYBOOK_EXIT=$storybookExit" | Add-Content exit-codes.txt
      - name: Upload E1 closure diagnostics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: january-ui-final-diagnostics
          path: |
            typecheck.log
            tests.log
            storybook.log
            exit-codes.txt
          if-no-files-found: error
          retention-days: 1
      - name: Commit formatting and remove workflow
        run: |
          git config user.name "runtime-human-agent"
          git config user.email "runtime-human-agent@users.noreply.github.com"
          git rm .github/workflows/verify-january-ui-final.yml
          git add apps/desktop tests
          if (-not (git diff --cached --quiet)) {
            git commit -m "test: finalize January desktop interaction"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          }
      - name: Fail on captured diagnostics
        run: |
          Get-Content exit-codes.txt
          if ((Get-Content exit-codes.txt) -match "=[1-9]") { exit 1 }
