name: ui-02c-focused

on:
  pull_request:
    paths:
      - ".github/workflows/ui-02c-focused.yml"
      - "packages/game-application/src/january-1990/**"
      - "packages/game-application/src/index.ts"
      - "apps/desktop/src/RuntimeDesktop.tsx"
      - "apps/desktop/src/RuntimeDesktop.stories.tsx"
      - "apps/desktop/src/january/**"
      - "apps/desktop/src/overview/**"
      - "tests/january-1990-result-summary.test.ts"
      - "tests/january-1990-runtime-screen.test.tsx"
      - "tests/career-overview-model.test.ts"
      - "tests/career-overview-screen.test.tsx"

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  focused:
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          clean: true
          persist-credentials: false
          show-progress: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Install dependencies
        run: |
          corepack enable
          corepack prepare pnpm@11.11.0 --activate
          corepack pnpm install --frozen-lockfile --reporter=silent
      - name: Verify UI-02C contracts
        run: corepack pnpm exec vitest run tests/january-1990-result-summary.test.ts tests/career-overview-model.test.ts tests/career-overview-screen.test.tsx tests/january-1990-runtime-screen.test.tsx
      - name: Verify TypeScript graph
        run: corepack pnpm typecheck
      - name: Build desktop renderer
        run: corepack pnpm --filter @runtime-human/desktop build
      - name: Build Storybook states
        run: corepack pnpm storybook:build
