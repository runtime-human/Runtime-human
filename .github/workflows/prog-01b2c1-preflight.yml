name: prog-01b2c1-preflight

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "11.11.0"
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.20.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile --reporter=silent
      - name: Exact TypeScript formatter diff
        run: |
          pnpm exec oxfmt packages/game-application/src/progression packages/game-application/src/persistence-service.ts packages/game-persistence-contracts/src/upgrade.ts tests/professional-atomic-save-upgrade.test.ts
          git diff -- packages/game-application/src/progression packages/game-application/src/persistence-service.ts packages/game-persistence-contracts/src/upgrade.ts tests/professional-atomic-save-upgrade.test.ts
      - name: Exact Rust formatter diff
        run: |
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --all
          git diff -- apps/desktop/src-tauri/src/persistence apps/desktop/src-tauri/src/main.rs
      - name: Typecheck
        run: pnpm typecheck
      - name: Focused application tests
        run: pnpm exec vitest run --project application-node tests/professional-atomic-save-upgrade.test.ts
      - name: Rust persistence regression
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml professional_upgrade -- --nocapture
