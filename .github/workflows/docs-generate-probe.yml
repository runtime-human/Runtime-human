name: docs-generate-probe

on:
  push:
    branches:
      - feat/remote-github-control-plane-slice-a

permissions:
  contents: write

jobs:
  generate:
    if: github.event.head_commit.message != 'docs(tooling): refresh generated indexes'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          show-progress: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.20.0"
          package-manager-cache: false
      - name: Generate documentation indexes
        run: node scripts/build-toc.mjs
      - name: Commit generated documentation
        shell: bash
        run: |
          if git diff --quiet -- docs/MANIFEST.jsonc docs/CATALOG.md; then
            echo "Generated documentation is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/MANIFEST.jsonc docs/CATALOG.md
          git commit -m "docs(tooling): refresh generated indexes"
          git push origin "HEAD:${GITHUB_REF_NAME}"
