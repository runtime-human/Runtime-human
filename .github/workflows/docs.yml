name: docs

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "AGENTS.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "scripts/build-toc.mjs"
      - ".github/workflows/docs.yml"
  pull_request:
    branches:
      - main
    paths:
      - "docs/**"
      - "AGENTS.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "scripts/build-toc.mjs"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: docs-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs-lint:
    name: docs / ubuntu-24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          show-progress: false

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Verify docs front-matter and manifest
        run: node scripts/build-toc.mjs --check
