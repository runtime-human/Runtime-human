name: docs

on:
  push:
    paths:
      - "docs/**"
      - "scripts/build-toc.mjs"
      - ".gitattributes"
      - ".github/workflows/docs.yml"

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

jobs:
  docs-lint:
    permissions:
      contents: read
      statuses: write
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          clean: true
          persist-credentials: false
          show-progress: false
      - name: Normalize tracked files
        run: |
          $ErrorActionPreference = "Stop"
          git config --local core.autocrlf false
          git config --local core.eol lf
          git checkout-index --all --force
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Verify docs front-matter and manifest
        run: node scripts/build-toc.mjs --check
      - name: Publish documentation status
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          STATUS_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
          API_URL: ${{ github.api_url }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          $ErrorActionPreference = "Stop"
          $state = if ($env:JOB_STATUS -eq "success") { "success" } else { "failure" }
          $description = if ($state -eq "success") { "Documentation verification passed" } else { "Documentation verification failed" }
          $body = @{
            state = $state
            context = "self-hosted/docs"
            description = $description
            target_url = "$env:SERVER_URL/$env:REPOSITORY/actions/runs/$env:RUN_ID"
          } | ConvertTo-Json
          Invoke-RestMethod `
            -Method Post `
            -Uri "$env:API_URL/repos/$env:REPOSITORY/statuses/$env:STATUS_SHA" `
            -Headers @{
              Authorization = "Bearer $env:GH_TOKEN"
              Accept = "application/vnd.github+json"
              "X-GitHub-Api-Version" = "2022-11-28"
            } `
            -ContentType "application/json" `
            -Body $body
