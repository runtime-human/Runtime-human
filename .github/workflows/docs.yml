name: docs

on:
  pull_request:
    branches:
      - main
    paths:
      - "docs/**"
      - "scripts/build-toc.mjs"
      - ".github/workflows/docs.yml"

concurrency:
  group: docs-generator-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true

permissions:
  contents: write

defaults:
  run:
    shell: pwsh

jobs:
  generate-index:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/persisted-month-run-orchestration' &&
      github.actor == 'MrFr3di'
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          clean: true
          persist-credentials: true
          show-progress: false
      - name: Normalize tracked files
        run: |
          $ErrorActionPreference = "Stop"
          git config --local core.autocrlf false
          git config --local core.eol lf
          git checkout-index --all --force
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Generate documentation index
        run: node scripts/build-toc.mjs
      - name: Validate generated scope
        run: |
          $ErrorActionPreference = "Stop"
          $changed = @(git diff --name-only)
          $unexpected = @($changed | Where-Object { $_ -notin @('docs/CATALOG.md', 'docs/MANIFEST.jsonc') })
          if ($unexpected.Count -gt 0) {
            throw "Generator changed unexpected files: $($unexpected -join ', ')"
          }
      - name: Commit generated index
        run: |
          $ErrorActionPreference = "Stop"
          git add -- docs/CATALOG.md docs/MANIFEST.jsonc
          if (git diff --cached --quiet) {
            Write-Host "Documentation index is already current."
          } else {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "docs: regenerate documentation index"
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          }
