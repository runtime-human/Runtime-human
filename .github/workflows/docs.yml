name: docs

on:
  push:
    paths:
      - "docs/**"
      - "scripts/build-toc.mjs"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "scripts/build-toc.mjs"
      - ".github/workflows/docs.yml"

permissions:
  contents: read

jobs:
  docs-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verify docs front-matter and manifest
        run: node scripts/build-toc.mjs --check
