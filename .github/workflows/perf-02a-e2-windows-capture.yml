name: perf-02a-e2-windows-capture

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

concurrency:
  group: perf-02a-e2-windows-capture-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

defaults:
  run:
    shell: pwsh

jobs:
  capture:
    if: >-
      github.actor != 'github-actions[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: self-hosted
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/perf-02a-windows-capture-harness
          fetch-depth: 0
          clean: true
          persist-credentials: true
          show-progress: false
      - name: Synchronize with current main
        run: |
          $ErrorActionPreference = "Stop"
          git config --local core.autocrlf false
          git config --local core.eol lf
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          $before = git rev-parse HEAD
          git merge --no-edit origin/main
          $after = git rev-parse HEAD
          if ($after -ne $before) {
            git push origin HEAD:agent/perf-02a-windows-capture-harness
            Write-Host "Synchronized evidence branch with main at $after"
          } else {
            Write-Host "Evidence branch already contains current main"
          }
      - name: Normalize repository
        run: |
          $ErrorActionPreference = "Stop"
          git config --local core.autocrlf false
          git config --local core.eol lf
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout-index --all --force
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Activate pnpm
        run: |
          $ErrorActionPreference = "Stop"
          corepack enable
          corepack prepare pnpm@11.11.0 --activate
          pnpm --version
      - name: Restore Rust toolchain path
        run: |
          $ErrorActionPreference = "Stop"
          $cargoBin = Join-Path $env:USERPROFILE ".cargo\bin"
          $rustup = Join-Path $cargoBin "rustup.exe"
          if (-not (Test-Path $rustup)) {
            throw "rustup.exe was not found at $rustup"
          }
          $cargoBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:PATH = "$cargoBin;$env:PATH"
          & $rustup toolchain install 1.97.1 --profile minimal --component rustfmt
          & $rustup default 1.97.1
          rustc --version
          cargo --version
      - name: Align dependency graph
        run: |
          $ErrorActionPreference = "Stop"
          pnpm install --no-frozen-lockfile --reporter=append-only
          cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml --features performance-evidence
      - name: Materialize closed persistence telemetry contract
        run: |
          $ErrorActionPreference = "Stop"
          node scripts/apply-persistence-telemetry-contract.mjs
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml
          cargo test --locked `
            --manifest-path apps/desktop/src-tauri/Cargo.toml `
            persistence::performance_observability_tests `
            -- --nocapture --test-threads=1
      - name: Materialize and verify evidence sources
        run: |
          $ErrorActionPreference = "Stop"
          pnpm fmt
          node scripts/build-toc.mjs
          pnpm docs:check
          pnpm lint
          pnpm lint:type-aware
          pnpm typecheck
          pnpm evidence:desktop:check
      - name: Commit the exact measured product tree locally
        run: |
          $ErrorActionPreference = "Stop"
          git add -A
          git diff --cached --quiet
          $stagedDiffExit = $LASTEXITCODE
          if ($stagedDiffExit -eq 0) {
            throw "Evidence materialization produced no measured product diff"
          }
          if ($stagedDiffExit -ne 1) {
            throw "Unable to inspect the staged evidence diff; git exited with $stagedDiffExit"
          }
          git commit -m "fix: materialize validated Windows evidence runtime"
          $measuredCommit = git rev-parse HEAD
          Write-Host "Measured product commit: $measuredCommit"
      - name: Preflight WDIO runtime exports
        run: >-
          pnpm --filter @runtime-human/desktop-evidence exec node --input-type=module
          -e "await import('@wdio/tauri-service'); console.log('WDIO Tauri service import succeeded')"
      - name: Build evidence executable
        run: pnpm evidence:desktop:build
      - name: Restore build-generated Tauri schemas
        run: |
          $ErrorActionPreference = "Stop"
          $manifest = "apps/desktop/src-tauri/Cargo.toml"
          $generatedSchemas = @(
            "apps/desktop/src-tauri/gen/schemas/acl-manifests.json",
            "apps/desktop/src-tauri/gen/schemas/capabilities.json",
            "apps/desktop/src-tauri/gen/schemas/desktop-schema.json",
            "apps/desktop/src-tauri/gen/schemas/windows-schema.json"
          )
          Write-Host "--- tree after evidence build ---"
          git status --short
          git diff --quiet -- $manifest
          $manifestDiffExit = $LASTEXITCODE
          if ($manifestDiffExit -eq 1) {
            Write-Host "--- Cargo.toml mutation produced by evidence build ---"
            git diff -- $manifest
          } elseif ($manifestDiffExit -ne 0) {
            throw "Unable to inspect Cargo.toml after evidence build; git exited with $manifestDiffExit"
          }
          foreach ($path in $generatedSchemas) {
            git restore --worktree -- $path
          }
          Write-Host "--- tree after generated-schema restore ---"
          git status --short
          git diff --quiet
          $worktreeDiffExit = $LASTEXITCODE
          git diff --cached --quiet
          $indexDiffExit = $LASTEXITCODE
          if ($worktreeDiffExit -ne 0 -and $worktreeDiffExit -ne 1) {
            throw "Unable to inspect the evidence worktree; git exited with $worktreeDiffExit"
          }
          if ($indexDiffExit -ne 0 -and $indexDiffExit -ne 1) {
            throw "Unable to inspect the evidence index; git exited with $indexDiffExit"
          }
          if ($worktreeDiffExit -eq 1 -or $indexDiffExit -eq 1) {
            throw "Evidence build changed files outside the generated Tauri schema allowlist"
          }
      - name: Capture real Windows startup warmup
        run: |
          $ErrorActionPreference = "Stop"
          git diff --quiet
          $worktreeDiffExit = $LASTEXITCODE
          git diff --cached --quiet
          $indexDiffExit = $LASTEXITCODE
          if ($worktreeDiffExit -ne 0 -and $worktreeDiffExit -ne 1) {
            throw "Unable to inspect the measured worktree; git exited with $worktreeDiffExit"
          }
          if ($indexDiffExit -ne 0 -and $indexDiffExit -ne 1) {
            throw "Unable to inspect the measured index; git exited with $indexDiffExit"
          }
          if ($worktreeDiffExit -eq 1 -or $indexDiffExit -eq 1) {
            throw "Measured product tree changed after the local evidence commit"
          }
          $before = @(
            Get-ChildItem -Path $env:TEMP -Directory -Filter "runtime-human-desktop-evidence-*" -ErrorAction SilentlyContinue |
              ForEach-Object { $_.FullName }
          )
          $commit = git rev-parse HEAD
          pnpm evidence:desktop:capture:startup -- `
            "--commit=$commit" `
            "--process=cold-process" `
            "--os-cache=warm-os-cache" `
            "--database=new-database" `
            "--sample-role=warmup" `
            "--sample-index=0"
          $capture = "artifacts/performance/raw/startup-shell-fmp-cold-process-warm-os-cache-new-database-warmup-0.json"
          if (-not (Test-Path $capture)) {
            throw "Expected raw capture was not written: $capture"
          }
          pnpm evidence:desktop:report -- "--input=$capture" "--output=artifacts/performance/e2a-warmup-report.json"
          Write-Host "--- RAW CAPTURE ---"
          Get-Content $capture
          Write-Host "--- AGGREGATED REPORT ---"
          Get-Content "artifacts/performance/e2a-warmup-report.json"
          $after = @(
            Get-ChildItem -Path $env:TEMP -Directory -Filter "runtime-human-desktop-evidence-*" -ErrorAction SilentlyContinue |
              ForEach-Object { $_.FullName }
          )
          $leaked = @($after | Where-Object { $_ -notin $before })
          if ($leaked.Count -gt 0) {
            throw "Evidence run leaked temporary app-data directories: $($leaked -join ', ')"
          }
      - name: Materialize clean product diff
        run: |
          $ErrorActionPreference = "Stop"
          Remove-Item "scripts/apply-persistence-telemetry-contract.mjs" -Force
          Remove-Item ".github/workflows/perf-02a-e2-windows-capture.yml" -Force
          @(
            "apps/desktop/src-tauri/gen/schemas/acl-manifests.json",
            "apps/desktop/src-tauri/gen/schemas/capabilities.json",
            "apps/desktop/src-tauri/gen/schemas/desktop-schema.json",
            "apps/desktop/src-tauri/gen/schemas/windows-schema.json"
          ) | ForEach-Object {
            Remove-Item $_ -Force -ErrorAction SilentlyContinue
          }
          git add -A
          git diff --cached --quiet
          $stagedDiffExit = $LASTEXITCODE
          if ($stagedDiffExit -eq 0) {
            throw "Evidence cleanup produced no finalization diff"
          }
          if ($stagedDiffExit -ne 1) {
            throw "Unable to inspect the evidence finalization diff; git exited with $stagedDiffExit"
          }
          git commit -m "chore: finalize E2 Windows capture harness"
          git push origin HEAD:agent/perf-02a-windows-capture-harness
