name: perf-02a-e2-windows-capture

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  group: perf-02a-e2-windows-capture-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  capture:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          clean: true
          persist-credentials: false
          show-progress: false
      - name: Normalize repository
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          git config --local core.autocrlf false
          git config --local core.eol lf
          git checkout-index --all --force
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Activate pnpm
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          corepack enable
          corepack prepare pnpm@11.11.0 --activate
          pnpm --version
      - name: Persist Node and pnpm script shell
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $nodeCommand = Get-Command node -ErrorAction Stop
          $pwshCommand = Get-Command pwsh -ErrorAction Stop
          $nodeDirectory = Split-Path $nodeCommand.Source -Parent
          $workspaceBin = Join-Path $env:GITHUB_WORKSPACE "node_modules\.bin"
          $nodeDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $workspaceBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "NODE_EXECUTABLE=$($nodeCommand.Source)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PNPM_CONFIG_SCRIPT_SHELL=$($pwshCommand.Source)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Persisted Node directory: $nodeDirectory"
          Write-Host "Configured pnpm script shell: $($pwshCommand.Source)"
      - name: Restore Rust toolchain path
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $cargoBin = Join-Path $env:USERPROFILE ".cargo\bin"
          $rustup = Join-Path $cargoBin "rustup.exe"
          if (-not (Test-Path $rustup)) {
            throw "rustup.exe was not found at $rustup"
          }
          $cargoBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:PATH = "$cargoBin;$env:PATH"
          & $rustup toolchain install 1.97.1 --profile minimal --component rustfmt
          & $rustup default 1.97.1
          rustc --version
          cargo --version
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile --reporter=append-only
      - name: Verify pnpm script shell
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $configuredShell = (pnpm config get scriptShell).Trim()
          if ([string]::IsNullOrWhiteSpace($configuredShell) -or $configuredShell -eq "undefined") {
            throw "pnpm did not load PNPM_CONFIG_SCRIPT_SHELL"
          }
          if (-not (Test-Path $configuredShell)) {
            throw "Configured pnpm script shell does not exist: $configuredShell"
          }
          & $env:NODE_EXECUTABLE --version
          Write-Host "pnpm script shell: $configuredShell"
      - name: Check documentation
        run: pnpm docs:check
      - name: Check formatting
        run: pnpm fmt:check
      - name: Run fast lint
        run: pnpm lint
      - name: Run type-aware lint
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $nodeDirectory = Split-Path $env:NODE_EXECUTABLE -Parent
          $workspaceBin = Join-Path $env:GITHUB_WORKSPACE "node_modules\.bin"
          $pnpmCommand = Join-Path $nodeDirectory "pnpm.cmd"
          $cmdCommand = Join-Path $env:SystemRoot "System32\cmd.exe"
          if (-not (Test-Path $pnpmCommand)) {
            throw "pnpm.cmd was not found at $pnpmCommand"
          }
          if (-not (Test-Path $cmdCommand)) {
            throw "cmd.exe was not found at $cmdCommand"
          }
          $lintCommand = 'set "PATH={0};{1};%PATH%" && node --version && call "{2}" lint:type-aware' -f `
            $nodeDirectory, $workspaceBin, $pnpmCommand
          & $cmdCommand /d /s /c $lintCommand
          if ($LASTEXITCODE -ne 0) {
            throw "Type-aware lint failed with exit code $LASTEXITCODE"
          }
      - name: Run typecheck
        run: pnpm typecheck
      - name: Verify evidence contracts
        run: pnpm evidence:desktop:check
      - name: Check evidence Rust feature graph
        run: cargo check --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --features performance-evidence
      - name: Verify persistence telemetry contract
        run: >-
          cargo test --locked
          --manifest-path apps/desktop/src-tauri/Cargo.toml
          persistence::performance_observability_tests
          -- --nocapture --test-threads=1
      - name: Restore only Rust-generated Tauri schemas
        run: |
          $ErrorActionPreference = "Stop"
          $generatedSchemas = @(
            "apps/desktop/src-tauri/gen/schemas/acl-manifests.json",
            "apps/desktop/src-tauri/gen/schemas/capabilities.json",
            "apps/desktop/src-tauri/gen/schemas/desktop-schema.json",
            "apps/desktop/src-tauri/gen/schemas/windows-schema.json"
          )
          foreach ($path in $generatedSchemas) {
            git ls-files --error-unmatch -- $path *> $null
            $trackedExit = $LASTEXITCODE
            if ($trackedExit -eq 0) {
              git restore --worktree -- $path
              if ($LASTEXITCODE -ne 0) {
                throw "Unable to restore tracked generated Tauri schema $path"
              }
            } elseif ($trackedExit -eq 1) {
              if (Test-Path $path) {
                Remove-Item $path -Force
              }
            } else {
              throw "Unable to determine whether generated Tauri schema is tracked: $path"
            }
          }
          Write-Host "--- tree after Rust generated-schema cleanup ---"
          $status = @(git status --porcelain --untracked-files=all)
          $status | ForEach-Object { Write-Host $_ }
          if ($status.Count -gt 0) {
            throw "Evidence Rust verification changed reviewed sources outside the generated Tauri schema allowlist"
          }
      - name: Pin exact reviewed product head
        run: |
          $ErrorActionPreference = "Stop"
          git diff --quiet
          $worktreeExit = $LASTEXITCODE
          git diff --cached --quiet
          $indexExit = $LASTEXITCODE
          if ($worktreeExit -ne 0) {
            throw "Reviewed evidence worktree is not clean before build (git diff exit $worktreeExit)"
          }
          if ($indexExit -ne 0) {
            throw "Reviewed evidence index is not clean before build (git diff --cached exit $indexExit)"
          }
          $measuredCommit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to resolve the reviewed evidence head"
          }
          $expectedCommit = "${{ github.event.pull_request.head.sha }}"
          if ($measuredCommit -ne $expectedCommit) {
            throw "Checked out head $measuredCommit does not match PR head $expectedCommit"
          }
          "MEASURED_COMMIT=$measuredCommit" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Measured product commit: $measuredCommit"
      - name: Preflight WDIO runtime exports
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          Push-Location tools/desktop-evidence
          try {
            & $env:NODE_EXECUTABLE --input-type=module -e "await import('@wdio/tauri-service'); console.log('WDIO Tauri service import succeeded')"
          } finally {
            Pop-Location
          }
      - name: Build evidence executable
        run: pnpm evidence:desktop:build
      - name: Restore only build-generated Tauri schemas
        run: |
          $ErrorActionPreference = "Stop"
          $manifest = "apps/desktop/src-tauri/Cargo.toml"
          $generatedSchemas = @(
            "apps/desktop/src-tauri/gen/schemas/acl-manifests.json",
            "apps/desktop/src-tauri/gen/schemas/capabilities.json",
            "apps/desktop/src-tauri/gen/schemas/desktop-schema.json",
            "apps/desktop/src-tauri/gen/schemas/windows-schema.json"
          )
          git diff --quiet -- $manifest
          $manifestExit = $LASTEXITCODE
          if ($manifestExit -eq 1) {
            Write-Host "--- unexpected Cargo.toml mutation produced by evidence build ---"
            git diff -- $manifest
          } elseif ($manifestExit -ne 0) {
            throw "Unable to inspect Cargo.toml after evidence build (git exit $manifestExit)"
          }
          foreach ($path in $generatedSchemas) {
            git ls-files --error-unmatch -- $path *> $null
            $trackedExit = $LASTEXITCODE
            if ($trackedExit -eq 0) {
              git restore --worktree -- $path
              if ($LASTEXITCODE -ne 0) {
                throw "Unable to restore tracked generated Tauri schema $path"
              }
            } elseif ($trackedExit -eq 1) {
              if (Test-Path $path) {
                Remove-Item $path -Force
              }
            } else {
              throw "Unable to determine whether generated Tauri schema is tracked: $path"
            }
          }
          Write-Host "--- tree after generated-schema cleanup ---"
          $status = @(git status --porcelain --untracked-files=all)
          $status | ForEach-Object { Write-Host $_ }
          if ($status.Count -gt 0) {
            throw "Evidence build changed reviewed sources outside the generated Tauri schema allowlist"
          }
      - name: Capture real Windows startup warmup
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $before = @(
            Get-ChildItem -Path $env:TEMP -Directory -Filter "runtime-human-desktop-evidence-*" -ErrorAction SilentlyContinue |
              ForEach-Object { $_.FullName }
          )
          pnpm evidence:desktop:capture:startup -- `
            "--commit=$env:MEASURED_COMMIT" `
            "--process=cold-process" `
            "--os-cache=warm-os-cache" `
            "--database=new-database" `
            "--sample-role=warmup" `
            "--sample-index=0"
          $capture = "artifacts/performance/raw/startup-shell-fmp-cold-process-warm-os-cache-new-database-warmup-0.json"
          $report = "artifacts/performance/e2a-warmup-report.json"
          if (-not (Test-Path $capture)) {
            throw "Expected raw capture was not written: $capture"
          }
          pnpm evidence:desktop:report -- "--input=$capture" "--output=$report"
          $payload = Get-Content $capture -Raw | ConvertFrom-Json
          if ($payload.commit -ne $env:MEASURED_COMMIT) {
            throw "Capture commit $($payload.commit) does not match $env:MEASURED_COMMIT"
          }
          if ($payload.schemaVersion -ne "runtime-human-desktop-performance-capture-v1") {
            throw "Unexpected capture schema: $($payload.schemaVersion)"
          }
          if (
            $payload.classification.process -ne "cold-process" -or
            $payload.classification.osCache -ne "warm-os-cache" -or
            $payload.classification.database -ne "new-database" -or
            $payload.classification.sampleRole -ne "warmup"
          ) {
            throw "Capture classification does not match the E2 warmup contract"
          }
          if ($payload.rustSnapshot.droppedEvents -ne 0) {
            throw "Rust recorder dropped $($payload.rustSnapshot.droppedEvents) event(s)"
          }
          $browserNames = @($payload.browserEntries | ForEach-Object { $_.name })
          foreach ($required in @(
            "app.renderer_bootstrap",
            "app.react_shell_commit",
            "app.january_session_ready",
            "app.first_meaningful_paint"
          )) {
            if ($required -notin $browserNames) {
              throw "Required browser milestone is missing: $required"
            }
          }
          $rustNames = @($payload.rustSnapshot.events | ForEach-Object { $_.name })
          foreach ($required in @(
            "processEntry",
            "tauriSetupStart",
            "persistenceWorkerReady",
            "tauriSetupComplete",
            "mainWindowAvailable"
          )) {
            if ($required -notin $rustNames) {
              throw "Required Rust milestone is missing: $required"
            }
          }
          $invalidQueueDepth = @(
            $payload.rustSnapshot.events |
              Where-Object { $_.queueDepth -ne $null -and $_.name -ne "persistenceQueueWait" }
          )
          if ($invalidQueueDepth.Count -gt 0) {
            throw "queueDepth is present outside persistenceQueueWait"
          }
          Write-Host "--- RAW CAPTURE ---"
          Get-Content $capture
          Write-Host "--- AGGREGATED REPORT ---"
          Get-Content $report
          $after = @(
            Get-ChildItem -Path $env:TEMP -Directory -Filter "runtime-human-desktop-evidence-*" -ErrorAction SilentlyContinue |
              ForEach-Object { $_.FullName }
          )
          $leaked = @($after | Where-Object { $_ -notin $before })
          if ($leaked.Count -gt 0) {
            throw "Evidence run leaked temporary app-data directories: $($leaked -join ', ')"
          }
