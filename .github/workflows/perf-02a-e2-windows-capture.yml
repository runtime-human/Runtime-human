name: perf-02a-e2-windows-capture

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

concurrency:
  group: perf-02a-e2-windows-capture-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

defaults:
  run:
    shell: pwsh

jobs:
  capture:
    if: >-
      github.actor != 'github-actions[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: self-hosted
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/perf-02a-windows-capture-harness
          fetch-depth: 0
          clean: true
          persist-credentials: true
          show-progress: false
      - name: Normalize repository
        run: |
          $ErrorActionPreference = "Stop"
          git config --local core.autocrlf false
          git config --local core.eol lf
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout-index --all --force
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Activate pnpm
        run: |
          $ErrorActionPreference = "Stop"
          corepack enable
          corepack prepare pnpm@11.11.0 --activate
          pnpm --version
      - name: Restore Rust toolchain path
        run: |
          $ErrorActionPreference = "Stop"
          $cargoBin = Join-Path $env:USERPROFILE ".cargo\bin"
          $rustup = Join-Path $cargoBin "rustup.exe"
          if (-not (Test-Path $rustup)) {
            throw "rustup.exe was not found at $rustup"
          }
          $cargoBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:PATH = "$cargoBin;$env:PATH"
          & $rustup toolchain install 1.97.1 --profile minimal --component rustfmt
          & $rustup default 1.97.1
          rustc --version
          cargo --version
      - name: Align dependency graph
        run: |
          $ErrorActionPreference = "Stop"
          pnpm install --no-frozen-lockfile --reporter=append-only
          git add pnpm-lock.yaml
          if (-not (git diff --cached --quiet)) {
            git commit -m "build: align WDIO native runtime dependencies"
            git push origin HEAD:agent/perf-02a-windows-capture-harness
          }
      - name: Preflight WDIO runtime exports
        run: >-
          pnpm --filter @runtime-human/desktop-evidence exec node --input-type=module
          -e "await import('@wdio/tauri-service'); console.log('WDIO Tauri service import succeeded')"
      - name: Install pinned Tauri driver
        run: |
          $ErrorActionPreference = "Stop"
          pnpm evidence:desktop:driver:install
          $version = tauri-driver --version
          if ($version -ne "tauri-driver 2.0.6") {
            throw "Expected tauri-driver 2.0.6, got: $version"
          }
          Write-Host $version
      - name: Build evidence executable
        run: pnpm evidence:desktop:build
      - name: Capture real Windows startup warmup
        run: |
          $ErrorActionPreference = "Stop"
          $before = @(
            Get-ChildItem -Path $env:TEMP -Directory -Filter "runtime-human-desktop-evidence-*" -ErrorAction SilentlyContinue |
              ForEach-Object { $_.FullName }
          )
          $commit = git rev-parse HEAD
          pnpm evidence:desktop:capture:startup -- `
            "--commit=$commit" `
            "--process=cold-process" `
            "--os-cache=warm-os-cache" `
            "--database=new-database" `
            "--sample-role=warmup" `
            "--sample-index=0"
          $capture = "artifacts/performance/raw/startup-shell-fmp-cold-process-warm-os-cache-new-database-warmup-0.json"
          if (-not (Test-Path $capture)) {
            throw "Expected raw capture was not written: $capture"
          }
          pnpm evidence:desktop:report -- "--input=$capture" "--output=artifacts/performance/e2a-warmup-report.json"
          Write-Host "--- RAW CAPTURE ---"
          Get-Content $capture
          Write-Host "--- AGGREGATED REPORT ---"
          Get-Content "artifacts/performance/e2a-warmup-report.json"
          $after = @(
            Get-ChildItem -Path $env:TEMP -Directory -Filter "runtime-human-desktop-evidence-*" -ErrorAction SilentlyContinue |
              ForEach-Object { $_.FullName }
          )
          $leaked = @($after | Where-Object { $_ -notin $before })
          if ($leaked.Count -gt 0) {
            throw "Evidence run leaked temporary app-data directories: $($leaked -join ', ')"
          }
      - name: Remove temporary capture workflow
        run: |
          $ErrorActionPreference = "Stop"
          Remove-Item ".github/workflows/perf-02a-e2-windows-capture.yml" -Force
          git add -A
          git commit -m "chore: remove E2 Windows capture workflow"
          git push origin HEAD:agent/perf-02a-windows-capture-harness
