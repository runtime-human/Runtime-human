name: perf-02a-e2-windows-capture

on:
  pull_request:
    branches:
      - main
    types: [labeled, synchronize]

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  capture:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (
        (github.event.action == 'labeled' &&
         github.event.label.name == 'perf:e2-capture') ||
        (github.event.action == 'synchronize' &&
         contains(github.event.pull_request.labels.*.name, 'perf:e2-capture'))
      )
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: "11.11.0"
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.20.0"
          package-manager-cache: false

      - name: Install Rust 1.97.1
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt
          rustup default 1.97.1
          rustc --version
          cargo --version

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile --reporter=append-only

      - name: Check public repository contract
        run: pnpm public:check

      - name: Check documentation
        run: pnpm docs:check

      - name: Check formatting
        run: pnpm fmt:check

      - name: Run lint
        run: pnpm lint

      - name: Run type-aware lint
        run: pnpm lint:type-aware

      - name: Run typecheck
        run: pnpm typecheck

      - name: Verify evidence contracts
        run: pnpm evidence:desktop:check

      - name: Check evidence Rust feature graph
        run: cargo check --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --features performance-evidence

      - name: Test evidence-only Rust boundary
        run: >-
          cargo test --locked
          --manifest-path apps/desktop/src-tauri/Cargo.toml
          --features performance-evidence
          evidence::tests
          -- --nocapture --test-threads=1

      - name: Restore only Rust-generated Tauri schemas
        run: |
          $ErrorActionPreference = "Stop"
          $generatedSchemas = @(
            "apps/desktop/src-tauri/gen/schemas/acl-manifests.json",
            "apps/desktop/src-tauri/gen/schemas/capabilities.json",
            "apps/desktop/src-tauri/gen/schemas/desktop-schema.json",
            "apps/desktop/src-tauri/gen/schemas/windows-schema.json"
          )
          foreach ($path in $generatedSchemas) {
            git ls-files --error-unmatch -- $path *> $null
            $trackedExit = $LASTEXITCODE
            if ($trackedExit -eq 0) {
              git restore --worktree -- $path
              if ($LASTEXITCODE -ne 0) {
                throw "Unable to restore tracked generated Tauri schema $path"
              }
            } elseif ($trackedExit -eq 1) {
              if (Test-Path $path) {
                Remove-Item $path -Force
              }
            } else {
              throw "Unable to determine whether generated Tauri schema is tracked: $path"
            }
          }
          $status = @(git status --porcelain --untracked-files=all)
          $status | ForEach-Object { Write-Host $_ }
          if ($status.Count -gt 0) {
            throw "Evidence Rust verification changed reviewed sources outside the generated Tauri schema allowlist"
          }

      - name: Pin exact reviewed product head
        run: |
          $ErrorActionPreference = "Stop"
          git diff --quiet
          if ($LASTEXITCODE -ne 0) {
            throw "Reviewed evidence worktree is not clean before build"
          }
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            throw "Reviewed evidence index is not clean before build"
          }
          $measuredCommit = (git rev-parse HEAD).Trim()
          $expectedCommit = "${{ github.event.pull_request.head.sha }}"
          if ($measuredCommit -ne $expectedCommit) {
            throw "Checked out head $measuredCommit does not match PR head $expectedCommit"
          }
          "MEASURED_COMMIT=$measuredCommit" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Measured product commit: $measuredCommit"

      - name: Preflight embedded WDIO runtime
        run: |
          Push-Location tools/desktop-evidence
          try {
            node --input-type=module -e "await import('@wdio/tauri-service'); console.log('WDIO Tauri service import succeeded')"
          } finally {
            Pop-Location
          }

      - name: Build evidence executable
        run: pnpm evidence:desktop:build

      - name: Restore only build-generated Tauri schemas
        run: |
          $ErrorActionPreference = "Stop"
          $generatedSchemas = @(
            "apps/desktop/src-tauri/gen/schemas/acl-manifests.json",
            "apps/desktop/src-tauri/gen/schemas/capabilities.json",
            "apps/desktop/src-tauri/gen/schemas/desktop-schema.json",
            "apps/desktop/src-tauri/gen/schemas/windows-schema.json"
          )
          foreach ($path in $generatedSchemas) {
            git ls-files --error-unmatch -- $path *> $null
            $trackedExit = $LASTEXITCODE
            if ($trackedExit -eq 0) {
              git restore --worktree -- $path
              if ($LASTEXITCODE -ne 0) {
                throw "Unable to restore tracked generated Tauri schema $path"
              }
            } elseif ($trackedExit -eq 1) {
              if (Test-Path $path) {
                Remove-Item $path -Force
              }
            } else {
              throw "Unable to determine whether generated Tauri schema is tracked: $path"
            }
          }
          $status = @(git status --porcelain --untracked-files=all)
          $status | ForEach-Object { Write-Host $_ }
          if ($status.Count -gt 0) {
            throw "Evidence build changed reviewed sources outside the generated Tauri schema allowlist"
          }

      - name: Record bounded runner provenance
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path "artifacts/performance" | Out-Null
          $imageOS = if ([string]::IsNullOrWhiteSpace($env:ImageOS)) { "unknown" } else { $env:ImageOS.Trim() }
          $imageVersion = if ([string]::IsNullOrWhiteSpace($env:ImageVersion)) { "unknown" } else { $env:ImageVersion.Trim() }
          $provenance = [ordered]@{
            schemaVersion = "runtime-human-e2-run-provenance-v1"
            commit = $env:MEASURED_COMMIT
            runnerOS = "${{ runner.os }}"
            runnerArch = "${{ runner.arch }}"
            imageOS = $imageOS
            imageVersion = $imageVersion
            nodeVersion = (node --version).Trim()
            pnpmVersion = (pnpm --version).Trim()
            rustcVersion = (rustc --version).Trim()
            cargoVersion = (cargo --version).Trim()
          }
          $provenance |
            ConvertTo-Json -Depth 3 |
            Set-Content -Path "artifacts/performance/e2-run-provenance.json" -Encoding utf8

      - name: Capture real Windows startup warmup
        run: |
          $ErrorActionPreference = "Stop"
          $before = @(
            Get-ChildItem -Path $env:TEMP -Directory -Filter "runtime-human-desktop-evidence-*" -ErrorAction SilentlyContinue |
              ForEach-Object { $_.FullName }
          )
          pnpm evidence:desktop:capture:startup -- `
            "--commit=$env:MEASURED_COMMIT" `
            "--process=cold-process" `
            "--os-cache=warm-os-cache" `
            "--database=new-database" `
            "--sample-role=warmup" `
            "--sample-index=0"
          $capture = "artifacts/performance/raw/startup-shell-fmp-cold-process-warm-os-cache-new-database-warmup-0.json"
          $report = "artifacts/performance/e2a-warmup-report.json"
          if (-not (Test-Path $capture)) {
            throw "Expected raw capture was not written: $capture"
          }
          pnpm evidence:desktop:report -- "--input=$capture" "--output=$report"
          $payload = Get-Content $capture -Raw | ConvertFrom-Json
          if ($payload.commit -ne $env:MEASURED_COMMIT) {
            throw "Capture commit $($payload.commit) does not match $env:MEASURED_COMMIT"
          }
          if ($payload.schemaVersion -ne "runtime-human-desktop-performance-capture-v1") {
            throw "Unexpected capture schema: $($payload.schemaVersion)"
          }
          if (
            $payload.classification.process -ne "cold-process" -or
            $payload.classification.osCache -ne "warm-os-cache" -or
            $payload.classification.database -ne "new-database" -or
            $payload.classification.sampleRole -ne "warmup"
          ) {
            throw "Capture classification does not match the E2 warmup contract"
          }
          if ($payload.rustSnapshot.droppedEvents -ne 0) {
            throw "Rust recorder dropped $($payload.rustSnapshot.droppedEvents) event(s)"
          }
          $browserNames = @($payload.browserEntries | ForEach-Object { $_.name })
          foreach ($required in @(
            "app.renderer_bootstrap",
            "app.react_shell_commit",
            "app.january_session_ready",
            "app.first_meaningful_paint"
          )) {
            if ($required -notin $browserNames) {
              throw "Required browser milestone is missing: $required"
            }
          }
          $rustNames = @($payload.rustSnapshot.events | ForEach-Object { $_.name })
          foreach ($required in @(
            "processEntry",
            "tauriSetupStart",
            "persistenceWorkerReady",
            "tauriSetupComplete",
            "mainWindowAvailable"
          )) {
            if ($required -notin $rustNames) {
              throw "Required Rust milestone is missing: $required"
            }
          }
          $invalidQueueDepth = @(
            $payload.rustSnapshot.events |
              Where-Object { $_.queueDepth -ne $null -and $_.name -ne "persistenceQueueWait" }
          )
          if ($invalidQueueDepth.Count -gt 0) {
            throw "queueDepth is present outside persistenceQueueWait"
          }
          $after = @(
            Get-ChildItem -Path $env:TEMP -Directory -Filter "runtime-human-desktop-evidence-*" -ErrorAction SilentlyContinue |
              ForEach-Object { $_.FullName }
          )
          $leaked = @($after | Where-Object { $_ -notin $before })
          if ($leaked.Count -gt 0) {
            $leakedNames = @($leaked | ForEach-Object { Split-Path -Leaf $_ })
            throw "Evidence run leaked temporary app-data directories (count=$($leaked.Count)): $($leakedNames -join ', ')"
          }

      - name: Upload warmup evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perf-02a-e2-warmup-${{ github.event.pull_request.head.sha }}
          path: |
            artifacts/performance/raw/startup-shell-fmp-cold-process-warm-os-cache-new-database-warmup-0.json
            artifacts/performance/e2a-warmup-report.json
            artifacts/performance/e2-run-provenance.json
          retention-days: 14
          if-no-files-found: error
