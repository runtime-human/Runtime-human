name: rust-01c-tdd

on:
  push:
    branches:
      - agent/rust-01c-fifo-shutdown

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  focused:
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          clean: true
          persist-credentials: false
          show-progress: false
      - name: Restore Rust toolchain path
        run: |
          $ErrorActionPreference = "Stop"
          $cargoBin = Join-Path $env:USERPROFILE ".cargo\bin"
          $cargoBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:PATH = "$cargoBin;$env:PATH"
          rustc --version
          cargo --version
      - name: Run FIFO shutdown regressions
        run: >-
          cargo test --locked
          --manifest-path apps/desktop/src-tauri/Cargo.toml
          persistence::worker_shutdown_tests
          -- --nocapture
