name: content-format-generator

on:
  pull_request:
    branches:
      - main

concurrency:
  group: content-format-generator-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true

permissions:
  contents: write

defaults:
  run:
    shell: pwsh

jobs:
  format:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/compiled-content-foundation' &&
      github.actor == 'MrFr3di'
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          clean: true
          persist-credentials: true
          show-progress: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Activate pnpm
        run: |
          $ErrorActionPreference = "Stop"
          corepack enable
          corepack prepare pnpm@11.11.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --reporter=silent
      - name: Format repository targets
        run: pnpm fmt
      - name: Validate formatter scope
        run: |
          $ErrorActionPreference = "Stop"
          $allowed = @(
            'packages/game-content/src/compiled-content.ts',
            'packages/game-content/src/index.ts',
            'packages/game-content-compiler/package.json',
            'packages/game-content-compiler/tsconfig.json',
            'packages/game-content-compiler/src/index.ts',
            'tests/content-compiler.test.ts',
            'tests/tsconfig.json',
            'tsconfig.base.json',
            'tsconfig.json',
            'scripts/check-boundaries.mjs'
          )
          $changed = @(git diff --name-only)
          $unexpected = @($changed | Where-Object { $_ -notin $allowed })
          if ($unexpected.Count -gt 0) {
            throw "Formatter changed unexpected files: $($unexpected -join ', ')"
          }
      - name: Commit formatted files
        run: |
          $ErrorActionPreference = "Stop"
          git add -- packages/game-content packages/game-content-compiler tests/content-compiler.test.ts tests/tsconfig.json tsconfig.base.json tsconfig.json scripts/check-boundaries.mjs
          if (git diff --cached --quiet) {
            Write-Host "Content compiler files are already formatted."
          } else {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "style: format content compiler foundation"
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          }
