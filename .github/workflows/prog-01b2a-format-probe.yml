name: prog-01b2a-format-probe

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "11.11.0"
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.20.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile --reporter=silent
      - name: Report canonical format patch only
        shell: bash
        run: |
          pnpm exec oxfmt packages/game-application/src/january-1990/january-professional-experience-bridge.ts tests/january-professional-experience-bridge.test.ts
          git diff -- packages/game-application/src/january-1990/january-professional-experience-bridge.ts tests/january-professional-experience-bridge.test.ts
