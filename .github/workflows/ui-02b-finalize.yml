name: ui-02b-finalize

on:
  pull_request:
    paths:
      - ".github/workflows/ui-02b-finalize.yml"

permissions:
  contents: write

defaults:
  run:
    shell: pwsh

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/ui-02b-desktop-routing'
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/ui-02b-desktop-routing
          clean: true
          persist-credentials: true
          show-progress: false
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Install repository tools
        run: |
          $ErrorActionPreference = "Stop"
          corepack enable
          corepack prepare pnpm@11.11.0 --activate
          corepack pnpm install --frozen-lockfile --reporter=silent
      - name: Generate documentation index and canonical formatting
        run: |
          $ErrorActionPreference = "Stop"
          node scripts/build-toc.mjs
          node scripts/build-toc.mjs --check
          corepack pnpm fmt
          corepack pnpm fmt:check
      - name: Enforce UI-02B-only mutation
        run: |
          $ErrorActionPreference = "Stop"
          $allowed = @(
            "apps/desktop/src/App.tsx",
            "apps/desktop/src/RuntimeDesktop.stories.tsx",
            "apps/desktop/src/RuntimeDesktop.tsx",
            "apps/desktop/src/january/JanuaryRuntimeScreen.stories.tsx",
            "apps/desktop/src/january/JanuaryRuntimeScreen.tsx",
            "apps/desktop/src/main.tsx",
            "apps/desktop/src/overview/CareerOverviewPlaceholder.tsx",
            "apps/desktop/src/overview/career-overview.css",
            "apps/desktop/src/routing/desktop-route.ts",
            "apps/desktop/src/routing/use-desktop-route.ts",
            "apps/desktop/src/shell/DesktopShell.tsx",
            "docs/CATALOG.md",
            "docs/MANIFEST.jsonc",
            "docs/superpowers/plans/2026-07-27-ui-02b-desktop-routing.md",
            "tests/app-routing-lifecycle.test.tsx",
            "tests/desktop-route.test.ts",
            "tests/desktop-shell.test.tsx",
            "tests/january-1990-runtime-screen.test.tsx",
            "tests/runtime-desktop-routing.test.tsx",
            "tests/tsconfig.json",
            "tests/use-desktop-route.test.tsx"
          )
          $changed = @(git diff --name-only)
          if ($changed.Count -eq 0) { throw "Expected generated or formatting changes" }
          $unexpected = @($changed | Where-Object { $_ -notin $allowed })
          if ($unexpected.Count -gt 0) { throw "Unexpected changed paths: $($unexpected -join ', ')" }
          git add -- $changed
          $staged = @(git diff --cached --name-only)
          $unexpectedStaged = @($staged | Where-Object { $_ -notin $allowed })
          if ($unexpectedStaged.Count -gt 0 -or $staged.Count -ne $changed.Count) {
            throw "Invalid staged paths: $($staged -join ', ')"
          }
      - name: Commit canonical UI-02B state
        run: |
          $ErrorActionPreference = "Stop"
          git config user.name "runtime-human-ci"
          git config user.email "runtime-human-ci@users.noreply.github.com"
          git commit -m "style: finalize canonical UI-02B state"
          git push origin HEAD:agent/ui-02b-desktop-routing
