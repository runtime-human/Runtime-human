name: docs-catalog-bootstrap

on:
  push:
    branches:
      - docs/auto-index-and-depends
    paths:
      - "scripts/build-toc.mjs"
      - "docs/**"
      - ".github/workflows/docs-catalog-bootstrap.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Generate deterministic documentation derivatives
        run: node scripts/build-toc.mjs
      - name: Verify generated state
        run: node scripts/build-toc.mjs --check
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/MANIFEST.jsonc docs/CATALOG.md
          if git diff --cached --quiet; then
            echo "Generated documentation is current."
          else
            git commit -m "docs: generate full documentation catalog"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
