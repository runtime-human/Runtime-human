name: content-type-fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

defaults:
  run:
    shell: pwsh

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/compiled-content-foundation' &&
      github.actor == 'MrFr3di'
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          clean: true
          persist-credentials: true
          show-progress: false
      - name: Apply readonly JSONPath fix
        run: |
          $ErrorActionPreference = "Stop"
          $path = 'packages/game-content-compiler/src/index.ts'
          $content = Get-Content -Raw -Path $path
          $before = 'findNodeAtLocation(document.root, path)'
          $after = 'findNodeAtLocation(document.root, [...path])'
          if (-not $content.Contains($before)) {
            throw "Expected JSONPath expression was not found"
          }
          $content = $content.Replace($before, $after)
          [System.IO.File]::WriteAllText($path, $content, [System.Text.UTF8Encoding]::new($false))
      - name: Remove temporary diagnostics
        run: |
          git rm -- .github/workflows/content-typecheck-diagnostic.yml
          git rm -- .github/workflows/content-type-fix.yml
      - name: Validate patch scope
        run: |
          $ErrorActionPreference = "Stop"
          $allowed = @(
            'packages/game-content-compiler/src/index.ts',
            '.github/workflows/content-typecheck-diagnostic.yml',
            '.github/workflows/content-type-fix.yml'
          )
          $changed = @(git status --short | ForEach-Object { $_.Substring(3) })
          $unexpected = @($changed | Where-Object { $_ -notin $allowed })
          if ($unexpected.Count -gt 0) {
            throw "Type fix changed unexpected files: $($unexpected -join ', ')"
          }
      - name: Commit fix and cleanup
        run: |
          $ErrorActionPreference = "Stop"
          git add -- packages/game-content-compiler/src/index.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: preserve readonly content diagnostic paths"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
