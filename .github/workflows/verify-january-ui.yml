name: verify-january-ui

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

defaults:
  run:
    shell: pwsh

jobs:
  verify-and-cleanup:
    if: github.event.pull_request.head.ref == 'agent/january-1990-playable-ui'
    runs-on: self-hosted
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          clean: true
          persist-credentials: true
          show-progress: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.11.0 --activate
      - name: Install and update lockfile
        run: pnpm install --no-frozen-lockfile --reporter=silent
      - name: Format repository changes
        run: pnpm fmt
      - name: Typecheck E1 composition
        run: pnpm typecheck
      - name: Run E1 controller and screen tests
        run: pnpm exec vitest run tests/january-1990-desktop-session.test.ts tests/january-1990-screen-model.test.ts
      - name: Commit generated wiring and remove workflow
        run: |
          git config user.name "runtime-human-agent"
          git config user.email "runtime-human-agent@users.noreply.github.com"
          git rm .github/workflows/verify-january-ui.yml
          git add apps/desktop/package.json apps/desktop/tsconfig.app.json pnpm-lock.yaml apps/desktop/src tests
          if (-not (git diff --cached --quiet)) {
            git commit -m "build: finalize January desktop wiring"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          }
