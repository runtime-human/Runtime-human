name: self-hosted-pr17-verify

on:
  push:
    branches:
      - ci/verify-pr17

concurrency:
  group: self-hosted-pr17-verify
  cancel-in-progress: true

jobs:
  verify:
    permissions:
      contents: read
      statuses: write
    runs-on: self-hosted
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
        working-directory: ci-worktree
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          clean: true
          path: ci-worktree
          persist-credentials: false
          show-progress: false
      - name: Normalize tracked files
        run: |
          $ErrorActionPreference = "Stop"
          git config --local core.autocrlf false
          git config --local core.eol lf
          git checkout-index --all --force
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Activate pnpm
        run: |
          $ErrorActionPreference = "Stop"
          corepack enable
          corepack prepare pnpm@11.11.0 --activate
          pnpm --version
      - name: Install Rust 1.97.0
        run: |
          $ErrorActionPreference = "Stop"
          rustup toolchain install 1.97.0 --profile minimal --component rustfmt,clippy
          rustup default 1.97.0
          rustc --version
          cargo --version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --reporter=silent
      - name: Check documentation freshness
        run: pnpm docs:check
      - name: Check formatting
        run: pnpm fmt:check
      - name: Run lint
        run: pnpm lint
      - name: Run typecheck
        run: pnpm typecheck
      - name: Check package boundaries
        run: pnpm boundaries:check
      - name: Run JavaScript tests
        run: pnpm test
      - name: Run type-aware lint
        run: pnpm lint:type-aware
      - name: Build renderer
        run: pnpm build
      - name: Build Storybook
        run: pnpm storybook:build
      - name: Check Rust formatting
        run: pnpm rust:fmt:check
      - name: Check Rust workspace
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
          API_URL: ${{ github.api_url }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          $ErrorActionPreference = "Continue"
          $output = @(& pnpm rust:check 2>&1)
          $exitCode = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }
          if ($exitCode -ne 0) {
            $firstError = $output | Where-Object { "$_" -match "(^|\s)(error|fatal error|linker).*" } | Select-Object -First 1
            $description = if ($null -eq $firstError) { "cargo check failed" } else { "$firstError".Trim() }
            if ($description.Length -gt 140) { $description = $description.Substring(0, 140) }
            $slug = ($description.ToLowerInvariant() -replace "[^a-z0-9]+", "-").Trim("-")
            if ($slug.Length -gt 55) { $slug = $slug.Substring(0, 55).Trim("-") }
            if ($slug.Length -eq 0) { $slug = "unknown" }
            $body = @{
              state = "failure"
              context = "verification/pr17-rust/$slug"
              description = $description
              target_url = "$env:SERVER_URL/$env:REPOSITORY/actions/runs/$env:RUN_ID"
            } | ConvertTo-Json
            Invoke-RestMethod `
              -Method Post `
              -Uri "$env:API_URL/repos/$env:REPOSITORY/statuses/$env:STATUS_SHA" `
              -Headers @{
                Authorization = "Bearer $env:GH_TOKEN"
                Accept = "application/vnd.github+json"
                "X-GitHub-Api-Version" = "2022-11-28"
              } `
              -ContentType "application/json" `
              -Body $body
            exit $exitCode
          }
      - name: Run Rust tests
        run: pnpm rust:test
      - name: Publish verification status
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          STATUS_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
          API_URL: ${{ github.api_url }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          $ErrorActionPreference = "Stop"
          $state = if ($env:JOB_STATUS -eq "success") { "success" } else { "failure" }
          $description = if ($state -eq "success") { "PR 17 product code passed full verification" } else { "PR 17 product code failed full verification" }
          $body = @{
            state = $state
            context = "verification/pr17"
            description = $description
            target_url = "$env:SERVER_URL/$env:REPOSITORY/actions/runs/$env:RUN_ID"
          } | ConvertTo-Json
          Invoke-RestMethod `
            -Method Post `
            -Uri "$env:API_URL/repos/$env:REPOSITORY/statuses/$env:STATUS_SHA" `
            -Headers @{
              Authorization = "Bearer $env:GH_TOKEN"
              Accept = "application/vnd.github+json"
              "X-GitHub-Api-Version" = "2022-11-28"
            } `
            -ContentType "application/json" `
            -Body $body
