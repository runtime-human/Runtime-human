name: perf-02a-hosted-check

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/perf-02a-hosted-check.yml"
      - "apps/desktop/src-tauri/**"
      - "tools/desktop-evidence/**"
      - "tests/desktop-evidence*.test.ts"
      - "scripts/performance/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tests/tsconfig.json"

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          clean: true
          persist-credentials: false
          show-progress: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Activate pnpm
        run: |
          $ErrorActionPreference = "Stop"
          corepack enable
          corepack prepare pnpm@11.11.0 --activate
          pnpm --version
      - name: Install pinned Rust toolchain
        run: |
          $ErrorActionPreference = "Stop"
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt
          rustup default 1.97.1
          rustc --version
          cargo --version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --reporter=silent
      - name: Check formatting
        run: pnpm fmt:check
      - name: Run fast lint
        run: pnpm lint
      - name: Run type-aware lint
        run: pnpm lint:type-aware
      - name: Run TypeScript project build
        run: pnpm typecheck
      - name: Verify evidence contracts and harness tests
        run: pnpm evidence:desktop:check
      - name: Check evidence Cargo feature
        run: cargo check --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --features performance-evidence
      - name: Build no-bundle evidence executable
        run: pnpm evidence:desktop:build
