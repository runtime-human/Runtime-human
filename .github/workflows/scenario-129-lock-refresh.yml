name: scenario-129-lock-refresh

on:
  push:
    branches:
      - feat/scenario-shadow-v1-refresh

permissions:
  contents: write

jobs:
  refresh:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true
          show-progress: false
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: "11.11.0"
          run_install: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.20.0"
          package-manager-cache: false
      - name: Refresh workspace lock importer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          pnpm install --lockfile-only --no-frozen-lockfile --reporter=silent
          git diff -- pnpm-lock.yaml
          if ((git status --porcelain -- pnpm-lock.yaml).Count -eq 0) {
            throw "Expected pnpm-lock.yaml to change"
          }
      - name: Commit lockfile and self-remove helper
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git rm .github/workflows/scenario-129-lock-refresh.yml
          git commit -m "fix(scenario): refresh workspace lockfile"
          git push origin HEAD:feat/scenario-shadow-v1-refresh
