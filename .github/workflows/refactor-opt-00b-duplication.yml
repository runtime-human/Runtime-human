name: refactor-opt-00b-duplication

on:
  pull_request:
    branches:
      - main

concurrency:
  group: refactor-opt-00b-duplication-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true

permissions:
  contents: write

defaults:
  run:
    shell: pwsh

jobs:
  refactor-and-verify:
    if: github.event.pull_request.head.ref == 'agent/perf-opt-00b-sqlite-baseline'
    runs-on: self-hosted
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          clean: true
          persist-credentials: true
          show-progress: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Install toolchains
        run: |
          corepack enable
          corepack prepare pnpm@11.11.0 --activate
          pnpm install --frozen-lockfile --reporter=silent
          rustup toolchain install 1.97.0 --profile minimal --component rustfmt
          rustup default 1.97.0
      - name: Reuse shared January fixture in SQLite baseline
        run: |
          @'
          import fs from "node:fs";

          const path = "apps/desktop/src-tauri/src/persistence/sqlite_performance.rs";
          let source = fs.readFileSync(path, "utf8");
          const importBefore = `use serde::{Deserialize, Serialize};
          use tempfile::TempDir;

          use super::{
              BeginPersistedMonthRunCommandV1, CommitPersistedMonthRunCommandV1, CreateSaveCommandV1,
              LoadActiveMonthRunQueryV1, LoadSaveQueryV1, MutationOutcome, PersistenceHandle,
              StoreMonthRunBoundaryCommandV1,
          };

          const FIXTURE_JSON: &str =
              include_str!("../../../../../fixtures/persistence/january-1990-persistence-flow-v1.json");
          `;
          const importAfter = `use serde::Serialize;
          use tempfile::TempDir;

          use super::{
              january_flow_fixture::{
                  load_january_persistence_flow_fixture, JanuaryPersistenceFlowFixture,
              },
              LoadActiveMonthRunQueryV1, LoadSaveQueryV1, MutationOutcome, PersistenceHandle,
          };
          `;
          if (!source.includes(importBefore)) throw new Error("SQLite fixture import block changed");
          source = source.replace(importBefore, importAfter);

          const definitionsStart = source.indexOf("#[derive(Debug, Deserialize)]");
          const definitionsEnd = source.indexOf("#[derive(Clone, Copy)]", definitionsStart);
          if (definitionsStart < 0 || definitionsEnd < 0) {
            throw new Error("SQLite fixture definition block changed");
          }
          source = source.slice(0, definitionsStart) + source.slice(definitionsEnd);

          const loaderBefore =
            "    let fixture: JanuaryPersistenceFlowFixture = serde_json::from_str(FIXTURE_JSON)?;";
          const loaderAfter = "    let fixture = load_january_persistence_flow_fixture();";
          if (!source.includes(loaderBefore)) throw new Error("SQLite fixture loader changed");
          source = source.replace(loaderBefore, loaderAfter);
          fs.writeFileSync(path, source, "utf8");
          '@ | node --input-type=module
          pnpm fmt
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --all
      - name: Verify shared helpers and baseline
        run: |
          pnpm lint
          pnpm typecheck
          cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml sqlite_performance_summary -- --nocapture --test-threads=1
          cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml actual_january_flow_survives_file_backed_reopen_and_replays_commit -- --nocapture --test-threads=1
          pnpm perf:january:sqlite -- --warmups=0 --samples=1 --commit=${{ github.event.pull_request.head.sha }}
      - name: Commit refactor and remove workflow
        run: |
          git config user.name "runtime-human-agent"
          git config user.email "runtime-human-agent@users.noreply.github.com"
          git rm .github/workflows/refactor-opt-00b-duplication.yml
          git add scripts/performance/baseline-cli.mjs scripts/run-january-performance-baseline.mjs scripts/run-january-sqlite-performance-baseline.mjs apps/desktop/src-tauri/src/persistence/mod.rs apps/desktop/src-tauri/src/persistence/january_flow_fixture.rs apps/desktop/src-tauri/src/persistence/january_flow_tests.rs apps/desktop/src-tauri/src/persistence/sqlite_performance.rs
          git commit -m "refactor: deduplicate performance baseline helpers"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
