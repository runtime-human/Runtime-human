name: ui-03-design-foundation

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/ui-03-design-foundation.yml"
      - "apps/desktop/.storybook/preview.ts"
      - "apps/desktop/src/main.tsx"
      - "apps/desktop/src-tauri/tauri.conf.json"
      - "apps/desktop/src/design/runtime-human-tokens.css"
      - "apps/desktop/src/shell/DesktopShell.tsx"
      - "apps/desktop/src/shell/GameShell.tsx"
      - "apps/desktop/src/shell/game-shell.css"
      - "apps/desktop/src/panels/SandwichPanel.tsx"
      - "apps/desktop/src/panels/SandwichRail.tsx"
      - "apps/desktop/src/panels/sandwich-panel.css"
      - "docs/plans/UI-03-GAME-SHELL-SANDWICH-PANELS-IMPLEMENTATION-PLAN.md"
      - "docs/reviews/UI-03-TASK-1-CHECKPOINT.md"
      - "docs/superpowers/specs/2026-07-30-game-shell-selective-sandwich-panels-design.md"
      - "tests/desktop-content-csp.test.ts"
      - "tests/desktop-shell.test.tsx"
      - "tests/game-shell.test.tsx"
      - "tests/game-shell-window-contract.test.ts"
      - "tests/runtime-human-design-tokens.test.ts"
      - "tests/sandwich-panel.test.tsx"
      - "tests/sandwich-rail.test.tsx"
      - "tests/sandwich-rail-reconciliation.test.tsx"

concurrency:
  group: ui-03-design-foundation-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true

permissions:
  contents: write

defaults:
  run:
    shell: pwsh

jobs:
  focused:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/ui-03-game-shell-sandwich-panels
          clean: true
          persist-credentials: true
          show-progress: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Activate pnpm
        run: |
          $ErrorActionPreference = "Stop"
          corepack enable
          corepack prepare pnpm@11.11.0 --activate
          pnpm --version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --reporter=silent
      - name: Run game design contracts
        run: >-
          pnpm exec vitest run
          tests/runtime-human-design-tokens.test.ts
          tests/game-shell.test.tsx
          tests/game-shell-window-contract.test.ts
          tests/desktop-content-csp.test.ts
          tests/desktop-shell.test.tsx
          tests/sandwich-panel.test.tsx
          tests/sandwich-rail.test.tsx
          tests/sandwich-rail-reconciliation.test.tsx
      - name: Check formatting
        run: pnpm fmt:check
      - name: Run fast lint
        run: pnpm lint
      - name: Run type-aware lint
        run: pnpm lint:type-aware
      - name: Run typecheck
        run: pnpm typecheck
      - name: Rebuild and check documentation indexes
        run: |
          $ErrorActionPreference = "Stop"
          node scripts/build-toc.mjs
          pnpm docs:check
      - name: Build renderer
        run: pnpm --filter @runtime-human/desktop build
      - name: Commit clean UI foundation head
        run: |
          $ErrorActionPreference = "Stop"
          Remove-Item ".github/workflows/ui-03-design-foundation.yml" -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if (git diff --cached --quiet) {
            throw "UI-03 finalization produced no workflow-removal or index diff"
          }
          git diff --cached --check
          git commit -m "chore: finalize UI-03 foundation"
          git push origin HEAD:agent/ui-03-game-shell-sandwich-panels
