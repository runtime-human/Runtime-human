name: docs-output-probe

on:
  push:
    branches:
      - feat/remote-github-control-plane-slice-a

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true
          show-progress: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.20.0"
          package-manager-cache: false
      - name: Generate canonical docs outputs
        run: node scripts/build-toc.mjs
      - name: Commit only generated docs outputs
        shell: bash
        run: |
          set -euo pipefail
          git add -- docs/MANIFEST.jsonc docs/CATALOG.md
          if git diff --cached --quiet; then
            echo 'Generated docs already canonical.'
            exit 0
          fi
          changed="$(git diff --cached --name-only)"
          if [ "$changed" != $'docs/CATALOG.md\ndocs/MANIFEST.jsonc' ] && [ "$changed" != $'docs/MANIFEST.jsonc\ndocs/CATALOG.md' ]; then
            echo "Unexpected generated paths:" >&2
            printf '%s\n' "$changed" >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(docs): sync generated catalog'
          git push origin HEAD:feat/remote-github-control-plane-slice-a
