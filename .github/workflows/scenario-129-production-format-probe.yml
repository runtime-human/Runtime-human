name: scenario-129-production-format-probe

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  probe:
    if: github.event.pull_request.number == 129
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          show-progress: false
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: "11.11.0"
          run_install: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.20.0"
          package-manager-cache: false
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile --reporter=silent
      - name: Show exact Oxfmt delta
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          pnpm exec oxfmt packages/game-devtools/src/scenario/analyze-scenario.ts
          git diff -- packages/game-devtools/src/scenario/analyze-scenario.ts
          if ((git status --porcelain -- packages/game-devtools/src/scenario/analyze-scenario.ts).Count -eq 0) {
            throw "Formatter probe produced no delta"
          }
