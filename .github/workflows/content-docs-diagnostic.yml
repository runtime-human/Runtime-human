name: content-docs-diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  generate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/compiled-content-foundation'
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          clean: true
          persist-credentials: false
          show-progress: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Generate documentation indexes
        run: node scripts/build-toc.mjs
      - name: Validate generated scope
        run: |
          $changed = @(git diff --name-only)
          $unexpected = @($changed | Where-Object { $_ -notin @('docs/CATALOG.md', 'docs/MANIFEST.jsonc') })
          if ($unexpected.Count -gt 0) {
            throw "Generator changed unexpected files: $($unexpected -join ', ')"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: content-generated-documentation-index
          path: |
            docs/CATALOG.md
            docs/MANIFEST.jsonc
          if-no-files-found: error
