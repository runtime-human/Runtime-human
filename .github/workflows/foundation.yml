name: foundation

on:
  push:
    branches:
      - agent/month-run-persistence
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig*.json"
      - "vitest.config.ts"
      - "apps/**"
      - "packages/**"
      - "tests/**"
      - "fixtures/**"
      - "docs/**"
      - "scripts/**"
      - "rust-toolchain.toml"
      - ".ox*.json"
      - ".gitattributes"
      - ".github/workflows/foundation.yml"
  pull_request:
    branches:
      - main
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig*.json"
      - "vitest.config.ts"
      - "apps/**"
      - "packages/**"
      - "tests/**"
      - "fixtures/**"
      - "docs/**"
      - "scripts/**"
      - "rust-toolchain.toml"
      - ".ox*.json"
      - ".gitattributes"
      - ".github/workflows/foundation.yml"

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

jobs:
  full-verification:
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: write
    runs-on: self-hosted
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          clean: true
          persist-credentials: ${{ github.event_name == 'push' }}
          show-progress: false
      - name: Normalize tracked files
        run: |
          $ErrorActionPreference = "Stop"
          git config --local core.autocrlf false
          git config --local core.eol lf
          git checkout-index --all --force
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Activate pnpm
        run: |
          $ErrorActionPreference = "Stop"
          corepack enable
          corepack prepare pnpm@11.11.0 --activate
          pnpm --version
      - name: Install Rust 1.97.0
        run: |
          $ErrorActionPreference = "Stop"
          rustup toolchain install 1.97.0 --profile minimal --component rustfmt,clippy
          rustup default 1.97.0
          rustc --version
          cargo --version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --reporter=silent
      - name: Apply final cleanup
        if: github.event_name == 'push'
        run: |
          $ErrorActionPreference = "Stop"
          $utf8 = [System.Text.UTF8Encoding]::new($false)

          $contractsPath = "apps/desktop/src-tauri/src/persistence/contracts.rs"
          $contracts = [IO.File]::ReadAllText($contractsPath)
          $legacyPattern = '(?s)\r?\n#\[derive\(Debug, Clone, Serialize, Deserialize\)\]\r?\n#\[serde\(rename_all = "camelCase", deny_unknown_fields\)\]\r?\npub\(crate\) struct CommitPersistedMonthRunCommandV1 \{.*?(?=\r?\n#\[derive\(Debug, Clone, Serialize, Deserialize\)\]\r?\n#\[serde\(rename_all = "camelCase", deny_unknown_fields\)\]\r?\npub\(crate\) struct CreateBackupCommandV1)'
          $cleanContracts = [regex]::Replace($contracts, $legacyPattern, "`n")
          [IO.File]::WriteAllText($contractsPath, $cleanContracts, $utf8)

          $recoveryPath = "apps/desktop/src-tauri/src/persistence/recovery.rs"
          $recovery = [IO.File]::ReadAllText($recoveryPath)
          $recovery = $recovery.Replace("verify_active_runs(self, connection)?;", "verify_runs(self, connection)?;")
          $recovery = $recovery.Replace("fn verify_active_runs(", "fn verify_runs(")
          $activeQuery = @'
          SELECT run_id FROM month_runs
                           WHERE status IN ('ready', 'suspended', 'completed')
                           ORDER BY run_id
          '@
          $allRunQuery = "SELECT run_id FROM month_runs ORDER BY run_id"
          $recovery = $recovery.Replace($activeQuery.Trim(), $allRunQuery)
          [IO.File]::WriteAllText($recoveryPath, $recovery, $utf8)

          $databasePath = "apps/desktop/src-tauri/src/persistence/database.rs"
          $database = [IO.File]::ReadAllText($databasePath)
          $oldCloseOrder = @'
                      set_clean_shutdown(connection, true)?;
                      let _: (i64, i64, i64) = connection
                          .query_row("PRAGMA wal_checkpoint(PASSIVE)", [], |row| {
                              Ok((row.get(0)?, row.get(1)?, row.get(2)?))
                          })
                          .map_err(|source| {
                              PersistenceError::storage("requesting the shutdown WAL checkpoint", source)
                          })?;
          '@
          $newCloseOrder = @'
                      let _: (i64, i64, i64) = connection
                          .query_row("PRAGMA wal_checkpoint(PASSIVE)", [], |row| {
                              Ok((row.get(0)?, row.get(1)?, row.get(2)?))
                          })
                          .map_err(|source| {
                              PersistenceError::storage("requesting the shutdown WAL checkpoint", source)
                          })?;
                      set_clean_shutdown(connection, true)?;
          '@
          $database = $database.Replace($oldCloseOrder.Trim(), $newCloseOrder.Trim())
          [IO.File]::WriteAllText($databasePath, $database, $utf8)

          pnpm fmt
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --all
          node scripts/build-toc.mjs
      - name: Commit final cleanup
        if: github.event_name == 'push'
        run: |
          $ErrorActionPreference = "Stop"
          git add -- apps/desktop/src-tauri/src packages/game-application packages/game-persistence-contracts tests docs/CATALOG.md docs/MANIFEST.jsonc
          if (git diff --cached --quiet) {
            Write-Host "Final cleanup is current."
          } else {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: finalize persistence cleanup"
            git push origin "HEAD:${{ github.ref_name }}"
          }
      - name: Check documentation
        run: pnpm docs:check
      - name: Check formatting
        run: pnpm fmt:check
      - name: Run fast lint
        run: pnpm lint
      - name: Run typecheck
        run: pnpm typecheck
      - name: Check package boundaries
        run: pnpm boundaries:check
      - name: Run focused test suite
        run: pnpm test
      - name: Run type-aware lint
        run: pnpm lint:type-aware
      - name: Build renderer
        run: pnpm build
      - name: Build Storybook
        run: pnpm storybook:build
      - name: Check Rust formatting
        run: pnpm rust:fmt:check
      - name: Check Rust workspace
        run: pnpm rust:check
      - name: Run Rust tests
        run: pnpm rust:test
