name: foundation

on:
  push:
    branches:
      - agent/month-run-persistence
    paths:
      - "apps/desktop/src-tauri/**"
      - ".github/workflows/foundation.yml"
  pull_request:
    branches:
      - main
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig*.json"
      - "vitest.config.ts"
      - "apps/**"
      - "packages/**"
      - "tests/**"
      - "fixtures/**"
      - "docs/**"
      - "scripts/**"
      - "rust-toolchain.toml"
      - ".ox*.json"
      - ".gitattributes"
      - ".github/workflows/foundation.yml"

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

jobs:
  full-verification:
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: write
    runs-on: self-hosted
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          clean: true
          persist-credentials: ${{ github.event_name == 'push' }}
          show-progress: false
      - name: Normalize tracked files
        run: |
          $ErrorActionPreference = "Stop"
          git config --local core.autocrlf false
          git config --local core.eol lf
          git checkout-index --all --force
      - name: Install Rust 1.97.0
        run: |
          $ErrorActionPreference = "Stop"
          rustup toolchain install 1.97.0 --profile minimal --component rustfmt,clippy
          rustup default 1.97.0
          rustc --version
          cargo --version
      - name: Apply exact reliability replacements
        if: github.event_name == 'push'
        run: |
          $ErrorActionPreference = "Stop"
          @'
          from pathlib import Path

          contracts_path = Path("apps/desktop/src-tauri/src/persistence/contracts.rs")
          contracts = contracts_path.read_text(encoding="utf-8")
          contracts_old = '''const CHECKPOINT_KEYS: [&str; 21] = [
              "acceptedDecisions",
              "baseSaveRevision",
              "checkpointHash",
              "compatibility",
              "materializedOutcomes",
              "pendingDecision",
              "phase",
              "plan",
              "previousCheckpointHash",
              "programCounter",
              "provisionalState",
              "rngState",
              "runId",
              "runRevision",
              "saveId",
              "schemaVersion",
              "status",
              "stepIndex",
              "terminalReason",
              "terminalResult",
              "compatibility",
          ];'''
          contracts_new = '''const CHECKPOINT_KEYS: [&str; 20] = [
              "acceptedDecisions",
              "baseSaveRevision",
              "checkpointHash",
              "compatibility",
              "materializedOutcomes",
              "pendingDecision",
              "phase",
              "plan",
              "previousCheckpointHash",
              "programCounter",
              "provisionalState",
              "rngState",
              "runId",
              "runRevision",
              "saveId",
              "schemaVersion",
              "status",
              "stepIndex",
              "terminalReason",
              "terminalResult",
          ];'''
          if contracts.count(contracts_old) != 1:
              raise SystemExit("contracts checkpoint-key source changed; refusing blind patch")
          contracts_path.write_text(contracts.replace(contracts_old, contracts_new), encoding="utf-8", newline="\n")

          recovery_path = Path("apps/desktop/src-tauri/src/persistence/recovery.rs")
          recovery = recovery_path.read_text(encoding="utf-8")
          recovery_old = '''            .prepare(
                          "SELECT run_id FROM month_runs
                           WHERE status IN ('ready', 'suspended', 'completed')
                           ORDER BY run_id",
                      )
                      .map_err(|source| {
                          PersistenceError::storage("preparing active run recovery scan", source)
                      })?;
                  let rows = statement
                      .query_map([], |row| row.get::<_, String>(0))
                      .map_err(|source| {
                          PersistenceError::storage("querying active runs for recovery", source)
                      })?;
                  rows.collect::<rusqlite::Result<Vec<_>>>()
                      .map_err(|source| {
                          PersistenceError::storage("reading active runs for recovery", source)
                      })?'''
          recovery_new = '''            .prepare("SELECT run_id FROM month_runs ORDER BY run_id")
                      .map_err(|source| {
                          PersistenceError::storage("preparing MonthRun recovery scan", source)
                      })?;
                  let rows = statement
                      .query_map([], |row| row.get::<_, String>(0))
                      .map_err(|source| {
                          PersistenceError::storage("querying MonthRuns for recovery", source)
                      })?;
                  rows.collect::<rusqlite::Result<Vec<_>>>()
                      .map_err(|source| {
                          PersistenceError::storage("reading MonthRuns for recovery", source)
                      })?'''
          if recovery.count(recovery_old) != 1:
              raise SystemExit("recovery scan source changed; refusing blind patch")
          recovery_path.write_text(recovery.replace(recovery_old, recovery_new), encoding="utf-8", newline="\n")
          '@ | python -
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --all
      - name: Commit reliability patch
        if: github.event_name == 'push'
        run: |
          $ErrorActionPreference = "Stop"
          git add -- apps/desktop/src-tauri/src/persistence
          if (git diff --cached --quiet) {
            Write-Host "Reliability patch is already applied."
          } else {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "fix: harden persistence recovery invariants"
            git push origin "HEAD:${{ github.ref_name }}"
          }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Activate pnpm
        run: |
          $ErrorActionPreference = "Stop"
          corepack enable
          corepack prepare pnpm@11.11.0 --activate
          pnpm --version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --reporter=silent
      - name: Check documentation
        run: pnpm docs:check
      - name: Check formatting
        run: pnpm fmt:check
      - name: Run fast lint
        run: pnpm lint
      - name: Run typecheck
        run: pnpm typecheck
      - name: Check package boundaries
        run: pnpm boundaries:check
      - name: Run focused test suite
        run: pnpm test
      - name: Run type-aware lint
        run: pnpm lint:type-aware
      - name: Build renderer
        run: pnpm build
      - name: Build Storybook
        run: pnpm storybook:build
      - name: Check Rust formatting
        run: pnpm rust:fmt:check
      - name: Check Rust workspace
        run: pnpm rust:check
      - name: Run Rust tests sequentially
        timeout-minutes: 12
        run: |
          cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml -- --nocapture --test-threads=1
