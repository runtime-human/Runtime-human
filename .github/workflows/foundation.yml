name: foundation

on:
  push:
    branches:
      - agent/month-run-protocol
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig*.json"
      - "tsconfig.json"
      - "vitest.config.ts"
      - "apps/**"
      - "packages/**"
      - "tests/**"
      - "fixtures/**"
      - "docs/**"
      - "scripts/**"
      - "rust-toolchain.toml"
      - ".ox*.json"
      - ".gitattributes"
      - ".github/workflows/foundation.yml"
  pull_request:
    branches:
      - main
      - agent/month-run-protocol
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig*.json"
      - "tsconfig.json"
      - "vitest.config.ts"
      - "apps/**"
      - "packages/**"
      - "tests/**"
      - "fixtures/**"
      - "docs/**"
      - "scripts/**"
      - "rust-toolchain.toml"
      - ".ox*.json"
      - ".gitattributes"
      - ".github/workflows/foundation.yml"

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  full-verification:
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor == 'MrFr3di' &&
       ((github.base_ref == 'main' && github.head_ref == 'agent/month-run-protocol') ||
        (github.base_ref == 'agent/month-run-protocol' &&
         github.head_ref == 'agent/month-run-persistence')))
    runs-on: self-hosted
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          clean: true
          persist-credentials: false
          show-progress: false
      - name: Normalize tracked files
        run: |
          $ErrorActionPreference = "Stop"
          git config --local core.autocrlf false
          git config --local core.eol lf
          git checkout-index --all --force
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Activate pnpm
        run: |
          $ErrorActionPreference = "Stop"
          corepack enable
          corepack prepare pnpm@11.11.0 --activate
          pnpm --version
      - name: Install Rust 1.97.0
        run: |
          $ErrorActionPreference = "Stop"
          rustup toolchain install 1.97.0 --profile minimal --component rustfmt,clippy
          rustup default 1.97.0
          rustc --version
          cargo --version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --reporter=silent
      - name: Format diagnostic working tree
        run: pnpm fmt
      - name: Capture formatting patch
        run: |
          $patchPath = Join-Path $env:RUNNER_TEMP "foundation-format.patch"
          git diff --binary | Out-File -FilePath $patchPath -Encoding utf8NoBOM
          if ((Get-Item $patchPath).Length -eq 0) {
            "No formatting changes were required." | Out-File -FilePath $patchPath -Encoding utf8NoBOM
          }
      - name: Upload formatting patch
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: foundation-format-patch
          path: ${{ runner.temp }}/foundation-format.patch
          if-no-files-found: error
          retention-days: 1
      - name: Check documentation
        run: pnpm docs:check
      - name: Check formatting
        run: pnpm fmt:check
      - name: Run fast lint
        run: pnpm lint
      - name: Run typecheck
        run: pnpm typecheck
      - name: Check package boundaries
        run: pnpm boundaries:check
      - name: Run focused test suite
        id: focused-tests
        continue-on-error: true
        run: |
          $logPath = Join-Path $env:RUNNER_TEMP "focused-tests.log"
          pnpm test *>&1 | Tee-Object -FilePath $logPath
          exit $LASTEXITCODE
      - name: Upload focused test log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: foundation-focused-tests-log
          path: ${{ runner.temp }}/focused-tests.log
          if-no-files-found: error
          retention-days: 1
      - name: Run type-aware lint
        run: pnpm lint:type-aware
      - name: Build renderer
        run: pnpm build
      - name: Build Storybook
        run: pnpm storybook:build
      - name: Check Rust formatting
        run: pnpm rust:fmt:check
      - name: Check Rust workspace
        id: rust-check
        continue-on-error: true
        run: |
          $logPath = Join-Path $env:RUNNER_TEMP "rust-check.log"
          pnpm rust:check *>&1 | Tee-Object -FilePath $logPath
          exit $LASTEXITCODE
      - name: Upload Rust check log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: foundation-rust-check-log
          path: ${{ runner.temp }}/rust-check.log
          if-no-files-found: error
          retention-days: 1
      - name: Run Rust tests
        if: steps.rust-check.outcome == 'success'
        run: pnpm rust:test
      - name: Enforce diagnostic results
        if: steps.focused-tests.outcome == 'failure' || steps.rust-check.outcome == 'failure'
        run: throw "A diagnostic gate failed; inspect the uploaded test and Rust artifacts."
