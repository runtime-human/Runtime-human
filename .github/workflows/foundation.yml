name: foundation

on:
  push:
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig*.json"
      - "apps/**"
      - "packages/**"
      - "tests/**"
      - "fixtures/**"
      - "docs/**"
      - "scripts/**"
      - "rust-toolchain.toml"
      - ".ox*.json"
      - ".gitattributes"
      - ".github/workflows/foundation.yml"
  pull_request:
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig*.json"
      - "apps/**"
      - "packages/**"
      - "tests/**"
      - "fixtures/**"
      - "docs/**"
      - "scripts/**"
      - "rust-toolchain.toml"
      - ".ox*.json"
      - ".gitattributes"
      - ".github/workflows/foundation.yml"

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  full-verification:
    if: >-
      (github.event_name == 'push' && github.actor == 'MrFr3di') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor == 'MrFr3di')
    runs-on: self-hosted
    timeout-minutes: 45
    env:
      CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          clean: true
          persist-credentials: false
          ref: ${{ env.CHECKOUT_SHA }}
          show-progress: false
      - name: Normalize tracked files
        run: |
          $ErrorActionPreference = "Stop"
          git config --local core.autocrlf false
          git config --local core.eol lf
          git checkout-index --all --force
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Activate pnpm
        run: |
          $ErrorActionPreference = "Stop"
          corepack enable
          corepack prepare pnpm@11.11.0 --activate
          pnpm --version
      - name: Install Rust 1.97.0
        run: |
          $ErrorActionPreference = "Stop"
          rustup toolchain install 1.97.0 --profile minimal --component rustfmt,clippy
          rustup default 1.97.0
          rustc --version
          cargo --version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --reporter=silent
      - name: Run full verification
        run: pnpm verify
