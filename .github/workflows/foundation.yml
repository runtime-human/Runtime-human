name: foundation

on:
  push:
    branches:
      - main
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig*.json"
      - "vitest.config.ts"
      - "apps/**"
      - "packages/**"
      - "tests/**"
      - "fixtures/**"
      - "content/**"
      - "docs/**"
      - "scripts/**"
      - "rust-toolchain.toml"
      - ".ox*.json"
      - ".gitattributes"
      - ".github/workflows/foundation.yml"
  pull_request:
    branches:
      - main
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig*.json"
      - "vitest.config.ts"
      - "apps/**"
      - "packages/**"
      - "tests/**"
      - "fixtures/**"
      - "content/**"
      - "docs/**"
      - "scripts/**"
      - "rust-toolchain.toml"
      - ".ox*.json"
      - ".gitattributes"
      - ".github/workflows/foundation.yml"

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

defaults:
  run:
    shell: pwsh

jobs:
  full-verification:
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: self-hosted
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          clean: true
          fetch-depth: 0
          persist-credentials: true
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          show-progress: false
      - name: Normalize tracked files
        run: |
          $ErrorActionPreference = "Stop"
          git config --local core.autocrlf false
          git config --local core.eol lf
          git checkout-index --all --force
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Activate pnpm
        run: |
          $ErrorActionPreference = "Stop"
          corepack enable
          corepack prepare pnpm@11.11.0 --activate
          pnpm --version
      - name: Install Rust 1.97.0
        run: |
          $ErrorActionPreference = "Stop"
          rustup toolchain install 1.97.0 --profile minimal --component rustfmt,clippy
          rustup default 1.97.0
          rustc --version
          cargo --version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --reporter=silent
      - name: Finalize DOCS-01 generated state
        run: |
          $ErrorActionPreference = "Stop"
          $statusPath = "docs/EXECUTION-STATUS.jsonc"
          $text = Get-Content -Raw -Encoding UTF8 $statusPath

          function Replace-Exact([string]$Source, [string]$Old, [string]$New) {
            if (-not $Source.Contains($Old)) {
              throw "Expected status fragment was not found: $Old"
            }
            return $Source.Replace($Old, $New)
          }

          $text = Replace-Exact $text '"updated": "2026-07-27"' '"updated": "2026-07-28"'
          $text = Replace-Exact $text '"mainHeadAtCurrentSliceStart": "332bbe0597129aa28725095a22875250daedd657"' '"mainHeadAtCurrentSliceStart": "0fd57232f16a7a903b11dcc56f83559ec2f8e5bb"'
          $text = Replace-Exact $text '"currentPhase": "career-overview-projection"' '"currentPhase": "documentation-governance"'
          $text = Replace-Exact $text '"id": "career-overview-projection",`n      "status": "implementation-complete",`n      "issue": 46,`n      "pullRequest": 48,`n      "branch": "agent/ui-02c-career-overview",' '"id": "career-overview-projection",`n      "status": "complete",`n      "issue": 46,`n      "pullRequest": 48,`n      "commit": "0fd57232f16a7a903b11dcc56f83559ec2f8e5bb",'
          $text = Replace-Exact $text '"qualityGate": "pending-pr-48-final-head"' '"qualityGate": "complete-pr-48"'
          $text = Replace-Exact $text '"currentConstraint": "ui-02c-implementation-complete-permanent-gates-and-review-pending"' '"currentConstraint": "docs-01-source-of-truth-governance-then-perf-02a"'
          Set-Content -Path $statusPath -Value $text -Encoding UTF8 -NoNewline

          node scripts/build-toc.mjs
          pnpm fmt
          node scripts/build-toc.mjs --check

          git fetch origin main
          git checkout origin/main -- .github/workflows/foundation.yml
          git add -A

          $expected = @(
            "docs/CATALOG.md",
            "docs/EXECUTION-STATUS.jsonc",
            "docs/INDEX.md",
            "docs/MANIFEST.jsonc",
            "docs/STYLE.md",
            "docs/superpowers/plans/2026-07-28-docs-source-of-truth-governance.md",
            "package.json",
            "scripts/build-toc.mjs",
            "scripts/docs-metadata.d.mts",
            "scripts/docs-metadata.mjs",
            "tests/docs-metadata-governance.test.ts"
          ) | Sort-Object
          $actual = @(git diff --cached --name-only origin/main | Sort-Object)
          $unexpected = Compare-Object -ReferenceObject $expected -DifferenceObject $actual
          if ($unexpected) {
            $details = $unexpected | Format-Table | Out-String
            throw "Unexpected DOCS-01 final diff:`n$details"
          }

          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: finalize source-of-truth governance"
          git push origin HEAD:agent/docs-01-governance
      - name: Check documentation
        run: pnpm docs:check
      - name: Check formatting
        run: pnpm fmt:check
      - name: Run fast lint
        run: pnpm lint
      - name: Run typecheck
        run: pnpm typecheck
      - name: Check compiled content
        run: pnpm content:check
      - name: Check package boundaries
        run: pnpm boundaries:check
      - name: Run focused test suite
        run: pnpm test
      - name: Run type-aware lint
        run: pnpm lint:type-aware
      - name: Build renderer
        run: pnpm build
      - name: Build Storybook
        run: pnpm storybook:build
      - name: Check Rust formatting
        run: pnpm rust:fmt:check
      - name: Check Rust workspace
        run: pnpm rust:check
      - name: Run Rust tests sequentially
        timeout-minutes: 12
        run: |
          cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml -- --nocapture --test-threads=1
