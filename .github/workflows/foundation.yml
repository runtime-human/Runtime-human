name: foundation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  full-verification:
    name: full verification / windows-2025
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          show-progress: false

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"

      - name: Activate pnpm
        run: |
          $ErrorActionPreference = "Stop"
          corepack enable
          corepack prepare pnpm@11.11.0 --activate
          pnpm --version

      - name: Install Rust 1.97.1
        run: |
          $ErrorActionPreference = "Stop"
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
          rustup default 1.97.1
          rustc --version
          cargo --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --reporter=silent

      - name: Check AI studio configuration
        run: pnpm studio:check

      - name: Check documentation
        run: pnpm docs:check

      - name: Check formatting
        run: pnpm fmt:check

      - name: Run fast lint
        run: pnpm lint

      - name: Run typecheck
        run: pnpm typecheck

      - name: Check compiled content
        run: pnpm content:check

      - name: Check balance data
        run: pnpm balance:check

      - name: Check package boundaries
        run: pnpm boundaries:check

      - name: Run focused test suite
        run: pnpm test

      - name: Install Playwright Chromium
        run: pnpm --filter @runtime-human/desktop exec playwright install chromium

      - name: Run Storybook browser tests
        run: pnpm test:browser

      - name: Run type-aware lint
        run: pnpm lint:type-aware

      - name: Build renderer
        run: pnpm build

      - name: Build Storybook
        run: pnpm storybook:build

      - name: Check Rust formatting
        run: pnpm rust:fmt:check

      - name: Check Rust workspace
        run: pnpm rust:check

      - name: Run Rust tests
        timeout-minutes: 12
        run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml -- --test-threads=1
