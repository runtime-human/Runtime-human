name: foundation

on:
  push:
    branches:
      - main
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig*.json"
      - "vitest.config.ts"
      - "apps/**"
      - "packages/**"
      - "tests/**"
      - "fixtures/**"
      - "content/**"
      - "docs/**"
      - "scripts/**"
      - "rust-toolchain.toml"
      - ".ox*.json"
      - ".gitattributes"
      - ".github/workflows/foundation.yml"
  pull_request:
    branches:
      - main
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig*.json"
      - "vitest.config.ts"
      - "apps/**"
      - "packages/**"
      - "tests/**"
      - "fixtures/**"
      - "content/**"
      - "docs/**"
      - "scripts/**"
      - "rust-toolchain.toml"
      - ".ox*.json"
      - ".gitattributes"
      - ".github/workflows/foundation.yml"

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  full-verification:
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: self-hosted
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          clean: true
          persist-credentials: false
          show-progress: false
      - name: Normalize tracked files
        run: |
          $ErrorActionPreference = "Stop"
          git config --local core.autocrlf false
          git config --local core.eol lf
          git checkout-index --all --force
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Activate pnpm
        run: |
          $ErrorActionPreference = "Stop"
          corepack enable
          corepack prepare pnpm@11.11.0 --activate
          pnpm --version
      - name: Install Rust 1.97.0
        run: |
          $ErrorActionPreference = "Stop"
          rustup toolchain install 1.97.0 --profile minimal --component rustfmt,clippy
          rustup default 1.97.0
          rustc --version
          cargo --version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --reporter=silent
      - name: Check documentation
        run: pnpm docs:check
      - name: Check formatting
        run: pnpm fmt:check
      - name: Run fast lint
        run: pnpm lint
      - name: Run typecheck
        run: pnpm typecheck
      - name: Check compiled content
        run: pnpm content:check
      - name: Check package boundaries
        run: pnpm boundaries:check
      - name: Run focused test suite
        run: pnpm test
      - name: Run type-aware lint
        run: pnpm lint:type-aware
      - name: Build renderer
        run: pnpm build
      - name: Build Storybook
        run: pnpm storybook:build
      - name: Check Rust formatting
        run: pnpm rust:fmt:check
      - name: Check Rust workspace
        run: pnpm rust:check
      - name: Run Rust tests sequentially
        timeout-minutes: 12
        run: |
          cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml -- --nocapture --test-threads=1

  format-diagnostic:
    needs: full-verification
    if: failure()
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Emit exact formatting patch
        run: |
          $ErrorActionPreference = "Stop"
          $paths = @(
            "packages/game-content/src/compiled-content-invariants.ts",
            "packages/game-content/src/compiled-content-runtime.ts",
            "packages/game-content/src/compiled-content-shape.ts",
            "packages/game-content/src/content-errors.ts",
            "packages/game-content/src/content-loader.ts",
            "packages/game-content/src/content-registry.ts",
            "packages/game-content/src/index.ts",
            "packages/game-content/src/select-required-chunks.ts",
            "tests/compiled-content-runtime-loader.test.ts"
          )
          pnpm exec oxfmt @paths
          git diff --no-ext-diff --text -- @paths
          if (-not (git diff --quiet -- @paths)) {
            exit 1
          }
