name: foundation

on:
  push:
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig*.json"
      - "apps/**"
      - "packages/**"
      - "tests/**"
      - "fixtures/**"
      - "scripts/check-boundaries.*"
      - "rust-toolchain.toml"
      - ".ox*.json"
      - ".gitattributes"
      - ".github/workflows/foundation.yml"

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

defaults:
  run:
    shell: pwsh

jobs:
  full-verification:
    if: github.actor == 'MrFr3di'
    permissions:
      contents: read
      statuses: write
    runs-on: self-hosted
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          clean: true
          persist-credentials: false
          show-progress: false
      - name: Normalize tracked files
        run: |
          $ErrorActionPreference = "Stop"
          git config --local core.autocrlf false
          git config --local core.eol lf
          git checkout-index --all --force
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Activate pnpm
        run: |
          $ErrorActionPreference = "Stop"
          corepack enable
          corepack prepare pnpm@11.11.0 --activate
          pnpm --version
      - name: Install Rust 1.97.0
        run: |
          $ErrorActionPreference = "Stop"
          rustup toolchain install 1.97.0 --profile minimal --component rustfmt,clippy
          rustup default 1.97.0
          rustc --version
          cargo --version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --reporter=silent
      - name: Generate derived documentation artifact
        run: node scripts/build-toc.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: persistence-derived-docs-${{ github.sha }}
          path: |
            docs/MANIFEST.jsonc
            docs/CATALOG.md
          if-no-files-found: error
          retention-days: 1
      - id: verify
        name: Run full verification
        continue-on-error: true
        run: pnpm verify
      - name: Publish foundation status
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          $ErrorActionPreference = "Stop"
          $state = if ($env:VERIFY_OUTCOME -eq "success") { "success" } else { "failure" }
          $description = if ($state -eq "success") {
            "Self-hosted Windows verification passed"
          } else {
            "Self-hosted Windows verification failed"
          }
          $body = @{
            state = $state
            context = "foundation/self-hosted"
            description = $description
            target_url = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          } | ConvertTo-Json
          Invoke-RestMethod `
            -Method Post `
            -Uri "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/statuses/$env:GITHUB_SHA" `
            -Headers @{
              Authorization = "Bearer $env:GITHUB_TOKEN"
              Accept = "application/vnd.github+json"
              "X-GitHub-Api-Version" = "2022-11-28"
            } `
            -ContentType "application/json" `
            -Body $body | Out-Null
      - name: Enforce verification result
        if: steps.verify.outcome != 'success'
        run: exit 1
