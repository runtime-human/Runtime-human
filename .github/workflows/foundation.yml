name: foundation

on:
  push:
    branches:
      - main
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig*.json"
      - "vitest.config.ts"
      - "apps/**"
      - "packages/**"
      - "tests/**"
      - "fixtures/**"
      - "content/**"
      - "docs/**"
      - "scripts/**"
      - "tools/**"
      - "rust-toolchain.toml"
      - ".ox*.json"
      - ".gitattributes"
      - ".github/workflows/foundation.yml"
  pull_request:
    branches:
      - main
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig*.json"
      - "vitest.config.ts"
      - "apps/**"
      - "packages/**"
      - "tests/**"
      - "fixtures/**"
      - "content/**"
      - "docs/**"
      - "scripts/**"
      - "tools/**"
      - "rust-toolchain.toml"
      - ".ox*.json"
      - ".gitattributes"
      - ".github/workflows/foundation.yml"

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  full-verification:
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: self-hosted
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          clean: true
          persist-credentials: false
          show-progress: false
      - name: Normalize tracked files
        run: |
          $ErrorActionPreference = "Stop"
          git config --local core.autocrlf false
          git config --local core.eol lf
          git checkout-index --all --force
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Activate pnpm
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          corepack enable
          corepack prepare pnpm@11.11.0 --activate
          pnpm --version
      - name: Persist Node and pnpm script shell
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $nodeCommand = Get-Command node -ErrorAction Stop
          $pwshCommand = Get-Command pwsh -ErrorAction Stop
          $nodeDirectory = Split-Path $nodeCommand.Source -Parent
          $workspaceBin = Join-Path $env:GITHUB_WORKSPACE "node_modules\.bin"
          $nodeDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $workspaceBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "NODE_EXECUTABLE=$($nodeCommand.Source)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PNPM_CONFIG_SCRIPT_SHELL=$($pwshCommand.Source)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Persisted Node directory: $nodeDirectory"
          Write-Host "Configured pnpm script shell: $($pwshCommand.Source)"
      - name: Install Rust 1.97.1
        run: |
          $ErrorActionPreference = "Stop"
          $cargoBin = Join-Path $env:USERPROFILE ".cargo\bin"
          $rustup = Join-Path $cargoBin "rustup.exe"
          if (-not (Test-Path $rustup)) {
            throw "rustup.exe was not found at $rustup"
          }
          $cargoBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:PATH = "$cargoBin;$env:PATH"
          & $rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
          & $rustup default 1.97.1
          rustc --version
          cargo --version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --reporter=silent
      - name: Verify pnpm script shell
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $configuredShell = (pnpm config get scriptShell).Trim()
          if ([string]::IsNullOrWhiteSpace($configuredShell) -or $configuredShell -eq "undefined") {
            throw "pnpm did not load PNPM_CONFIG_SCRIPT_SHELL"
          }
          if (-not (Test-Path $configuredShell)) {
            throw "Configured pnpm script shell does not exist: $configuredShell"
          }
          & $env:NODE_EXECUTABLE --version
          $cmdCommand = Get-Command cmd.exe -ErrorAction Stop
          & $cmdCommand.Source /d /s /c "where node && node --version"
          if ($LASTEXITCODE -ne 0) {
            throw "Node is not resolvable from cmd.exe child processes"
          }
          Write-Host "pnpm script shell: $configuredShell"
      - name: Check documentation
        run: pnpm docs:check
      - name: Check formatting
        run: pnpm fmt:check
      - name: Run fast lint
        run: pnpm lint
      - name: Run typecheck
        run: pnpm typecheck
      - name: Check compiled content
        run: pnpm content:check
      - name: Check package boundaries
        run: pnpm boundaries:check
      - name: Run focused test suite
        run: pnpm test
      - name: Run type-aware lint
        run: pnpm lint:type-aware
      - name: Build renderer
        run: pnpm build
      - name: Build Storybook
        run: pnpm storybook:build
      - name: Check Rust formatting
        run: pnpm rust:fmt:check
      - name: Check Rust workspace
        run: pnpm rust:check
      - name: Run Rust tests sequentially
        timeout-minutes: 12
        run: |
          cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml -- --nocapture --test-threads=1
