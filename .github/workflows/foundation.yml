name: foundation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  full-verification:
    name: full verification / windows-2025
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          show-progress: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: "11.11.0"
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.20.0"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify JavaScript toolchain
        run: |
          $ErrorActionPreference = "Stop"
          node --version
          pnpm --version

      - name: Install Rust 1.97.1
        run: |
          $ErrorActionPreference = "Stop"
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
          rustup default 1.97.1
          rustc --version
          cargo --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --reporter=silent

      - name: Install Playwright Chromium
        run: pnpm --filter @runtime-human/desktop exec playwright install chromium

      - name: Run canonical V3 verification
        run: pnpm verify
