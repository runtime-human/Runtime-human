name: foundation

on:
  push:
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig*.json"
      - "apps/**"
      - "packages/**"
      - "tests/**"
      - "fixtures/**"
      - "docs/**"
      - "scripts/**"
      - "rust-toolchain.toml"
      - ".ox*.json"
      - ".gitattributes"
      - ".github/workflows/foundation.yml"

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

defaults:
  run:
    shell: pwsh

jobs:
  full-verification:
    if: github.actor == 'MrFr3di' && github.ref == 'refs/heads/agent/month-run-persistence'
    permissions:
      contents: write
      statuses: write
    runs-on: self-hosted
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          clean: true
          persist-credentials: true
          show-progress: false
      - name: Publish pending verification status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $body = @{
            state = "pending"
            context = "foundation/self-hosted"
            description = "Self-hosted Windows verification is running"
            target_url = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          } | ConvertTo-Json
          Invoke-RestMethod `
            -Method Post `
            -Uri "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/statuses/$env:GITHUB_SHA" `
            -Headers @{
              Authorization = "Bearer $env:GITHUB_TOKEN"
              Accept = "application/vnd.github+json"
              "X-GitHub-Api-Version" = "2022-11-28"
            } `
            -ContentType "application/json" `
            -Body $body | Out-Null
      - name: Normalize tracked files
        run: |
          $ErrorActionPreference = "Stop"
          git config --local core.autocrlf false
          git config --local core.eol lf
          git checkout-index --all --force
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Activate pnpm
        run: |
          $ErrorActionPreference = "Stop"
          corepack enable
          corepack prepare pnpm@11.11.0 --activate
          pnpm --version
      - name: Install Rust 1.97.0
        run: |
          $ErrorActionPreference = "Stop"
          rustup toolchain install 1.97.0 --profile minimal --component rustfmt,clippy
          rustup default 1.97.0
          rustc --version
          cargo --version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --reporter=silent
      - name: Format persistence bootstrap files
        run: pnpm fmt
      - name: Generate derived documentation
        run: node scripts/build-toc.mjs
      - id: cargo_bootstrap
        name: Resolve Rust dependency lock
        run: |
          $output = & cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml 2>&1
          $exitCode = $LASTEXITCODE
          $output | Set-Content -Path cargo-bootstrap.log -Encoding utf8
          if ($exitCode -ne 0) {
            Write-Host "cargo check failed; final diagnostics:"
            $output | Select-Object -Last 120 | ForEach-Object { Write-Host $_ }
          }
          "passed=$(($exitCode -eq 0).ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          exit 0
      - id: bootstrap_commit
        name: Commit resolved bootstrap when needed
        run: |
          $ErrorActionPreference = "Stop"
          $paths = @(
            "packages/game-persistence-contracts/src",
            "tests/persistence-contracts.test.ts",
            "apps/desktop/src-tauri/Cargo.toml",
            "apps/desktop/src-tauri/Cargo.lock",
            "apps/desktop/src-tauri/src/main.rs",
            "apps/desktop/src-tauri/src/persistence",
            "docs/MANIFEST.jsonc",
            "docs/CATALOG.md",
            ".github/workflows/foundation.yml"
          )
          git add -- $paths
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            "changed=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            exit 0
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: commit resolved persistence bootstrap"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:agent/month-run-persistence
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "changed=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - id: verify
        name: Run full verification
        if: steps.bootstrap_commit.outputs.changed == 'false'
        run: |
          pnpm verify
          $passed = $LASTEXITCODE -eq 0
          "passed=$($passed.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          exit 0
      - name: Publish foundation status
        if: steps.bootstrap_commit.outputs.changed == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERIFY_PASSED: ${{ steps.verify.outputs.passed }}
        run: |
          $ErrorActionPreference = "Stop"
          $state = if ($env:VERIFY_PASSED -eq "true") { "success" } else { "failure" }
          $description = if ($state -eq "success") {
            "Self-hosted Windows verification passed"
          } else {
            "Self-hosted Windows verification failed"
          }
          $body = @{
            state = $state
            context = "foundation/self-hosted"
            description = $description
            target_url = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          } | ConvertTo-Json
          Invoke-RestMethod `
            -Method Post `
            -Uri "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/statuses/$env:GITHUB_SHA" `
            -Headers @{
              Authorization = "Bearer $env:GITHUB_TOKEN"
              Accept = "application/vnd.github+json"
              "X-GitHub-Api-Version" = "2022-11-28"
            } `
            -ContentType "application/json" `
            -Body $body | Out-Null
      - name: Enforce verification result
        if: steps.bootstrap_commit.outputs.changed == 'false' && steps.verify.outputs.passed != 'true'
        run: exit 1
