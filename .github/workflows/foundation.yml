name: foundation

on:
  push:
    branches:
      - agent/month-run-persistence
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig*.json"
      - "vitest.config.ts"
      - "apps/**"
      - "packages/**"
      - "tests/**"
      - "fixtures/**"
      - "docs/**"
      - "scripts/**"
      - "rust-toolchain.toml"
      - ".ox*.json"
      - ".gitattributes"
      - ".github/workflows/foundation.yml"
  pull_request:
    branches:
      - main
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig*.json"
      - "vitest.config.ts"
      - "apps/**"
      - "packages/**"
      - "tests/**"
      - "fixtures/**"
      - "docs/**"
      - "scripts/**"
      - "rust-toolchain.toml"
      - ".ox*.json"
      - ".gitattributes"
      - ".github/workflows/foundation.yml"

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

jobs:
  full-verification:
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: write
    runs-on: self-hosted
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          clean: true
          persist-credentials: ${{ github.event_name == 'push' }}
          show-progress: false
      - name: Normalize tracked files
        run: |
          $ErrorActionPreference = "Stop"
          git config --local core.autocrlf false
          git config --local core.eol lf
          git checkout-index --all --force
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Activate pnpm
        run: |
          $ErrorActionPreference = "Stop"
          corepack enable
          corepack prepare pnpm@11.11.0 --activate
          pnpm --version
      - name: Install Rust 1.97.0
        run: |
          $ErrorActionPreference = "Stop"
          rustup toolchain install 1.97.0 --profile minimal --component rustfmt,clippy
          rustup default 1.97.0
          rustc --version
          cargo --version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --reporter=silent
      - name: Apply verified cleanup
        if: github.event_name == 'push'
        run: |
          $ErrorActionPreference = "Stop"
          $utf8 = [System.Text.UTF8Encoding]::new($false)

          $contractsPath = "apps/desktop/src-tauri/src/persistence/contracts.rs"
          $contracts = [IO.File]::ReadAllText($contractsPath).Replace("`r`n", "`n")
          $legacyStartMarker = @'
          #[derive(Debug, Clone, Serialize, Deserialize)]
          #[serde(rename_all = "camelCase", deny_unknown_fields)]
          pub(crate) struct CommitPersistedMonthRunCommandV1 {
          '@.Trim()
          $backupStartMarker = @'
          #[derive(Debug, Clone, Serialize, Deserialize)]
          #[serde(rename_all = "camelCase", deny_unknown_fields)]
          pub(crate) struct CreateBackupCommandV1 {
          '@.Trim()
          $legacyStart = $contracts.IndexOf($legacyStartMarker, [StringComparison]::Ordinal)
          $backupStart = $contracts.IndexOf($backupStartMarker, [StringComparison]::Ordinal)
          if ($legacyStart -lt 0 -or $backupStart -le $legacyStart) {
            throw "Could not locate the stale Rust commit DTO."
          }
          $contracts = $contracts.Substring(0, $legacyStart) + $contracts.Substring($backupStart)
          if ($contracts.Contains("struct CommitPersistedMonthRunCommandV1")) {
            throw "Stale Rust commit DTO remains in contracts.rs."
          }
          [IO.File]::WriteAllText($contractsPath, $contracts, $utf8)

          $recoveryPath = "apps/desktop/src-tauri/src/persistence/recovery.rs"
          $recovery = [IO.File]::ReadAllText($recoveryPath).Replace("`r`n", "`n")
          $recovery = $recovery.Replace("verify_active_runs(self, connection)?;", "verify_runs(self, connection)?;")
          $recovery = $recovery.Replace("fn verify_active_runs(", "fn verify_runs(")
          $runQueryPattern = "SELECT run_id FROM month_runs\s+WHERE status IN \('ready', 'suspended', 'completed'\)\s+ORDER BY run_id"
          $recovery = [regex]::Replace($recovery, $runQueryPattern, "SELECT run_id FROM month_runs ORDER BY run_id")
          if ($recovery.Contains("fn verify_active_runs") -or $recovery.Contains("WHERE status IN ('ready', 'suspended', 'completed')")) {
            throw "Recovery scan is still limited to active runs."
          }
          [IO.File]::WriteAllText($recoveryPath, $recovery, $utf8)

          $databasePath = "apps/desktop/src-tauri/src/persistence/database.rs"
          $database = [IO.File]::ReadAllText($databasePath).Replace("`r`n", "`n")
          $cleanCall = "            set_clean_shutdown(connection, true)?;`n"
          $cleanIndex = $database.IndexOf($cleanCall, [StringComparison]::Ordinal)
          $checkpointIndex = $database.IndexOf('            let _: (i64, i64, i64) = connection', [StringComparison]::Ordinal)
          if ($cleanIndex -lt 0 -or $checkpointIndex -lt 0 -or $cleanIndex -gt $checkpointIndex) {
            throw "Could not locate the pre-checkpoint clean marker."
          }
          $database = $database.Remove($cleanIndex, $cleanCall.Length)
          $checkpointEndMarker = '                })?;'
          $checkpointEnd = $database.IndexOf($checkpointEndMarker, $checkpointIndex, [StringComparison]::Ordinal)
          if ($checkpointEnd -lt 0) {
            throw "Could not locate the end of PASSIVE checkpoint handling."
          }
          $insertAt = $checkpointEnd + $checkpointEndMarker.Length
          $database = $database.Insert($insertAt, "`n            set_clean_shutdown(connection, true)?;")
          $newCleanIndex = $database.IndexOf("set_clean_shutdown(connection, true)?;", [StringComparison]::Ordinal)
          $newCheckpointIndex = $database.IndexOf('PRAGMA wal_checkpoint(PASSIVE)', [StringComparison]::Ordinal)
          if ($newCleanIndex -lt $newCheckpointIndex) {
            throw "Clean marker still precedes the PASSIVE checkpoint."
          }
          [IO.File]::WriteAllText($databasePath, $database, $utf8)

          pnpm fmt
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --all
          node scripts/build-toc.mjs
      - name: Commit verified cleanup
        if: github.event_name == 'push'
        run: |
          $ErrorActionPreference = "Stop"
          git add -- apps/desktop/src-tauri/src packages/game-application packages/game-persistence-contracts tests docs/CATALOG.md docs/MANIFEST.jsonc
          if (git diff --cached --quiet) {
            throw "Verified cleanup made no changes."
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: apply verified persistence cleanup"
          git push origin "HEAD:${{ github.ref_name }}"
      - name: Check documentation
        run: pnpm docs:check
      - name: Check formatting
        run: pnpm fmt:check
      - name: Run fast lint
        run: pnpm lint
      - name: Run typecheck
        id: typecheck
        continue-on-error: true
        run: |
          $logPath = Join-Path $env:RUNNER_TEMP "typecheck.log"
          pnpm typecheck *>&1 | Tee-Object -FilePath $logPath
          exit $LASTEXITCODE
      - name: Upload typecheck diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: persistence-final-typecheck-log
          path: ${{ runner.temp }}/typecheck.log
          if-no-files-found: error
          retention-days: 1
      - name: Enforce typecheck result
        if: steps.typecheck.outcome == 'failure'
        run: throw "TypeScript typecheck failed; inspect persistence-final-typecheck-log."
      - name: Check package boundaries
        run: pnpm boundaries:check
      - name: Run focused test suite
        run: pnpm test
      - name: Run type-aware lint
        run: pnpm lint:type-aware
      - name: Build renderer
        run: pnpm build
      - name: Build Storybook
        run: pnpm storybook:build
      - name: Check Rust formatting
        run: pnpm rust:fmt:check
      - name: Check Rust workspace
        id: rust_check
        continue-on-error: true
        run: |
          $logPath = Join-Path $env:RUNNER_TEMP "rust-check.log"
          pnpm rust:check *>&1 | Tee-Object -FilePath $logPath
          exit $LASTEXITCODE
      - name: Upload Rust diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: persistence-final-rust-check-log
          path: ${{ runner.temp }}/rust-check.log
          if-no-files-found: error
          retention-days: 1
      - name: Enforce Rust workspace result
        if: steps.rust_check.outcome == 'failure'
        run: throw "Rust workspace check failed; inspect persistence-final-rust-check-log."
      - name: Run Rust tests
        run: pnpm rust:test
