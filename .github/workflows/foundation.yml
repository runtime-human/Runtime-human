name: foundation

on:
  push:
    branches:
      - main
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig*.json"
      - "vitest.config.ts"
      - "apps/**"
      - "packages/**"
      - "tests/**"
      - "fixtures/**"
      - "content/**"
      - "docs/**"
      - "scripts/**"
      - "rust-toolchain.toml"
      - ".ox*.json"
      - ".gitattributes"
      - ".github/workflows/foundation.yml"
  pull_request:
    branches:
      - main
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig*.json"
      - "vitest.config.ts"
      - "apps/**"
      - "packages/**"
      - "tests/**"
      - "fixtures/**"
      - "content/**"
      - "docs/**"
      - "scripts/**"
      - "rust-toolchain.toml"
      - ".ox*.json"
      - ".gitattributes"
      - ".github/workflows/foundation.yml"

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

defaults:
  run:
    shell: pwsh

jobs:
  full-verification:
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: self-hosted
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          clean: true
          fetch-depth: 0
          persist-credentials: true
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          show-progress: false
      - name: Normalize tracked files
        run: |
          $ErrorActionPreference = "Stop"
          git config --local core.autocrlf false
          git config --local core.eol lf
          git checkout-index --all --force
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Activate pnpm
        run: |
          $ErrorActionPreference = "Stop"
          corepack enable
          corepack prepare pnpm@11.11.0 --activate
          pnpm --version
      - name: Install Rust 1.97.0
        run: |
          $ErrorActionPreference = "Stop"
          rustup toolchain install 1.97.0 --profile minimal --component rustfmt,clippy
          rustup default 1.97.0
          rustc --version
          cargo --version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --reporter=silent
      - name: Finalize DOCS-01 generated state
        run: |
          $ErrorActionPreference = "Stop"
          $script = @'
          import fs from "node:fs";

          const path = "docs/EXECUTION-STATUS.jsonc";
          const status = JSON.parse(fs.readFileSync(path, "utf8"));
          const milestone = status.milestones.find(
            (candidate) => candidate.id === "career-overview-projection",
          );
          if (!milestone) throw new Error("career-overview-projection milestone is missing");
          if (milestone.pullRequest !== 48 || milestone.issue !== 46) {
            throw new Error("career-overview-projection milestone identity changed");
          }
          if (
            milestone.status !== "implementation-complete" ||
            milestone.branch !== "agent/ui-02c-career-overview"
          ) {
            throw new Error("career-overview-projection milestone is not in the expected pre-closure state");
          }

          status.updated = "2026-07-28";
          status.mainHeadAtCurrentSliceStart = "0fd57232f16a7a903b11dcc56f83559ec2f8e5bb";
          status.currentPhase = "documentation-governance";
          milestone.status = "complete";
          delete milestone.branch;
          milestone.commit = "0fd57232f16a7a903b11dcc56f83559ec2f8e5bb";
          status.verification.qualityGate = "complete-pr-48";
          status.verification.currentConstraint =
            "docs-01-source-of-truth-governance-then-perf-02a";
          status.verification.currentPullRequestMayMerge = false;

          fs.writeFileSync(path, `${JSON.stringify(status, null, 2)}\n`, "utf8");
          '@
          $script | node --input-type=module -

          node scripts/build-toc.mjs
          pnpm fmt
          node scripts/build-toc.mjs --check

          git fetch origin main
          git checkout origin/main -- .github/workflows/foundation.yml
          git add -A

          $expected = @(
            "docs/CATALOG.md",
            "docs/EXECUTION-STATUS.jsonc",
            "docs/INDEX.md",
            "docs/MANIFEST.jsonc",
            "docs/STYLE.md",
            "docs/superpowers/plans/2026-07-28-docs-source-of-truth-governance.md",
            "package.json",
            "scripts/build-toc.mjs",
            "scripts/docs-metadata.d.mts",
            "scripts/docs-metadata.mjs",
            "tests/docs-metadata-governance.test.ts"
          ) | Sort-Object
          $actual = @(git diff --cached --name-only origin/main | Sort-Object)
          $unexpected = Compare-Object -ReferenceObject $expected -DifferenceObject $actual
          if ($unexpected) {
            $details = $unexpected | Format-Table | Out-String
            throw "Unexpected DOCS-01 final diff:`n$details"
          }

          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: finalize source-of-truth governance"
          git push origin HEAD:agent/docs-01-governance
      - name: Check documentation
        run: pnpm docs:check
      - name: Check formatting
        run: pnpm fmt:check
      - name: Run fast lint
        run: pnpm lint
      - name: Run typecheck
        run: pnpm typecheck
      - name: Check compiled content
        run: pnpm content:check
      - name: Check package boundaries
        run: pnpm boundaries:check
      - name: Run focused test suite
        run: pnpm test
      - name: Run type-aware lint
        run: pnpm lint:type-aware
      - name: Build renderer
        run: pnpm build
      - name: Build Storybook
        run: pnpm storybook:build
      - name: Check Rust formatting
        run: pnpm rust:fmt:check
      - name: Check Rust workspace
        run: pnpm rust:check
      - name: Run Rust tests sequentially
        timeout-minutes: 12
        run: |
          cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml -- --nocapture --test-threads=1
