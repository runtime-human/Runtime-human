name: perf-02a-rustfmt

on:
  push:
    branches:
      - agent/perf-02a-tauri-command-linkage
    paths:
      - ".github/workflows/perf-02a-rustfmt.yml"

permissions:
  contents: write

defaults:
  run:
    shell: pwsh

jobs:
  format:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          clean: true
          persist-credentials: true
          ref: agent/perf-02a-tauri-command-linkage
          show-progress: false
      - name: Install Rust 1.97.1
        run: |
          $ErrorActionPreference = "Stop"
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt
          rustup default 1.97.1
      - name: Format and clean up
        run: |
          $ErrorActionPreference = "Stop"
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --all
          Remove-Item .github/workflows/perf-02a-rustfmt.yml
          git add apps/desktop/src-tauri/src .github/workflows/perf-02a-rustfmt.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: apply Rust 1.97.1 formatting"
          git push origin HEAD:agent/perf-02a-tauri-command-linkage
