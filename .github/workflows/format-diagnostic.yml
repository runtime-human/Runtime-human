name: apply-pinned-format

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

defaults:
  run:
    shell: pwsh

jobs:
  apply-and-self-remove:
    if: >-
      github.actor == 'MrFr3di' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/january-1990-content-projections'
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/january-1990-content-projections
          clean: true
          persist-credentials: true
          show-progress: false
      - name: Normalize tracked files
        run: |
          $ErrorActionPreference = "Stop"
          git config --local core.autocrlf false
          git config --local core.eol lf
          git checkout-index --all --force
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Activate pnpm
        run: |
          $ErrorActionPreference = "Stop"
          corepack enable
          corepack prepare pnpm@11.11.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --reporter=silent
      - name: Format and verify focused slice
        run: |
          $ErrorActionPreference = "Stop"
          pnpm fmt
          pnpm typecheck
          pnpm vitest run tests/january-1990-contracts.test.ts tests/january-1990-content-projection.test.ts tests/check-boundaries.test.ts

          $expected = @(
            "packages/game-application/src/january-1990/project-january-content.ts",
            "packages/game-core/src/january-1990/january-content-context.ts",
            "tests/january-1990-content-projection.test.ts",
            "tests/january-1990-contracts.test.ts"
          )
          $changed = @(git diff --name-only | Sort-Object)
          $difference = @(Compare-Object ($expected | Sort-Object) $changed)
          if ($difference.Count -ne 0) {
            throw "Pinned formatter changed an unexpected file set: $($changed -join ', ')"
          }
      - name: Commit exact formatter output and remove diagnostic workflow
        run: |
          $ErrorActionPreference = "Stop"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/game-application/src/january-1990/project-january-content.ts
          git add packages/game-core/src/january-1990/january-content-context.ts
          git add tests/january-1990-content-projection.test.ts
          git add tests/january-1990-contracts.test.ts
          git rm .github/workflows/format-diagnostic.yml
          git commit -m "style: apply pinned formatter"
          git push origin HEAD:agent/january-1990-content-projections
