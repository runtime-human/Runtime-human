name: format-diagnostic

on:
  push:
    branches:
      - agent/persisted-month-run-orchestration
  pull_request:
    branches:
      - main

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  prepare:
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          clean: true
          persist-credentials: false
          show-progress: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.11.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --reporter=silent
      - name: Format working copy
        run: pnpm fmt

  report:
    needs: prepare
    runs-on: self-hosted
    steps:
      - name: Capture formatter output
        run: |
          $ErrorActionPreference = "Stop"
          git diff -- packages tests apps scripts package.json pnpm-workspace.yaml tsconfig.base.json tsconfig.json vitest.config.ts .github/workflows/foundation.yml | Out-File -FilePath formatter.patch -Encoding utf8
          git diff --name-only
      - uses: actions/upload-artifact@v4
        with:
          name: formatter-output
          path: |
            formatter.patch
            packages/game-application/src/month-run-persistence-payload.ts
            packages/game-application/src/persisted-month-run-orchestrator.ts
            packages/game-application/src/persisted-month-run-types.ts
            tests/fixtures/january-reference-program.ts
            tests/helpers/in-memory-persistence-service.ts
            tests/month-run-persistence-payload.test.ts
            tests/persisted-month-run-orchestrator.test.ts
            tests/persisted-month-run-restart.test.ts
          if-no-files-found: error
      - name: Keep diagnostic red
        run: |
          if (-not (git diff --quiet)) {
            exit 1
          }
