name: ui-02b-vitest-diagnostics

on:
  pull_request:
    paths:
      - ".github/workflows/ui-02b-vitest-diagnostics.yml"

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  diagnose:
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          clean: true
          persist-credentials: false
          show-progress: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Install dependencies
        run: |
          corepack enable
          corepack prepare pnpm@11.11.0 --activate
          corepack pnpm install --frozen-lockfile --reporter=silent
      - name: Capture failing Vitest assertions
        run: |
          $ErrorActionPreference = "Continue"
          corepack pnpm exec vitest run --reporter=json --outputFile=.runtime-vitest-report.json
          $exitCode = $LASTEXITCODE
          $report = Get-Content .runtime-vitest-report.json -Raw | ConvertFrom-Json
          Write-Host "VITEST_SUCCESS=$($report.success)"
          Write-Host "TEST_FILES=$($report.numTotalTestSuites) FAILED_FILES=$($report.numFailedTestSuites)"
          Write-Host "TESTS=$($report.numTotalTests) FAILED_TESTS=$($report.numFailedTests)"
          foreach ($suite in $report.testResults) {
            $failed = @($suite.assertionResults | Where-Object { $_.status -eq "failed" })
            if ($failed.Count -eq 0) { continue }
            Write-Host "FAILED_FILE=$($suite.name)"
            foreach ($assertion in $failed) {
              Write-Host "FAILED_TEST=$($assertion.fullName)"
              foreach ($message in $assertion.failureMessages) { Write-Host $message }
            }
          }
          exit $exitCode
