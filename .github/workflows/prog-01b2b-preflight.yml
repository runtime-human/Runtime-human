name: prog-01b2b-preflight

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "11.11.0"
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.20.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile --reporter=silent
      - name: Print exact canonical formatter diff
        shell: bash
        run: |
          pnpm exec oxfmt packages/game-application/src/progression tests/professional-save-candidate-v2.test.ts
          git diff -- packages/game-application/src/progression tests/professional-save-candidate-v2.test.ts
      - name: Focused application regression
        run: pnpm exec vitest run --project application-node tests/professional-save-candidate-v2.test.ts
      - name: Typecheck all packages
        run: pnpm typecheck
