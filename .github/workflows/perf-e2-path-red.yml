name: perf-e2-path-red

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/perf-e2-path-red.yml"
      - ".github/workflows/perf-02a-e2-windows-capture.yml"

permissions:
  contents: read

jobs:
  contract:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Assert explicit Node and workspace-bin persistence
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          const workflow = await readFile('.github/workflows/perf-02a-e2-windows-capture.yml', 'utf8');
          assert.match(workflow, /Get-Command node/u);
          assert.match(workflow, /node_modules\\\.bin/u);
          assert.match(workflow, /GITHUB_PATH/u);
          NODE
