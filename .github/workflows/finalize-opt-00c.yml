name: finalize-opt-00c

on:
  push:
    branches:
      - agent/perf-opt-00c-user-timing
    paths:
      - ".github/workflows/finalize-opt-00c.yml"

permissions:
  contents: write

defaults:
  run:
    shell: pwsh

jobs:
  finalize:
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/perf-opt-00c-user-timing
          clean: true
          persist-credentials: true
          show-progress: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Activate pnpm
        run: |
          $ErrorActionPreference = "Stop"
          corepack enable
          corepack prepare pnpm@11.11.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --reporter=silent
      - name: Update execution status and documentation indexes
        run: |
          $ErrorActionPreference = "Stop"
          @'
          import { readFile, writeFile } from "node:fs/promises";

          const path = "docs/EXECUTION-STATUS.jsonc";
          const status = JSON.parse(await readFile(path, "utf8"));
          status.updated = "2026-07-26";
          status.mainHeadAtCurrentSliceStart = "5958f132376306246cf0895e97d04e4a9c9239d5";
          status.currentPhase = "performance-user-timing-observability";

          const sqlite = status.milestones.find((item) => item.id === "performance-sqlite-baseline");
          if (sqlite === undefined) throw new Error("performance-sqlite-baseline milestone missing");
          sqlite.status = "complete";
          sqlite.commit = "5958f132376306246cf0895e97d04e4a9c9239d5";
          delete sqlite.branch;

          const timingMilestone = {
            id: "performance-user-timing-observability",
            status: "implementation-complete",
            issue: 24,
            pullRequest: 36,
            branch: "agent/perf-opt-00c-user-timing",
            scope: [
              "failure-safe-performance-recorder",
              "browser-user-timing",
              "january-session-bootstrap",
              "compiled-content-manifest-chunks-registry",
              "month-load-begin-resume-commit-retry",
              "concurrent-action-coalescing"
            ],
            exclusions: [
              "authoritative-state",
              "tauri-ipc-latency",
              "webview2-initialization",
              "first-meaningful-paint",
              "windows-idle-resources",
              "performance-gates",
              "optimization"
            ],
            evidence: {
              schemaVersion: "performance-sample-v1-user-timing",
              measureNames: [
                "app.session_bootstrap",
                "content.manifest",
                "content.chunk",
                "content.registry",
                "month.load",
                "month.begin",
                "month.resume",
                "month.commit",
                "month.retry"
              ],
              uniqueStartMarks: true,
              marksCleared: true,
              recorderFailuresIsolated: true,
              operationValuesAndErrorsPreserved: true,
              defaultDesktopCompositionInstrumented: true,
              concurrentActionsProduceOneMeasure: true,
              focusedTests: 7
            }
          };
          const existingTimingIndex = status.milestones.findIndex(
            (item) => item.id === timingMilestone.id,
          );
          if (existingTimingIndex >= 0) status.milestones[existingTimingIndex] = timingMilestone;
          else {
            const npcIndex = status.milestones.findIndex((item) => item.id === "npc-foundation");
            status.milestones.splice(npcIndex < 0 ? status.milestones.length : npcIndex, 0, timingMilestone);
          }

          const npc = status.milestones.find((item) => item.id === "npc-foundation");
          if (npc !== undefined) npc.status = "planned-after-product-facing-performance-baselines";

          status.verification.qualityGate = "pending-pr-36-final-head";
          status.verification.currentConstraint =
            "opt-00c-implementation-complete-permanent-gates-and-review-pending";
          status.verification.currentPullRequestMayMerge = false;

          await writeFile(path, JSON.stringify(status, null, 2) + "\n", "utf8");
          '@ | node --input-type=module
          node scripts/build-toc.mjs
          pnpm fmt
      - name: Verify focused implementation
        run: |
          $ErrorActionPreference = "Stop"
          pnpm docs:check
          pnpm fmt:check
          pnpm lint
          pnpm typecheck
          pnpm exec vitest run tests/performance-recorder.test.ts tests/january-1990-desktop-performance.test.ts
      - name: Commit generated and status files
        run: |
          $ErrorActionPreference = "Stop"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs apps tests
          if (-not (git diff --cached --quiet)) {
            git commit -m "docs: finalize OPT-00C observability status"
            git push origin HEAD:agent/perf-opt-00c-user-timing
          }
