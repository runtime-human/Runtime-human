name: ui-03b-red

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/ui-03b-red.yml"
      - "apps/desktop/src/shell/BottomGameDock.tsx"
      - "tests/bottom-game-dock.test.tsx"

concurrency:
  group: ui-03b-red-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  focused-test:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          clean: true
          persist-credentials: false
          show-progress: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Activate pnpm and pin Node
        run: |
          $ErrorActionPreference = "Stop"
          corepack enable
          corepack prepare pnpm@11.11.0 --activate
          $nodeExecutable = (Get-Command node -ErrorAction Stop).Source
          "NODE_EXECUTABLE=$nodeExecutable" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile --reporter=silent
      - name: Run BottomGameDock contract
        run: >-
          & $env:NODE_EXECUTABLE
          node_modules/vitest/vitest.mjs
          run tests/bottom-game-dock.test.tsx
