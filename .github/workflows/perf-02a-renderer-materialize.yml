name: perf-02a-renderer-materialize

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/perf-02a-renderer-materialize.yml"
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: pwsh

jobs:
  materialize:
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          clean: true
          persist-credentials: true
          ref: agent/perf-02a-renderer-fmp
          show-progress: false
      - name: Merge canonical main
        run: |
          $ErrorActionPreference = "Stop"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Activate pnpm
        run: |
          $ErrorActionPreference = "Stop"
          corepack enable
          corepack prepare pnpm@11.11.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --reporter=silent
      - name: Apply canonical formatting and generated docs
        run: |
          $ErrorActionPreference = "Stop"
          pnpm fmt
          node scripts/build-toc.mjs
      - name: Check renderer types
        run: pnpm typecheck
      - name: Run focused renderer milestone tests
        run: pnpm exec vitest run tests/renderer-milestones.test.ts tests/app-renderer-milestones.test.tsx tests/app-routing-lifecycle.test.tsx tests/runtime-desktop-routing.test.tsx
      - name: Remove temporary workflow and commit
        run: |
          $ErrorActionPreference = "Stop"
          Remove-Item .github/workflows/perf-02a-renderer-materialize.yml
          git add apps/desktop/src tests docs .github/workflows/perf-02a-renderer-materialize.yml
          git commit -m "build: materialize PERF-02A renderer milestones"
          git push origin HEAD:agent/perf-02a-renderer-fmp
