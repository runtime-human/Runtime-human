name: docs-perf-02a-e1-closure

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/docs-perf-02a-e1-closure.yml"

permissions:
  contents: write

defaults:
  run:
    shell: pwsh

jobs:
  close-ledger:
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          clean: true
          persist-credentials: true
          ref: docs/perf-02a-e1-status-closure
          show-progress: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Activate pnpm
        run: |
          $ErrorActionPreference = "Stop"
          corepack enable
          corepack prepare pnpm@11.11.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --reporter=silent
      - name: Update canonical execution ledger
        run: |
          $ErrorActionPreference = "Stop"
          @'
          const fs = require("node:fs");

          const statusPath = "docs/EXECUTION-STATUS.jsonc";
          const status = JSON.parse(fs.readFileSync(statusPath, "utf8"));
          status.updated = "2026-07-29";
          status.mainHeadAtCurrentSliceStart = "783f54b17cd7bd4b88c5e7aac4719afa1c0dadac";
          status.currentPhase = "performance-windows-capture-harness";

          const milestone = {
            id: "performance-windows-evidence-contract",
            status: "complete",
            issue: 51,
            pullRequest: 67,
            commit: "783f54b17cd7bd4b88c5e7aac4719afa1c0dadac",
            scope: [
              "versioned-capture-schema",
              "versioned-report-schema",
              "closed-clock-domains",
              "lossless-repeated-span-aggregation",
              "duplicate-capture-rejection",
              "nearest-rank-percentiles",
              "warning-only-budgets",
              "importable-and-direct-report-cli"
            ],
            evidence: {
              captureSchema: "runtime-human-desktop-performance-capture-v1",
              reportSchema: "runtime-human-desktop-performance-evidence-v1",
              runtimeDependenciesAdded: false,
              productionCapabilityChanged: false,
              foundationRun: 1630,
              docsRun: 1241,
              temporaryWorkflowsRemoved: true
            }
          };
          const index = status.milestones.findIndex((candidate) => candidate.id === milestone.id);
          if (index >= 0) status.milestones[index] = milestone;
          else status.milestones.push(milestone);

          status.verification.qualityGate = "complete-pr-67-e1";
          status.verification.currentConstraint =
            "perf-02a-e2-isolated-windows-capture-harness";
          status.verification.currentPullRequestMayMerge = false;
          fs.writeFileSync(statusPath, `${JSON.stringify(status, null, 2)}\n`);

          const indexPath = "docs/INDEX.md";
          const indexText = fs
            .readFileSync(indexPath, "utf8")
            .replace(
              /- \[PERF-02A startup\/IPC\/queue timeline\][^\n]+/u,
              "- [PERF-02A startup/IPC/queue timeline](https://github.com/MrFr3di/Runtime-human/issues/51) — recorder, snapshot, queue/SQLite spans, Tauri linkage, renderer/FMP и E1 capture/report contract завершены; активный срез — isolated Windows capture harness, затем real evidence и одна рекомендация."
            );
          fs.writeFileSync(indexPath, indexText);
          '@ | node
      - name: Regenerate and verify docs
        run: |
          $ErrorActionPreference = "Stop"
          pnpm fmt
          node scripts/build-toc.mjs
          pnpm docs:check
      - name: Remove temporary workflow and commit
        run: |
          $ErrorActionPreference = "Stop"
          Remove-Item .github/workflows/docs-perf-02a-e1-closure.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: close PERF-02A evidence contract"
          git push origin HEAD:docs/perf-02a-e1-status-closure
