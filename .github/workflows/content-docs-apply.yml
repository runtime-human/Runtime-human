name: content-docs-apply

on:
  pull_request:
    branches:
      - main

concurrency:
  group: content-docs-apply-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write

defaults:
  run:
    shell: pwsh

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/compiled-content-foundation' &&
      github.actor == 'MrFr3di'
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          clean: true
          persist-credentials: true
          show-progress: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Generate documentation indexes
        run: node scripts/build-toc.mjs
      - name: Remove temporary documentation workflows
        run: |
          git rm -- .github/workflows/content-docs-preview.yml
          git rm -- .github/workflows/content-docs-apply.yml
      - name: Validate exact scope
        run: |
          $ErrorActionPreference = "Stop"
          $allowed = @(
            'docs/CATALOG.md'
            'docs/MANIFEST.jsonc'
            '.github/workflows/content-docs-preview.yml'
            '.github/workflows/content-docs-apply.yml'
          )
          $changed = @(git status --short | ForEach-Object { $_.Substring(3) })
          $unexpected = @($changed | Where-Object { $_ -notin $allowed })
          if ($unexpected.Count -gt 0) {
            throw "Documentation generation changed unexpected files: $($unexpected -join ', ')"
          }
      - name: Commit generated documentation
        run: |
          $ErrorActionPreference = "Stop"
          git add --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: refresh final generated indexes"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
