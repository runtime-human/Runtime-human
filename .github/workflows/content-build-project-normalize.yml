name: content-build-project-normalize

on:
  pull_request:
    branches:
      - main

concurrency:
  group: content-build-project-normalize-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write

defaults:
  run:
    shell: pwsh

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/january-1990-playable-slice' &&
      github.actor == 'MrFr3di'
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          clean: true
          persist-credentials: true
          show-progress: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.11.0 --activate
      - name: Update exact lockfile
        run: pnpm install --lockfile-only --reporter=silent
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --reporter=silent
      - name: Format repository-owned files
        run: pnpm fmt
      - name: Run focused pipeline tests
        run: |
          pnpm vitest run tests/content-source-loader.test.ts tests/content-artifact-writer.test.ts tests/content-build-project.test.ts
      - name: Run TypeScript and lint gates
        run: |
          pnpm typecheck
          pnpm lint
          pnpm lint:type-aware
      - name: Smoke test CLI write and check
        run: |
          $root = '.tmp-content-cli'
          New-Item -ItemType Directory -Force -Path "$root/content" | Out-Null
          @'
          {
            "schemaVersion": "content-source-v1",
            "id": "reference.cli-smoke",
            "kind": "reference",
            "domain": "bootstrap",
            "era": "1990s",
            "availableFrom": "1990-01",
            "entryPoint": true,
            "references": [],
            "provenance": [{ "sourceId": "design.cli-smoke", "title": "CLI smoke" }],
            "payload": { "title": "CLI smoke" }
          }
          '@ | Set-Content -Encoding utf8 "$root/content/entry.jsonc"
          @'
          {
            "sourceRoots": [".tmp-content-cli/content"],
            "outputRoot": ".tmp-content-cli/output"
          }
          '@ | Set-Content -Encoding utf8 "$root/config.json"
          pnpm run content:build -- --config .tmp-content-cli/config.json
          pnpm run content:check -- --config .tmp-content-cli/config.json
          Remove-Item -Recurse -Force $root
      - name: Finalize Task 3 plan state
        run: |
          $path = 'docs/superpowers/plans/2026-07-24-january-1990-playable-slice.md'
          $content = Get-Content -Raw $path
          $content = $content.Replace('- Create: `content/content.config.json`', '- Create with real January sources in Task 4: `content/content.config.json`')
          $content = $content.Replace('- Modify: `.github/workflows/foundation.yml`', '- Modify with real January sources in Task 4: `.github/workflows/foundation.yml`')
          $content = $content.Replace('- `pnpm content:build` compiles and writes artifacts.', '- `pnpm content:build -- --config <path>` compiles and writes artifacts; the default config is activated in Task 4.')
          $content = $content.Replace('- `pnpm content:check` compiles and exits non-zero if generated output differs.', '- `pnpm content:check -- --config <path>` exits non-zero if generated output differs; permanent CI activation follows real content in Task 4.')
          $content = $content.Replace('- [ ] Write failing CLI fixture tests.', '- [x] Write failing project/CLI fixture tests.')
          $content = $content.Replace('- [ ] Parse only `sourceRoots` and `outputRoot` from config.', '- [x] Parse only `sourceRoots` and `outputRoot` from config.')
          $content = $content.Replace('- [ ] Compile only through `compileContentSources`.', '- [x] Compile only through `compileContentSources`.')
          $content = $content.Replace('- [ ] Add permanent `content:check` before renderer build.', '- [ ] Add permanent `content:check` before renderer build when Task 4 adds the real default config and generated artifacts.')
          $content = $content.Replace('- [ ] Verify build/check idempotence and stale-artifact rejection.', '- [x] Verify build/check idempotence, stale-artifact rejection and CLI write→check.')
          $content = $content.Replace('- [ ] Commit `feat: add production content build command`.', '- [x] Commit `feat: add production content build command`.')
          Set-Content -Path $path -Value $content -Encoding utf8 -NoNewline
      - name: Regenerate documentation indexes
        run: node scripts/build-toc.mjs
      - name: Remove one-shot workflow
        run: git rm -- .github/workflows/content-build-project-normalize.yml
      - name: Validate exact scope
        run: |
          $allowed = @(
            'package.json'
            'pnpm-lock.yaml'
            'tsconfig.json'
            'scripts/build-game-content.ts'
            'scripts/tsconfig.json'
            'packages/game-content-compiler/tsconfig.json'
            'packages/game-content-compiler/src/content-build-config.ts'
            'packages/game-content-compiler/src/format-content-diagnostics.ts'
            'packages/game-content-compiler/src/run-content-build.ts'
            'packages/game-content-compiler/src/index.ts'
            'tests/content-build-project.test.ts'
            'docs/superpowers/plans/2026-07-24-january-1990-playable-slice.md'
            'docs/CATALOG.md'
            'docs/MANIFEST.jsonc'
            '.github/workflows/content-build-project-normalize.yml'
          )
          $changed = @(git status --short | ForEach-Object { $_.Substring(3) })
          $unexpected = @($changed | Where-Object { $_ -notin $allowed })
          if ($unexpected.Count -gt 0) {
            throw "Content build normalization changed unexpected files: $($unexpected -join ', ')"
          }
      - name: Commit verified content build project
        run: |
          git add --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: normalize verified content build project"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
