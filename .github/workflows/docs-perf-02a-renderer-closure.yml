name: docs-perf-02a-renderer-closure

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/docs-perf-02a-renderer-closure.yml"

permissions:
  contents: write

defaults:
  run:
    shell: pwsh

jobs:
  close-ledger:
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          clean: true
          persist-credentials: true
          ref: docs/perf-02a-renderer-status-closure
          show-progress: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Activate pnpm
        run: |
          $ErrorActionPreference = "Stop"
          corepack enable
          corepack prepare pnpm@11.11.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --reporter=silent
      - name: Update canonical execution ledger
        run: |
          $ErrorActionPreference = "Stop"
          @'
          const fs = require("node:fs");

          const statusPath = "docs/EXECUTION-STATUS.jsonc";
          const status = JSON.parse(fs.readFileSync(statusPath, "utf8"));
          status.updated = "2026-07-29";
          status.mainHeadAtCurrentSliceStart = "6472f5c3fac508cdc4cf2827aec34dcd15d8916d";
          status.currentPhase = "performance-evidence-collection";

          const milestone = {
            id: "performance-renderer-fmp-milestones",
            status: "complete",
            issue: 51,
            pullRequest: 65,
            commit: "6472f5c3fac508cdc4cf2827aec34dcd15d8916d",
            scope: [
              "renderer-bootstrap-mark",
              "react-shell-commit-mark",
              "january-session-ready-mark",
              "frame-boundary-first-meaningful-paint",
              "strict-mode-safe-idempotency",
              "failure-safe-user-timing"
            ],
            evidence: {
              milestoneNames: [
                "app.renderer_bootstrap",
                "app.react_shell_commit",
                "app.january_session_ready",
                "app.first_meaningful_paint"
              ],
              rendererWritesRustTelemetry: false,
              failedBootstrapProducesFmp: false,
              foundationRun: 1595,
              docsRun: 1200,
              temporaryWorkflowsRemoved: true
            }
          };
          const index = status.milestones.findIndex((candidate) => candidate.id === milestone.id);
          if (index >= 0) status.milestones[index] = milestone;
          else status.milestones.push(milestone);

          status.verification.qualityGate = "complete-pr-65";
          status.verification.currentConstraint =
            "perf-02a-windows-evidence-then-one-recommendation";
          status.verification.currentPullRequestMayMerge = false;
          fs.writeFileSync(statusPath, `${JSON.stringify(status, null, 2)}\n`);

          const planPath = "docs/plans/PERF-02A-RENDERER-FMP-IMPLEMENTATION-PLAN.md";
          fs.writeFileSync(
            planPath,
            fs.readFileSync(planPath, "utf8").replace("status: draft", "status: completed")
          );

          const indexPath = "docs/INDEX.md";
          const indexText = fs
            .readFileSync(indexPath, "utf8")
            .replace(
              /- \[PERF-02A startup\/IPC\/queue timeline\][^\n]+/u,
              "- [PERF-02A startup/IPC/queue timeline](https://github.com/MrFr3di/Runtime-human/issues/51) — Rust startup, read-only snapshot, queue/SQLite spans, Tauri linkage и renderer/FMP завершены; остаётся opt-in Windows evidence collector и одна доказанная рекомендация."
            );
          fs.writeFileSync(indexPath, indexText);
          '@ | node
      - name: Regenerate and verify docs
        run: |
          $ErrorActionPreference = "Stop"
          pnpm fmt
          node scripts/build-toc.mjs
          pnpm docs:check
      - name: Remove temporary workflow and commit
        run: |
          $ErrorActionPreference = "Stop"
          Remove-Item .github/workflows/docs-perf-02a-renderer-closure.yml
          git add docs .github/workflows/docs-perf-02a-renderer-closure.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: close PERF-02A renderer milestones"
          git push origin HEAD:docs/perf-02a-renderer-status-closure
