name: docs-materialize-rh

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ github.event.pull_request.head.repo.full_name == 'runtime-human/Runtime-human' && github.event.pull_request.head.ref == 'feat/remote-rh-readonly-v1' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact integration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/remote-rh-readonly-v1
          persist-credentials: true
          show-progress: false
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.20.0"
          package-manager-cache: false

      - name: Generate canonical docs
        run: node scripts/build-toc.mjs

      - name: Commit only generated docs
        run: |
          git add -- docs/CATALOG.md docs/MANIFEST.jsonc
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: refresh generated catalog"
          git push origin HEAD:feat/remote-rh-readonly-v1
