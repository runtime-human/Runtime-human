name: perf-02a-e1-red

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/perf-02a-e1-red.yml"

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  red:
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          clean: true
          ref: agent/perf-02a-windows-evidence
          show-progress: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Activate pnpm
        run: |
          $ErrorActionPreference = "Stop"
          corepack enable
          corepack prepare pnpm@11.11.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --reporter=silent
      - name: Run E1 focused tests
        run: pnpm exec vitest run tests/desktop-performance-evidence.test.ts tests/desktop-performance-evidence-cli.test.ts
