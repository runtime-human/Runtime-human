name: pr27-lockfile

on:
  push:
    branches:
      - agent/january-1990-content-projection
    paths:
      - packages/game-application/package.json
      - packages/game-application/tsconfig.json
      - .github/workflows/pr27-lockfile.yml

permissions:
  contents: write

defaults:
  run:
    shell: pwsh

jobs:
  update-lockfile:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/january-1990-content-projection
          clean: true
          persist-credentials: true
          show-progress: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Activate pnpm
        run: |
          $ErrorActionPreference = "Stop"
          corepack enable
          corepack prepare pnpm@11.11.0 --activate
      - name: Refresh importer and remove updater
        run: |
          $ErrorActionPreference = "Stop"
          pnpm install --lockfile-only --reporter=silent
          git config user.name "runtime-human-ci"
          git config user.email "runtime-human-ci@users.noreply.github.com"
          git add pnpm-lock.yaml
          git rm .github/workflows/pr27-lockfile.yml
          git commit -m "build: refresh application content lockfile"
          git push origin HEAD:agent/january-1990-content-projection
