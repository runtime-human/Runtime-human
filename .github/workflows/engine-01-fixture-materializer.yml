name: engine-01-fixture-materializer

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  materialize:
    if: github.event.pull_request.number == 126
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          show-progress: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: "11.11.0"
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.20.0"
          package-manager-cache: false

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile --reporter=silent

      - name: Materialize current January E2 fixtures
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          pnpm evidence:january:e2
          if ($LASTEXITCODE -ne 0) {
            throw "January E2 fixture materialization failed with exit code $LASTEXITCODE"
          }
          New-Item -ItemType Directory -Force -Path "artifacts/engine-01" | Out-Null
          Copy-Item `
            "fixtures/persistence/january-1990-persistence-flow-v1.json" `
            "artifacts/engine-01/january-1990-persistence-flow-v1.json"

      - name: Upload generated fixture
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: engine-01-persistence-fixture-${{ github.event.pull_request.head.sha }}
          path: artifacts/engine-01/january-1990-persistence-flow-v1.json
          if-no-files-found: error
          retention-days: 1
