name: engine-03g-format-probe

on:
  push:
    branches:
      - engine/03g-automatic-simulation-repro

permissions:
  contents: read

jobs:
  format-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          show-progress: false
          fetch-depth: 1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: "11.11.0"
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.20.0"
          package-manager-cache: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --reporter=silent
      - name: Render canonical formatting diff
        shell: pwsh
        run: |
          pnpm exec oxfmt packages/game-simulation/src/january-failure-repro-v3.ts scripts/gamectl-repro.ts scripts/gamectl.ts scripts/tsconfig.json
          git diff -- packages/game-simulation/src/january-failure-repro-v3.ts scripts/gamectl-repro.ts scripts/gamectl.ts scripts/tsconfig.json
