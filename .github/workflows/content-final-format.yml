name: content-final-format

on:
  pull_request:
    branches:
      - main

concurrency:
  group: content-final-format-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write

defaults:
  run:
    shell: pwsh

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/compiled-content-foundation' &&
      github.actor == 'MrFr3di'
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          clean: true
          persist-credentials: true
          show-progress: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Activate pnpm
        run: |
          $ErrorActionPreference = "Stop"
          corepack enable
          corepack prepare pnpm@11.11.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --reporter=silent
      - name: Apply repository formatter
        run: pnpm fmt
      - name: Remove temporary workflows
        run: |
          git rm -- .github/workflows/content-final-source-normalize.yml
          git rm -- .github/workflows/content-final-format.yml
      - name: Validate existing PR scope
        run: |
          $ErrorActionPreference = "Stop"
          $allowed = @(
            'package.json'
            'tsconfig.base.json'
            'tsconfig.json'
            'vitest.config.ts'
            'packages/game-content/package.json'
            'packages/game-content/src/compiled-content.ts'
            'packages/game-content/src/index.ts'
            'packages/game-content-compiler/package.json'
            'packages/game-content-compiler/src/build-content-bundle.ts'
            'packages/game-content-compiler/src/compile-content-sources.ts'
            'packages/game-content-compiler/src/content-diagnostics.ts'
            'packages/game-content-compiler/src/content-source-schema.ts'
            'packages/game-content-compiler/src/content-types.ts'
            'packages/game-content-compiler/src/index.ts'
            'packages/game-content-compiler/src/parse-content-sources.ts'
            'packages/game-content-compiler/src/validate-content-graph.ts'
            'packages/game-content-compiler/tsconfig.json'
            'scripts/check-boundaries.mjs'
            'scripts/check-build-only-dependencies.mjs'
            'tests/check-boundaries.test.ts'
            'tests/check-build-only-dependencies.test.ts'
            'tests/content-compiler-bundle-boundary.test.ts'
            'tests/content-compiler-chronology-boundaries.test.ts'
            'tests/content-compiler-golden.test.ts'
            'tests/content-compiler-invariants.test.ts'
            'tests/content-compiler-ordering.test.ts'
            'tests/content-compiler-parser-boundary.test.ts'
            'tests/content-compiler.test.ts'
            'tests/fixtures/content-compiler/valid/1980s-technology.jsonc'
            'tests/fixtures/content-compiler/valid/1990s-storylet.jsonc'
            'tests/fixtures/content-compiler/valid/2000s-event.jsonc'
            'tests/tsconfig.json'
            '.github/workflows/content-final-source-normalize.yml'
            '.github/workflows/content-final-format.yml'
          )
          $changed = @(git status --short | ForEach-Object { $_.Substring(3) })
          $unexpected = @($changed | Where-Object { $_ -notin $allowed })
          if ($unexpected.Count -gt 0) {
            throw "Repository formatter changed files outside PR scope: $($unexpected -join ', ')"
          }
      - name: Commit final formatting
        run: |
          $ErrorActionPreference = "Stop"
          git add --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: apply final repository formatting"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
