name: content-final-format

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

defaults:
  run:
    shell: pwsh

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/compiled-content-foundation' &&
      github.actor == 'MrFr3di'
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          clean: true
          persist-credentials: true
          show-progress: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.11.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --reporter=silent
      - name: Format final content files
        run: |
          pnpm exec oxfmt --no-error-on-unmatched-pattern `
            packages/game-content-compiler/src/parse-content-sources.ts `
            tests/content-compiler-parser-boundary.test.ts `
            tests/content-compiler-chronology-boundaries.test.ts
      - name: Remove one-shot workflow
        run: git rm -- .github/workflows/content-final-format.yml
      - name: Validate exact scope
        run: |
          $allowed = @(
            '.github/workflows/content-final-format.yml'
            'packages/game-content-compiler/src/parse-content-sources.ts'
            'tests/content-compiler-parser-boundary.test.ts'
            'tests/content-compiler-chronology-boundaries.test.ts'
          )
          $changed = @(git status --short | ForEach-Object { $_.Substring(3) })
          $unexpected = @($changed | Where-Object { $_ -notin $allowed })
          if ($unexpected.Count -gt 0) {
            throw "Formatter changed unexpected files: $($unexpected -join ', ')"
          }
      - name: Commit formatting
        run: |
          git add --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: format final content compiler changes"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
