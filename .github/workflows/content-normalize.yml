name: content-normalize

on:
  pull_request:
    branches:
      - main

concurrency:
  group: content-normalize-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write

defaults:
  run:
    shell: pwsh

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/compiled-content-foundation' &&
      github.actor == 'MrFr3di'
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          clean: true
          persist-credentials: true
          show-progress: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Activate pnpm
        run: |
          $ErrorActionPreference = "Stop"
          corepack enable
          corepack prepare pnpm@11.11.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --reporter=silent
      - name: Apply CONTENT-01 formatting
        run: |
          pnpm exec oxfmt --no-error-on-unmatched-pattern `
            package.json `
            tsconfig.base.json `
            tsconfig.json `
            packages/game-content/src/compiled-content.ts `
            packages/game-content/src/index.ts `
            packages/game-content-compiler/package.json `
            packages/game-content-compiler/tsconfig.json `
            packages/game-content-compiler/src/*.ts `
            tests/check-boundaries.test.ts `
            tests/content-compiler.test.ts `
            tests/content-compiler-invariants.test.ts `
            tests/content-compiler-parser-boundary.test.ts `
            tests/content-compiler-ordering.test.ts `
            tests/content-compiler-golden.test.ts `
            tests/check-build-only-dependencies.test.ts `
            tests/fixtures/content-compiler/valid/*.jsonc `
            tests/tsconfig.json `
            scripts/check-boundaries.mjs `
            scripts/check-build-only-dependencies.mjs
      - name: Regenerate documentation indexes
        run: node scripts/build-toc.mjs
      - name: Remove one-shot workflow
        run: git rm -- .github/workflows/content-normalize.yml
      - name: Validate exact scope
        run: |
          $ErrorActionPreference = "Stop"
          $allowed = @(
            '.github/workflows/content-normalize.yml'
            'docs/CATALOG.md'
            'docs/MANIFEST.jsonc'
            'package.json'
            'tsconfig.base.json'
            'tsconfig.json'
            'packages/game-content/src/compiled-content.ts'
            'packages/game-content/src/index.ts'
            'packages/game-content-compiler/package.json'
            'packages/game-content-compiler/tsconfig.json'
            'packages/game-content-compiler/src/build-content-bundle.ts'
            'packages/game-content-compiler/src/compile-content-sources.ts'
            'packages/game-content-compiler/src/content-diagnostics.ts'
            'packages/game-content-compiler/src/content-source-schema.ts'
            'packages/game-content-compiler/src/content-types.ts'
            'packages/game-content-compiler/src/index.ts'
            'packages/game-content-compiler/src/parse-content-sources.ts'
            'packages/game-content-compiler/src/validate-content-graph.ts'
            'tests/check-boundaries.test.ts'
            'tests/check-build-only-dependencies.test.ts'
            'tests/content-compiler.test.ts'
            'tests/content-compiler-invariants.test.ts'
            'tests/content-compiler-parser-boundary.test.ts'
            'tests/content-compiler-ordering.test.ts'
            'tests/content-compiler-golden.test.ts'
            'tests/fixtures/content-compiler/valid/1980s-technology.jsonc'
            'tests/fixtures/content-compiler/valid/1990s-storylet.jsonc'
            'tests/fixtures/content-compiler/valid/2000s-event.jsonc'
            'tests/tsconfig.json'
            'scripts/check-boundaries.mjs'
            'scripts/check-build-only-dependencies.mjs'
          )
          $changed = @(git status --short | ForEach-Object { $_.Substring(3) })
          $unexpected = @($changed | Where-Object { $_ -notin $allowed })
          if ($unexpected.Count -gt 0) {
            throw "Normalization changed unexpected files: $($unexpected -join ', ')"
          }
      - name: Commit normalization
        run: |
          $ErrorActionPreference = "Stop"
          git add --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: normalize compiled content implementation"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
