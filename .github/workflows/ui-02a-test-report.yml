name: ui-02a-test-report

on:
  pull_request:
    paths:
      - ".github/workflows/ui-02a-test-report.yml"

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  report:
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          clean: true
          persist-credentials: false
          show-progress: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Install dependencies
        run: |
          corepack enable
          corepack prepare pnpm@11.11.0 --activate
          corepack pnpm install --frozen-lockfile --reporter=silent
      - name: Capture complete Vitest JSON report
        id: vitest
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/ui-02a-tests | Out-Null
          corepack pnpm exec vitest run --reporter=json --outputFile=artifacts/ui-02a-tests/vitest.json
      - name: Upload Vitest report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ui-02a-vitest-report
          path: artifacts/ui-02a-tests/vitest.json
          if-no-files-found: error
          retention-days: 1
      - name: Preserve failing diagnostic status
        if: steps.vitest.outcome == 'failure'
        run: throw "Full Vitest suite failed; inspect ui-02a-vitest-report"
