name: feedback

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - converted_to_draft
      - ready_for_review

concurrency:
  group: feedback-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  fast-feedback:
    name: fast feedback / windows-2025
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          show-progress: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: "11.11.0"
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.20.0"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify JavaScript toolchain
        run: |
          $ErrorActionPreference = "Stop"
          node --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --reporter=silent

      - name: Materialize January E2 fixture
        run: pnpm evidence:january:e2

      - name: Upload January persistence fixture
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: january-rng-cutover-fixture-${{ github.event.pull_request.head.sha }}
          path: fixtures/persistence/january-1990-persistence-flow-v1.json
          retention-days: 1
          if-no-files-found: error

      - name: Run non-authoritative fast feedback
        run: pnpm check:fast
