name: feedback

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - converted_to_draft
      - ready_for_review

concurrency:
  group: feedback-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write

defaults:
  run:
    shell: pwsh

jobs:
  fast-feedback:
    name: fast feedback / windows-2025
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
          show-progress: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: "11.11.0"
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.20.0"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify JavaScript toolchain
        run: |
          $ErrorActionPreference = "Stop"
          node --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --reporter=silent

      - name: Materialize January E2 fixture
        run: pnpm evidence:january:e2

      - name: Commit January persistence fixture
        run: |
          $ErrorActionPreference = "Stop"
          git add -- fixtures/persistence/january-1990-persistence-flow-v1.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "January persistence fixture is already current"
          } elseif ($LASTEXITCODE -eq 1) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "test(application): refresh January RNG cutover fixture"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            throw "Unable to inspect staged January persistence fixture"
          }

      - name: Run non-authoritative fast feedback
        run: pnpm check:fast
