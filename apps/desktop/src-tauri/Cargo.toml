[package]
name = "runtime-human-desktop"
version = "0.0.1"
description = "Runtime Human desktop shell"
edition = "2024"
rust-version = "1.97"
publish = false

[build-dependencies]
tauri-build = "=2.6.3"

[dependencies]
rusqlite = { version = "=0.40.1", features = ["backup", "bundled", "limits"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.11.0"
tauri = "=2.11.5"

[dev-dependencies]
rand_xoshiro = "=0.8.1"
tempfile = "=3.27.0"
