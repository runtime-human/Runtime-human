[package]
name = "runtime-human-desktop"
version = "0.0.1"
description = "Runtime Human desktop shell"
edition = "2024"
rust-version = "1.97.1"
publish = false

[features]
default = []
performance-evidence = ["dep:tauri-plugin-wdio-webdriver"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
rusqlite = { version = "=0.40.1", default-features = false, features = [
  "backup",
  "bundled",
  "cache",
  "fallible_uint",
  "limits",
] }
rusqlite_migration = "=2.6.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.11.0"
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-wdio-webdriver = { version = "1", optional = true }
thiserror = "=2.0.19"
tracing = "=0.1.44"
tracing-appender = "=0.2.5"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = [
  "env-filter",
  "fmt",
  "json",
  "registry",
  "std",
] }

[dev-dependencies]
rand_xoshiro = "=0.8.1"
tempfile = "=3.27.0"
